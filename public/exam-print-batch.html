<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量打印</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e8e5df; font-family: 'Noto Serif SC', 'SimSun', 'STSong', '宋体', serif; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }

  .progress-panel {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
  }
  .progress-box {
    background: #fff; border-radius: 16px; padding: 24px 32px; width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,.2); position: relative;
  }
  .progress-close {
    position: absolute; top: 12px; right: 12px; width: 24px; height: 24px;
    border: none; background: none; cursor: pointer; font-size: 18px; color: #999;
    line-height: 1;
  }
  .progress-close:hover { color: #333; }
  .progress-title { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 16px; text-align: center; padding-right: 20px; }
  .progress-info { font-size: 14px; color: #666; text-align: center; margin-bottom: 12px; }
  .progress-bar-wrap { width: 100%; height: 10px; background: #E5F0FF; border-radius: 5px; overflow: hidden; margin-bottom: 16px; }
  .progress-bar { height: 100%; background: linear-gradient(90deg,#4A90E2,#65B3FF); border-radius: 5px; transition: width 0.3s; }
  .progress-status { font-size: 12px; color: #999; text-align: center; margin-bottom: 20px; min-height: 18px; }
  .progress-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-start { padding: 10px 16px; flex: 1; background: linear-gradient(135deg,#4A90E2,#65B3FF); color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .btn-start:hover { background: linear-gradient(135deg,#3A7BD5,#5599EE); }
  .btn-reprint { padding: 10px 16px; flex: 1; background: #f59e0b; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .btn-reprint:hover { background: #d97706; }
  .btn-continue { padding: 10px 16px; flex: 1; background: linear-gradient(135deg,#4A90E2,#65B3FF); color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .btn-continue:hover { background: linear-gradient(135deg,#3A7BD5,#5599EE); }
  .btn-finish { padding: 10px 16px; flex: 1; background: #22C55E; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .btn-finish:hover { background: #16a34a; }
  .btn-stop { padding: 10px 16px; flex: 1; background: #fff; color: #666; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .btn-stop:hover { background: #f5f5f5; }

  .preview-wrap { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; flex: 1; }
  .preview-toolbar {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border-radius: 8px; padding: 10px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.12); font-size: 13px; color: #555;
    width: 100%; max-width: 1100px;
  }
  .btn-print { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 18px; font-size: 13px; background: #1a1a1a; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .btn-print:hover { background: #333; }
  .btn-close { padding: 7px 14px; font-size: 13px; background: #fff; color: #333; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }

  .a3-sheet {
    width: 420mm; height: 297mm; background: #fff;
    display: grid; grid-template-columns: 1fr 1fr;
    box-shadow: 0 4px 24px rgba(0,0,0,.18); page-break-after: always;
  }
  .page { padding: 8mm 10mm 6mm; display: flex; flex-direction: column; overflow: hidden; border-right: 1px dashed #ccc; }
  .page:last-child { border-right: none; }

  .left-header { position: relative; text-align: center; padding-bottom: 5mm; margin-bottom: 4mm; margin-top: 5mm; border-bottom: 1.2pt solid #1a1a1a; }
  .header-logo { position: absolute; left: -1mm; top: -5mm; height: 10mm; width: auto; }
  .exam-subject { display: flex; justify-content: center; align-items: baseline; font-size: 18pt; font-weight: 700; letter-spacing: .22em; line-height: 1.2; margin-bottom: 2mm; text-align: center; margin-right: -4em; }
  .eval-tag { font-size: 14pt; color: #666; }

  .right-header { padding-bottom: 5mm; margin-bottom: 4mm; border-bottom: 1.2pt solid #1a1a1a; display: flex; align-items: flex-end; justify-content: flex-end; }

  .info-row { display: flex; align-items: baseline; padding-bottom: 3mm; margin-bottom: 4mm; }
  .info-cell { display: flex; align-items: baseline; gap: 2mm; font-size: 10pt; white-space: nowrap; padding: 0 5mm; }
  .info-cell:first-child { padding-left: 0; }
  .info-cell:last-child { padding-right: 0; margin-left: auto; }
  .info-lbl { color: #666; }
  .info-val { font-weight: 600; text-align: center; border-bottom: .5pt solid #ccc; padding-bottom: .5mm; display: inline-block; }
  .info-val.short { min-width: 18mm; }
  #totalScore { min-width: 15mm; display: inline-block; border-bottom: .5pt solid #ccc; font-size: 12pt; font-weight: 700; }
  #submittedAt { min-width: 35mm; display: inline-block; border-bottom: .5pt solid #ccc; }

  .sec-head { font-size: 9pt; font-weight: 700; letter-spacing: .12em; color: #1a1a1a; margin: 3mm 0 2mm; display: flex; align-items: center; gap: 4mm; }
  .sec-head::after { content: ''; flex: 1; height: .5pt; background: #e8e5df; }

  .q-list { display: flex; flex-direction: column; }
  .q-row { display: flex; align-items: flex-start; padding: 1.5mm 0; border-bottom: .5pt solid #f0ede8; gap: 2.5mm; }
  .q-row:last-child { border-bottom: none; }
  .q-no { font-size: 9pt; color: #1a1a1a; min-width: 7mm; text-align: right; padding-top: .5mm; flex-shrink: 0; font-weight: 500; }
  .q-content { flex: 1; min-width: 0; }
  .q-text { font-size: 9pt; color: #1a1a1a; line-height: 1.4; margin-bottom: 1mm; max-width: 165mm; word-wrap: break-word; }
  .q-ans-line { display: flex; align-items: center; gap: 2mm; }
  .ans-tag { font-size: 9pt; color: #1a1a1a; }
  .ans-tag::after { content: '：'; }
  .ans-text { font-size: 9pt; font-weight: 600; color: #1a1a1a; }
  .q-opts { margin-top: 1mm; font-size: 9pt; color: #1a1a1a; }
  .q-opt { display: inline-block; margin-right: 6mm; margin-bottom: .5mm; }
  .opt-label { font-weight: 600; color: #1a1a1a; }
  .x-mark { flex-shrink: 0; display: inline-flex; align-items: center; margin-left: auto; }
  .x-mark svg { width: 10px; height: 10px; }

  .page-foot { margin-top: auto; padding-top: 2.5mm; border-top: .5pt solid #e8e5df; display: flex; justify-content: space-between; align-items: center; font-size: 9pt; color: #666; }

  @media print {
    @page { size: A3 landscape; margin: 0; }
    body { background: #fff; }
    .preview-wrap { padding: 0; background: none; }
    .preview-toolbar { display: none !important; }
    .progress-panel { display: none !important; }
    .a3-sheet { width: 420mm; height: 297mm; box-shadow: none; page-break-after: always; }
    * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  }
</style>
</head>
<body>

<!-- 进度面板 -->
<div id="progressPanel" class="progress-panel">
  <div class="progress-box">
    <button class="progress-close" onclick="closePanel()">×</button>
    <div class="progress-title" id="progressTitle">批量打印</div>
    <div class="info-row" style="padding-bottom:3mm;margin-bottom:4mm;justify-content:center;">
      <div class="info-cell" style="padding:0;margin-left:0;"><span class="info-lbl">已加载 </span><span id="progressLoaded">0</span><span class="info-lbl"> 份/共 </span><span id="progressTotal">0</span><span class="info-lbl"> 份</span></div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-status" id="progressStatus"></div>
    <div class="progress-btns" id="progressBtns">
      <button class="btn-start" id="btnStart" onclick="startPrint()">开始打印</button>
    </div>
  </div>
</div>

<div class="preview-wrap">
  <div class="preview-toolbar">
    <span id="batchTitle">批量打印</span>
    <div style="flex:1;"></div>
    <button class="btn-print" onclick="showProgressPanel()" style="min-width:120px;display:flex;align-items:center;justify-content:center;">批量打印</button>
    <button class="btn-print" onclick="exportAllToPDF()" id="btnExportPDF" style="position:relative;overflow:hidden;min-width:120px;display:flex;align-items:center;justify-content:center;">
      <span id="btnExportText" style="position:relative;z-index:1;">导出PDF</span>
      <div id="btnExportProgress" style="position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,0.3);width:0%;transition:width 0.2s;"></div>
    </button>
    <button class="btn-close" onclick="window.close()">关闭</button>
  </div>
  <div id="content"></div>
</div>

<script src="/js/admin-session.js"></script>
<script>
const API = window.location.origin + '/api';
const token = window.AdminSession && window.AdminSession.requireValid
    ? window.AdminSession.requireValid()
    : (localStorage.getItem('token') || localStorage.getItem('adminToken') || '');
const BATCH_SIZE = 10;

let allRecordIds = [];
let allLoadedHtml = '';        // 所有已加载的HTML（用于预览）
let currentBatchHtml = '';    // 当前批次HTML（用于打印）
let currentIndex = 0;
let isStopped = false;

function getRecordIds() {
    const params = new URLSearchParams(window.location.search);
    return params.get('ids') ? params.get('ids').split(',') : [];
}

function formatDate(str) {
    if (!str) return '-';
    const d = new Date(str);
    return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function formatAnswer(type, answer) {
    if (!answer) return '';
    if (type === 'multiple_choice') return answer.split(',').map(a => a.trim()).join('、');
    if (type === 'true_false') return (answer === '√' || answer === 'T' || answer === '1') ? '√' : '×';
    return answer;
}

function notifyPrinted(recordIds) {
    // 通知父窗口标记为已打印
    if (window.opener && window.opener.markBatchPrinted) {
        window.opener.markBatchPrinted(recordIds);
    }
}

function renderPage(exam, pageNum, totalPages) {
    const qs = exam.questions || [];
    const singleQs = qs.filter(q => q.type === 'single_choice');
    const multiQs = qs.filter(q => q.type === 'multiple_choice');
    const tfQs = qs.filter(q => q.type === 'true_false');

    const sections = [];
    let num = 1;
    if (tfQs.length > 0) { sections.push({ label: '判断题', qs: tfQs, startNum: num }); num += tfQs.length; }
    if (singleQs.length > 0) { sections.push({ label: '单选题', qs: singleQs, startNum: num }); num += singleQs.length; }
    if (multiQs.length > 0) { sections.push({ label: '多选题', qs: multiQs, startNum: num }); num += multiQs.length; }
    const otherQs = qs.filter(q => !['single_choice', 'multiple_choice', 'true_false'].includes(q.type));
    if (otherQs.length > 0) { sections.push({ label: '其他', qs: otherQs, startNum: num }); }

    const totalQ = qs.length;
    const LEFT_COUNT = Math.floor(totalQ * 0.56);
    const leftCount = Math.min(LEFT_COUNT, totalQ);

    let leftHtml = '';
    let rightHtml = '';
    let leftUsed = 0;

    sections.forEach(section => {
        let sectionHasLeft = false;
        let sectionHasRight = false;
        for (let i = 0; i < section.qs.length; i++) {
            if (leftUsed < leftCount) sectionHasLeft = true;
            else sectionHasRight = true;
        }
        for (let i = 0; i < section.qs.length; i++) {
            const q = section.qs[i];
            const qNum = section.startNum + i;
            const userAnswer = formatAnswer(q.type, q.userAnswer);
            const isCorrect = q.isCorrect;

            let optsHtml = '';
            if (q.type === 'single_choice' || q.type === 'multiple_choice') {
                if (q.options && q.options.length > 0) {
                    optsHtml = '<div class="q-opts">' + q.options.map((opt, idx) => `<span class="q-opt"><span class="opt-label">${String.fromCharCode(65+idx)}.</span>${opt}</span>`).join('') + '</div>';
                }
            }

            const answerText = userAnswer || '(未作答)';
            const xMarkSvg = `<svg viewBox="0 0 14 14" fill="none"><line x1="2" y1="2" x2="12" y2="12" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="2" x2="2" y2="12" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/></svg>`;
            const xMarkHtml = !isCorrect ? `<span class="x-mark">${xMarkSvg}</span>` : '';

            const qHtml = `<div class="q-row"><span class="q-no">${qNum}.</span><div class="q-content"><div class="q-text">${q.content}</div>${optsHtml}<div class="q-ans-line"><span class="ans-tag">答</span><span class="ans-text">${answerText}</span>${xMarkHtml}</div></div></div>`;

            if (leftUsed < leftCount) {
                if (i === 0) leftHtml += `<div class="sec-head">${section.label}${sectionHasRight ? '（续）' : ''}</div>`;
                leftHtml += qHtml;
                leftUsed++;
            } else {
                rightHtml += qHtml;
            }
        }
    });

    const rightHeader = (pageNum < totalPages) ? '<div class="right-header"></div>' : '';

    return `<div class="a3-sheet">
<div class="page">
<div class="left-header">
<img src="/images/company-logo.jpg" alt="logo" class="header-logo">
<div class="exam-subject"><span>${exam.examTitle || '考试试卷'}</span><span class="eval-tag">（评估）</span></div>
</div>
<div class="info-row">
<div class="info-cell"><span class="info-lbl">姓名 </span><span class="info-val short">${exam.staffName || '-'}</span></div>
<div class="info-cell"><span class="info-lbl">工号 </span><span class="info-val short">${exam.employeeId || '-'}</span></div>
<div class="info-cell"><span class="info-lbl">提交时间 </span><span class="info-val">${formatDate(exam.submittedAt)}</span></div>
<div class="info-cell"><span class="info-lbl">得分 </span><span class="info-val">${exam.totalScore ?? 0}</span></div>
</div>
<div class="q-list">${leftHtml}</div>
<div class="page-foot"><span>第 ${pageNum} 页</span></div>
</div>
<div class="page">
${rightHeader}
<div class="q-list">${rightHtml}</div>
<div class="page-foot"><span>第 ${pageNum} 页</span><span>打印时间：${formatDate(new Date().toISOString())}</span></div>
</div>
</div>`;
}

function updateUI() {
    const total = allRecordIds.length;
    const loaded = currentIndex;
    document.getElementById('progressTotal').textContent = total;
    document.getElementById('progressLoaded').textContent = loaded;
    document.getElementById('progressBar').style.width = (total > 0 ? loaded / total * 100 : 0) + '%';
}

function showButtons(type) {
    const btns = document.getElementById('progressBtns');
    if (type === 'start') {
        btns.innerHTML = '<button class="btn-start" onclick="startPrint()">开始打印</button>';
    } else if (type === 'printing') {
        const remaining = allRecordIds.length - currentIndex;
        if (remaining > 0) {
            btns.innerHTML = `
                <button class="btn-reprint" onclick="reprintLastBatch()">重新打印</button>
                <button class="btn-continue" onclick="continuePrint()">继续打印</button>
                <button class="btn-stop" onclick="stopPrint()">停止打印</button>
            `;
        } else {
            btns.innerHTML = `
                <button class="btn-reprint" onclick="reprintLastBatch()">重新打印</button>
                <button class="btn-finish" onclick="finishPrint()">完成打印</button>
            `;
        }
    }
}

function showProgressPanel() {
    document.getElementById('progressPanel').style.display = 'flex';
    // 如果还没有开始，或者已经全部打印完，则从头开始
    if (currentIndex === 0 || currentIndex >= allRecordIds.length) {
        currentIndex = 0;
        allLoadedHtml = '';
    }
    showButtons('start');
    updateUI();
}

async function startPrint() {
    showButtons('loading');
    document.getElementById('progressStatus').textContent = '正在加载...';

    const batchSize = Math.min(BATCH_SIZE, allRecordIds.length - currentIndex);
    currentBatchHtml = '';
    const startIdx = currentIndex;
    const batchLoadedIds = [];

    for (let i = 0; i < batchSize; i++) {
        if (isStopped) return;
        try {
            const res = await fetch(`${API}/exam/admin/${allRecordIds[startIdx + i]}/print`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.code === 0) {
                const pageHtml = renderPage(data.data, startIdx + i + 1, allRecordIds.length);
                allLoadedHtml += pageHtml;
                currentBatchHtml += pageHtml;
                batchLoadedIds.push(allRecordIds[startIdx + i]);
            }
        } catch (err) { console.error('加载失败:', err); }
        currentIndex = startIdx + i + 1;
        updateUI();
        await new Promise(resolve => setTimeout(resolve, 80));
    }

    if (!isStopped) {
        // 标记本批次已打印
        notifyPrinted(batchLoadedIds);
        document.getElementById('content').innerHTML = allLoadedHtml;
        showButtons('printing');
        document.getElementById('progressStatus').textContent = `已加载 ${currentIndex} 份`;
        // 渲染完成后弹出打印
        setTimeout(() => {
            const temp = document.getElementById('content').innerHTML;
            document.getElementById('content').innerHTML = currentBatchHtml;
            window.print();
            document.getElementById('content').innerHTML = temp;
        }, 200);
    }
}

function reprintLastBatch() {
    // 只打印上一次渲染的
    const temp = document.getElementById('content').innerHTML;
    document.getElementById('content').innerHTML = currentBatchHtml;
    window.print();
    document.getElementById('content').innerHTML = temp;
}

async function continuePrint() {
    showButtons('loading');
    document.getElementById('progressStatus').textContent = '正在加载...';

    const batchSize = Math.min(BATCH_SIZE, allRecordIds.length - currentIndex);
    currentBatchHtml = '';
    const startIdx = currentIndex;
    const batchLoadedIds = [];

    for (let i = 0; i < batchSize; i++) {
        if (isStopped) return;
        try {
            const res = await fetch(`${API}/exam/admin/${allRecordIds[startIdx + i]}/print`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.code === 0) {
                const pageHtml = renderPage(data.data, startIdx + i + 1, allRecordIds.length);
                allLoadedHtml += pageHtml;
                currentBatchHtml += pageHtml;
                batchLoadedIds.push(allRecordIds[startIdx + i]);
            }
        } catch (err) { console.error('加载失败:', err); }
        currentIndex = startIdx + i + 1;
        updateUI();
        await new Promise(resolve => setTimeout(resolve, 80));
    }

    if (!isStopped) {
        // 标记本批次已打印
        notifyPrinted(batchLoadedIds);
        document.getElementById('content').innerHTML = allLoadedHtml;
        showButtons('printing');
        document.getElementById('progressStatus').textContent = `已加载 ${currentIndex} 份`;
        // 渲染完成后1秒弹出打印（只打印新加载的）
        setTimeout(() => {
            const temp = document.getElementById('content').innerHTML;
            document.getElementById('content').innerHTML = currentBatchHtml;
            window.print();
            document.getElementById('content').innerHTML = temp;
        }, 200);
    }
}

function stopPrint() {
    isStopped = true;
    document.getElementById('progressStatus').textContent = '已停止';
    document.getElementById('progressBtns').innerHTML = '<button class="btn-stop" onclick="closePanel()">关闭</button>';
}

function finishPrint() {
    closePanel();
}

function closePanel() {
    document.getElementById('progressPanel').style.display = 'none';
}

// 导出PDF：一次性加载所有页面并弹出打印
async function exportAllToPDF() {
    const btn = document.getElementById('btnExportPDF');
    const btnText = document.getElementById('btnExportText');
    const btnProgress = document.getElementById('btnExportProgress');
    btn.disabled = true;

    const total = allRecordIds.length;
    let loadedHtml = '';
    let loadedCount = 0;

    for (let i = 0; i < total; i++) {
        try {
            const res = await fetch(`${API}/exam/admin/${allRecordIds[i]}/print`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.code === 0) {
                loadedHtml += renderPage(data.data, i + 1, total);
            }
        } catch (err) {
            console.error('加载失败:', err);
        }
        loadedCount++;
        btnText.textContent = `生成中 ${loadedCount}/${total}`;
        btnProgress.style.width = (loadedCount / total * 100) + '%';
        await new Promise(resolve => setTimeout(resolve, 50));
    }

    // 渲染完成后弹出打印
    document.getElementById('content').innerHTML = loadedHtml;
    btn.disabled = false;
    btnText.textContent = '导出PDF';
    btnProgress.style.width = '0%';
    window.print();
}

function init() {
    allRecordIds = getRecordIds();
    if (allRecordIds.length === 0) {
        document.getElementById('progressStatus').textContent = '没有要打印的记录';
        document.getElementById('progressBtns').innerHTML = '<button class="btn-stop" onclick="window.close()">关闭</button>';
        return;
    }
    document.getElementById('batchTitle').textContent = `批量打印（共${allRecordIds.length}人）`;
    updateUI();
    // 页面加载时自动加载第一份预览
    loadFirstPreview();
}

async function loadFirstPreview() {
    if (allRecordIds.length === 0) return;
    try {
        const res = await fetch(`${API}/exam/admin/${allRecordIds[0]}/print`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.code === 0) {
            document.getElementById('content').innerHTML = renderPage(data.data, 1, allRecordIds.length);
        }
    } catch (err) {
        console.error('加载预览失败:', err);
    }
}

init();
</script>
    <script src="/js/projector-mode.js"></script>
</body>
</html>
