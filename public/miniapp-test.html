<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>小程序测试页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: linear-gradient(180deg, #f4f9ff 0%, #edf4fb 100%);
      color: #17324d;
    }
    .card {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 14px 38px rgba(61, 101, 146, 0.12);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 10px 0; line-height: 1.7; color: #56708d; }
    code {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 10px;
      background: #eef5ff;
      color: #205286;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>小程序域名测试成功</h1>
    <p>如果你能在小程序 <code>web-view</code> 中看到这个页面，说明 <code>www.xlmould.work</code> 的业务域名配置已经生效。</p>
    <p>下一步我们就可以继续排查具体业务页面的兼容问题。</p>
  </div>
</body>
</html>
