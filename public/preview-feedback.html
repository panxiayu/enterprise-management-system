<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>UI 预览 - 我的反馈</title>
<style>
:root {
  --bg: #EDEDED;
  --primary: #07C160;
  --primary-dark: #06AE56;
  --bubble-self: #95EC69;
  --bubble-other: #FFFFFF;
  --text: #000000;
  --text-soft: #888888;
  --gray-light: #F5F5F5;
  --gray-border: #E5E5E5;
  --accent: #07C160;
  --orange: #FA9D3B;
  --red: #FA5151;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
}
.page-container {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 600px;
  margin: 0 auto;
  background: var(--bg);
}
.chat-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 12px;
  -webkit-overflow-scrolling: touch;
}
.chat-wrap::-webkit-scrollbar { width: 4px; }
.chat-wrap::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

.time-divider {
  text-align: center;
  margin: 14px 0 10px;
  color: #888;
  font-size: 12px;
}

.msg {
  display: flex;
  align-items: flex-start;
  padding: 0 12px;
  animation: msgIn 0.28s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg.user  { justify-content: flex-end; }
.msg.admin { justify-content: flex-start; }
.msg + .msg { margin-top: 2px; }
.msg + .msg.diff-side { margin-top: 16px; }
.msg + .msg.same-side .avatar { visibility: hidden; }

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  font-weight: 500;
  color: white;
}
.msg.user  .avatar { margin-left:  8px; order: 2; background: #4F8AF7; }
.msg.admin .avatar { margin-right: 8px; order: 1; background: #2A2A2A; }

.bubble-wrap {
  position: relative;
  max-width: 72%;
  display: flex;
  flex-direction: column;
}
.msg.user  .bubble-wrap { align-items: flex-end; order: 1; }
.msg.admin .bubble-wrap { align-items: flex-start; order: 2; }

.bubble {
  position: relative;
  padding: 9px 12px;
  border-radius: 4px;
  font-size: 16px;
  line-height: 1.4;
  word-break: break-word;
  white-space: pre-wrap;
}
.msg.user  .bubble { background: var(--bubble-self); color: #000; }
.msg.admin .bubble { background: var(--bubble-other); color: #000; }

.bubble::before {
  content: "";
  position: absolute;
  top: 12px;
  width: 0; height: 0;
  border: 5px solid transparent;
}
.msg.user .bubble::before {
  right: -10px;
  border-left-color: var(--bubble-self);
}
.msg.admin .bubble::before {
  left: -10px;
  border-right-color: var(--bubble-other);
}

.msg-status {
  margin-top: 4px;
  font-size: 11px;
  color: #B2B2B2;
  text-align: center;
  line-height: 1.4;
}
.msg-status .tag {
  display: inline-block;
  padding: 0 6px;
  margin-right: 4px;
  border-radius: 3px;
  font-size: 11px;
  color: #fff;
}
.tag-pending    { background: #FA5151; }
.tag-processing { background: #FA9D3B; }
.tag-resolved   { background: #07C160; }
.tag-rejected   { background: #B2B2B2; }
.tag-viewed     { background: #888; }

.input-area {
  background: #F7F7F7;
  border-top: 1px solid #E5E5E5;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
}
.input-box { display: flex; gap: 8px; align-items: center; }
.input-box input {
  flex: 1; min-width: 0;
  padding: 9px 12px; border: none; border-radius: 6px;
  font-size: 16px; outline: none; background: #FFFFFF; color: #000;
}
.input-box input::placeholder { color: #B2B2B2; }
.send-btn {
  padding: 8px 14px; background: #07C160; color: #fff; border: none; border-radius: 6px;
  font-size: 15px; font-weight: 500; cursor: pointer;
}
.category-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.cat-btn {
  padding: 4px 10px; border: 1px solid #E5E5E5; border-radius: 4px;
  background: #FFFFFF; font-size: 12px; color: #888; cursor: pointer;
}
.cat-btn.active { background: #07C160; border-color: #07C160; color: #fff; }
</style>
</head>
<body>
<div class="page-container">
  <div id="chat" class="chat-wrap">

    <div class="time-divider">昨天 18:32</div>

    <div class="msg user diff-side">
      <div class="bubble-wrap">
        <div class="bubble">报餐页面加载很慢,有时候要等 5 秒以上才出来,能优化一下吗?</div>
        <div class="msg-status"><span class="tag tag-resolved">已解决</span></div>
      </div>
      <div class="avatar user">我</div>
    </div>

    <div class="msg admin diff-side">
      <div class="avatar admin">官</div>
      <div class="bubble-wrap">
        <div class="bubble">您好,已收到反馈,正在排查接口响应慢的问题,预计本周内修复。</div>
        <div class="msg-status"><span class="tag tag-viewed">已回复</span></div>
      </div>
    </div>

    <div class="msg admin same-side">
      <div class="avatar admin">官</div>
      <div class="bubble-wrap">
        <div class="bubble">已优化,缓存命中后 0.5s 内返回,请再试试。</div>
        <div class="msg-status"><span class="tag tag-viewed">已回复</span></div>
      </div>
    </div>

    <div class="msg user diff-side">
      <div class="bubble-wrap">
        <div class="bubble">好的,快多了,谢谢!</div>
        <div class="msg-status"><span class="tag tag-resolved">已解决</span></div>
      </div>
      <div class="avatar user">我</div>
    </div>

    <div class="time-divider">今天 09:15</div>

    <div class="msg user diff-side">
      <div class="bubble-wrap">
        <div class="bubble">培训考试的"已通过"标签看不清,颜色和未通过的太像了</div>
        <div class="msg-status"><span class="tag tag-processing">处理中</span></div>
      </div>
      <div class="avatar user">我</div>
    </div>

    <div class="msg user same-side">
      <div class="bubble-wrap">
        <div class="bubble">建议已通过用绿色、未通过用红色,中间状态用橙色,会清楚很多</div>
        <div class="msg-status"><span class="tag tag-processing">处理中</span></div>
      </div>
      <div class="avatar user">我</div>
    </div>

    <div class="msg admin diff-side">
      <div class="avatar admin">官</div>
      <div class="bubble-wrap">
        <div class="bubble">建议已收到,我们会尽快调整颜色方案,感谢反馈!</div>
        <div class="msg-status"><span class="tag tag-viewed">已回复</span></div>
      </div>
    </div>

  </div>

  <div class="input-area">
    <div class="input-box">
      <input type="text" placeholder="输入问题或建议...">
      <button class="send-btn">发送</button>
    </div>
    <div class="category-row">
      <button class="cat-btn">功能异常</button>
      <button class="cat-btn active">功能建议</button>
      <button class="cat-btn">界面问题</button>
      <button class="cat-btn">性能问题</button>
    </div>
  </div>
</div>
</body>
</html>
