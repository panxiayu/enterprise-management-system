        // 根据手动输入同步更新树的勾选状态
        function syncTreeFromManualInput(startVal, endVal) {
            if (!startVal && !endVal) {
                // 全选
                document.querySelectorAll('#hireDateTree input[type="checkbox"]').forEach(cb => cb.checked = true);
                return;
            }
            const startDate = startVal ? parseFlexibleDate(startVal) : null;
            const endDate = endVal ? parseFlexibleDate(endVal, true) : null;
            if (!startDate && !endDate) {
                document.querySelectorAll('#hireDateTree input[type="checkbox"]').forEach(cb => cb.checked = true);
                return;
            }
            // 遍历所有日复选框，设置状态
            document.querySelectorAll('.day-check').forEach(cb => {
                const dateVal = cb.dataset.date;
                const d = parseDate(dateVal);
                if (!d) {
                    cb.checked = false;
                    return;
                }
                const startOk = !startDate || d >= startDate;
                const endOk = !endDate || d <= endDate;
                cb.checked = startOk && endOk;
            });
            // 遍历月复选框
            document.querySelectorAll('input[id^="month"]').forEach(cb => {
                const id = cb.id;
                const y = id.substring(5, 9);
                const m = parseInt(id.substring(9));
                const daysInMonth = document.querySelectorAll(`.day-check[data-date^="${y}-${m}-"]`);
                const allChecked = Array.from(daysInMonth).every(dc => dc.checked);
                const someChecked = Array.from(daysInMonth).some(dc => dc.checked);
                cb.checked = allChecked;
                cb.indeterminate = someChecked && !allChecked;
            });
            // 遍历年复选框
            document.querySelectorAll('input[id^="year"]').forEach(cb => {
                const id = cb.id;
                if (id === 'hire_dateAll') return;
                if (id.length !== 8 && id.length !== 9) return;
                const y = id.replace('year', '');
                if (!/^\d{4}$/.test(y)) return;
                const monthsInYear = document.querySelectorAll(`.day-check[data-date^="${y}-"]`);
                const allChecked = Array.from(monthsInYear).every(dc => dc.checked);
                const someChecked = Array.from(monthsInYear).some(dc => dc.checked);
                cb.checked = allChecked;
                cb.indeterminate = someChecked && !allChecked;
            });
        }

        // 解析灵活日期格式，支持：20250101(YYYYMMDD)、202511(YYYYMM)、2025110(YYYYMD)等
        function parseFlexibleDate(str, isEndDate = false) {
            if (!str) return null;
            str = str.replace(/[-\/]/g, ''); // 去掉分隔符
            if (!/^\d+$/.test(str)) return null;
            let year, month, day;
            if (str.length === 8) {
                year = parseInt(str.substring(0, 4));
                month = parseInt(str.substring(4, 6));
                day = parseInt(str.substring(6, 8));
            } else if (str.length === 7) {
                year = parseInt(str.substring(0, 4));
                month = parseInt(str.substring(4, 5));
                day = parseInt(str.substring(5, 7));
            } else if (str.length === 6) {
                year = parseInt(str.substring(0, 4));
                month = parseInt(str.substring(4, 6));
                day = 1;
            } else if (str.length === 5) {
                year = parseInt(str.substring(0, 4));
                month = parseInt(str.substring(4, 5));
                day = 1;
            } else if (str.length === 4) {
                // 纯年份：起始日期用1月1日，结束日期用12月31日
                year = parseInt(str);
                if (isEndDate) {
                    month = 12;
                    day = 31;
                } else {
                    month = 1;
                    day = 1;
                }
            } else {
                return null;
            }
            if (month < 1 || month > 12) return null;
            if (day < 1 || day > 31) return null;
            const d = new Date(year, month - 1, day);
            if (isNaN(d.getTime())) return null;
            return d;
        }

        function applyCurrentSort(data) {
            let sortConfig = null;
            try {
                sortConfig = JSON.parse(localStorage.getItem(getSortStorageKey()) || 'null');
            } catch (e) {
                sortConfig = null;
            }

            if (!sortConfig || !sortConfig.key || !sortConfig.order) {
                return data;
            }

            const { key, order } = sortConfig;
            return [...data].sort((a, b) => {
                let va = a[key] || '';
                let vb = b[key] || '';
                if (key === 'hire_date' || key === 'training_date' || key === 'dinggang_date' || key === 'birthday') {
                    const da = va ? new Date(va) : new Date(0);
                    const db = vb ? new Date(vb) : new Date(0);
                    return order === 'asc' ? da - db : db - da;
                }
                if (key === 'seniority') {
                    const toMonths = (str) => {
                        if (!str) return 0;
                        const years = str.match(/(\d+)年/);
                        const months = str.match(/(\d+)月/);
                        return (years ? parseInt(years[1], 10) * 12 : 0) + (months ? parseInt(months[1], 10) : 0);
                    };
                    const ma = toMonths(va);
                    const mb = toMonths(vb);
                    return order === 'asc' ? ma - mb : mb - ma;
                }
                if (!isNaN(va) && !isNaN(vb)) {
                    return order === 'asc' ? va - vb : vb - va;
                }
                return order === 'asc'
                    ? String(va).localeCompare(String(vb), 'zh-CN')
                    : String(vb).localeCompare(String(va), 'zh-CN');
            });
        }

        // 应用表头筛选
        // 解析日期，支持 YYYYMMDD 和 YYYY-MM-DD 格式
        function parseDate(str) {
            if (!str) return null;
            str = str.trim();
            // YYYYMMDD 格式
            if (/^\d{8}$/.test(str)) {
                return new Date(str.substring(0, 4), parseInt(str.substring(4, 6)) - 1, str.substring(6, 8));
            }
            // YYYY-MM-DD 格式
            const d = new Date(str);
            return isNaN(d.getTime()) ? null : d;
        }

        function applyGlobalSearchFilter(data) {
            if (!globalSearchKeyword) return data;

        function applyStoredHeaderFilters(data) {
            let filtered = data;
            const filterPrefix = getFilterStoragePrefix();
            const filterableKeys = getCurrentColumns().filter(c => c.key !== 'status').map(c => c.key);

            filterableKeys.forEach(key => {
                if (key === 'hire_date') {
                    const manualStart = localStorage.getItem(filterPrefix + 'HireDateManualStart');
                    const manualEnd = localStorage.getItem(filterPrefix + 'HireDateManualEnd');
                    if (manualStart || manualEnd) {
                        const startDate = manualStart ? parseFlexibleDate(manualStart) : null;
                        const endDate = manualEnd ? parseFlexibleDate(manualEnd, true) : null;
                        filtered = filtered.filter(s => {
                            if (!s.hire_date) return false;
                            const d = parseDate(s.hire_date);
                            if (!d) return false;
                            const startOk = !startDate || d >= startDate;
                            const endOk = !endDate || d <= endDate;
                            return startOk && endOk;
                        });
                        return;
                    }
                    const savedFilterStr = localStorage.getItem(filterPrefix + 'hire_date');
                    if (savedFilterStr === null) return;
                    let savedValues = [];
                    try {
                        savedValues = JSON.parse(savedFilterStr) || [];
                    } catch (e) {
                        return;
                    }
                    if (savedValues.length === 0) {
                        filtered = [];
                        return;
                    }
                    filtered = filtered.filter(s => {
                        if (!s.hire_date) return false;
                        const d = parseDate(s.hire_date);
                        if (!d) return false;
                        const y = d.getFullYear();
                        const m = d.getMonth() + 1;
                        const day = d.getDate();
                        const dateVal = String(y) + '-' + String(m) + '-' + String(day);
                        return savedValues.some(v => {
                            if (v === dateVal) return true;
                            const parts = String(v).split('-');
                            if (parts.length === 2 && parseInt(parts[0]) === y && parseInt(parts[1]) === m) return true;
                            if (parts.length === 1 && parseInt(parts[0]) === y) return true;
                            return false;
                        });
                    });
                    return;
                }

                const savedFilterStr = localStorage.getItem(filterPrefix + key);
                if (!savedFilterStr) return;

                let savedValues = [];
                try {
                    savedValues = JSON.parse(savedFilterStr) || [];
                } catch (e) {
                    return;
                }

                if (savedValues.length === 0) {
                    filtered = [];
                    return;
                }

                filtered = filtered.filter(s => {
                    if (s[key] === undefined || s[key] === null || s[key] === '') return false;
                    return savedValues.includes(s[key]);
                });
            });

            return filtered;
        }

        function initTableScrollSync() {
            const headerScroll = document.getElementById('tableHeaderScroll');
            const bodyScroll = document.querySelector('.table-scroll-inner');
            if (!headerScroll || !bodyScroll || bodyScroll.dataset.syncBound === '1') return;

            let syncing = false;
            const syncTo = (source, target) => {
                if (syncing) return;
                syncing = true;
                target.scrollLeft = source.scrollLeft;
                requestAnimationFrame(() => {
                    syncing = false;
                });
            };

            bodyScroll.addEventListener('scroll', () => syncTo(bodyScroll, headerScroll), { passive: true });
            headerScroll.addEventListener('scroll', () => syncTo(headerScroll, bodyScroll), { passive: true });
            bodyScroll.dataset.syncBound = '1';
        }

            // 获取 API 返回的所有字段
            const keys = new Set();

                Object.keys(item).forEach(k => {
                    if (!excludeKeys.includes(k) && !k.startsWith('_')) keys.add(k);

            const existingKeys = new Set(COLUMNS.map(c => c.key));
            // 添加 API 中有但 COLUMNS 中没有的新列
            let newColsAdded = false;
            keys.forEach(key => {
                if (!existingKeys.has(key)) {
                    // 如果有保存的配置，用保存的值；否则默认显示
                    const savedVisible = savedConfig && savedConfig[key] !== undefined ? savedConfig[key] : true;

        function loadStaff(isInitialLoad = true) {
            const tableContainer = document.getElementById('tableContainer');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('emptyState');

            if (isInitialLoad) {
                loading.style.display = 'block';
                tableContainer.style.display = 'none';
                emptyState.style.display = 'none';
                // 筛选时淡出效果
                tableContainer.style.transition = 'opacity 0.2s ease';
                tableContainer.style.opacity = '0';
            }

            const apiUrl = getCurrentApiUrl();
            let url = `${apiUrl}?`;
            if (currentTab === 'active' || currentTab === 'inactive') {
                url += `status=${currentTab === 'active' ? 'active' : 'inactive'}&`;
            }

            // 取消上一个请求
            if (loadStaffController) {
                loadStaffController.abort();
            }
            loadStaffController = new AbortController();

            fetch(url, { headers: { 'Authorization': `Bearer ${getToken()}` }, signal: loadStaffController.signal })
            .then(res => res.json())
            .then(data => {
                if (isInitialLoad) {
                    loading.style.display = 'none';
                }
                if (data.code === 0 || data.success) {
                    // 先保存原始数据
                    const originalData = data.data || [];
                    console.log('[DEBUG] API response for', currentTab, ':', originalData.length, 'records');
                    if (currentTab === 'student') {
                        window.allStudentData = originalData; // 保存学生数据
                    } else {
                        window.allStaffData = originalData; // 保存员工数据
                    }

                    // 收集所有字段的唯一值（用于下拉选项）
                    const fieldValues = {};
                    // 动态获取所有列进行唯一值收集
                    const allKeys = new Set();
                    originalData.forEach(s => {
                        Object.keys(s).forEach(k => {
                            if (!k.startsWith('_') && k !== 'id') allKeys.add(k);
                        });
                    });
                    allKeys.forEach(key => {
                        const set = new Set();
                        originalData.forEach(s => {
                            if (s[key]) set.add(s[key]);
                        });
                        fieldValues[key] = [...set].sort((a, b) => {
                            if (typeof a === 'string') return a.localeCompare(b, 'zh-CN');
                            return a - b;
                        });
                    });
                    window.allFieldValues = fieldValues;

                    // Excel 风格客户端筛选 - 搜索和复选框同时生效
                    // 先同步列配置，确保获取到所有列（仅员工名册需要）
                    if (currentTab !== 'student') {
                        syncColumnsFromData(originalData);
                    }

                    // 重新渲染表头
                    renderTableHeader();
                    refreshFilteredTable();
                    if (isInitialLoad) {
                        tableContainer.style.display = 'block';
                        requestAnimationFrame(() => {
                            tableContainer.style.opacity = '1';
                        });
                    }
                } else {
                    alert(data.msg);
                }
            })
            .catch(err => {
                if (err.name === 'AbortError') return; // 忽略取消的请求
                document.getElementById('loading').style.display = 'none';
                alert('加载失败');
            });
        }

        // 全局搜索
        let globalSearchKeyword = '';
        function hideSearchHits() {
            const el = document.getElementById('searchHits');
            if (!el) return;
            el.style.display = 'none';
            el.innerHTML = '';
        }

        function renderSearchHits(keyword, groups) {
            const el = document.getElementById('searchHits');
            if (!el) return;
            const labels = {
                active: '在职',
                inactive: '离职',
                student: '学生'
            };
            const buttons = groups
                .filter(group => group.count > 0)
                .map(group => `<button class="search-hit-btn" type="button" onclick="jumpSearchGroup('${group.tab}', '${encodeURIComponent(keyword)}')">${labels[group.tab]} ${group.count}</button>`)
                .join('');
            if (!buttons) {
                el.innerHTML = `未找到与“${escapeHtml(keyword)}”匹配的人员`;
            } else {
                el.innerHTML = `<span>搜索“${escapeHtml(keyword)}”命中：</span>${buttons}`;
            }
            el.style.display = 'flex';
        }

        function jumpSearchGroup(tab, encodedKeyword) {
            const keyword = decodeURIComponent(encodedKeyword || '');
            document.getElementById('globalSearchInput').value = keyword;
            globalSearchKeyword = keyword.trim().toLowerCase();
            switchTab(tab, { preserveSearch: true, forceReload: currentTab === tab });
        }

        async function runCrossRosterSearch(keyword) {
            const rawKeyword = keyword.trim();
            if (!rawKeyword) {
                hideSearchHits();
                refreshFilteredTable();
                return;
            }
            try {
                const res = await fetch(`${API_URL}/staff/search-all?q=${encodeURIComponent(rawKeyword)}`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const json = await res.json();
                if (!json || json.code !== 0) {
                    refreshFilteredTable();
                    return;
                }
                const data = json.data || {};
                const groups = [
                    { tab: 'active', count: (data.activeStaff || []).length },
                    { tab: 'inactive', count: (data.inactiveStaff || []).length },
                    { tab: 'student', count: (data.students || []).length }
                ];
                const hitGroups = groups.filter(group => group.count > 0);
                renderSearchHits(rawKeyword, groups);
                if (hitGroups.length === 1) {
                    const targetTab = hitGroups[0].tab;
                    if (currentTab !== targetTab) {
                        await switchTab(targetTab, { preserveSearch: true });
                    } else {
                        refreshFilteredTable();
                    }
                } else {
                    refreshFilteredTable();
                }
            } catch (err) {
                console.warn('跨名册搜索失败:', err);
                refreshFilteredTable();
            }
        }

        function handleGlobalSearch(keyword) {
            globalSearchKeyword = keyword.trim().toLowerCase();
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => runCrossRosterSearch(keyword), 250);
            refreshFilteredTable();
        }

        function renderStaffTable(list) {
            console.log('[DEBUG] renderStaffTable called with', list.length, 'items, currentTab:', currentTab);
            renderMobileCards(list);
            const columns = getCurrentColumns();
            const widthMap = getComputedColumnWidths(columns, getWidthSourceData());
            console.log('[DEBUG] columns:', columns.filter(c => c.visible).map(c => c.key));
            const visibleNonCheckbox = columns.filter(c => c.visible);
            const allHidden = visibleNonCheckbox.length === 0;
            if (allHidden) {
                document.getElementById('staffList').innerHTML = `<tr><td colspan="${columns.length}" style="text-align:center; padding:40px; color:var(--text-muted);">空</td></tr>`;
                return;
            }
            if (list.length === 0) {
                // 无数据时显示空白行，表头和表格容器保持显示
                const colCount = columns.filter(c => c.visible).length;
                document.getElementById('staffList').innerHTML = `<tr><td colspan="${colCount}" style="text-align:center; padding:40px; color:var(--text-muted);"></td></tr>`;
                return;
            }
            const html = list.map((s, idx) => {
                const isInactive = s.status === 'inactive';
                // 检查是否不在同步名单中（红色标记）
                const isNotInSync = notInExcelStaffIds.has(s.employee_id);
                const rowClass = isInactive ? 'inactive-row' : (isNotInSync ? 'not-in-sync-row' : '');
                const rowStyle = isNotInSync ? 'color:var(--danger);' : '';
                const cells = columns.map(col => {
                    const visStyle = !col.visible ? 'display:none;' : '';
                    const alignStyle = isNotInSync ? 'text-align:center; color:var(--danger);' : 'text-align:center; color:var(--text);';
                    const dataLabel = col.label || '';
                    const renderWidth = widthMap[col.key] || col.width;
                    if (col.key === 'serial') {
                        const style = `width:${renderWidth}; min-width:${renderWidth}; ${alignStyle} ${visStyle}`;
                        return `<td data-key="${col.key}" data-label="${dataLabel}" style="${style}">${idx + 1}</td>`;
                    }
                    if (col.key === 'employee_id') {
                        const style = `width:${renderWidth}; min-width:${renderWidth}; ${alignStyle} ${visStyle}`;
                        const linkStyle = isNotInSync ? 'color:var(--danger);' : '';
                        return `<td data-key="${col.key}" data-label="${dataLabel}" style="${style}"><span class="clickable-link" style="${linkStyle}" onclick="viewStaff(${s.id})">${s.employee_id || '-'}</span></td>`;
                    }
                    if (col.key === 'name') {
                        const style = `width:${renderWidth}; min-width:${renderWidth}; ${alignStyle} ${visStyle}`;
                        const linkStyle = isNotInSync ? 'color:var(--danger);' : '';
                        return `<td data-key="${col.key}" data-label="${dataLabel}" style="${style}"><span class="clickable-link" style="${linkStyle}" onclick="viewStaff(${s.id})">${s.name}</span></td>`;
                    }
                    if (col.key === 'status') {
                        const style = `${alignStyle} ${visStyle}`;
                        const sClass = s.status === 'inactive' ? 'badge-inactive' : 'badge-active';
                        const sText = s.status === 'inactive' ? '离职' : '在职';
                        return `<td data-key="${col.key}" data-label="${dataLabel}" style="${style}"><span class="badge ${sClass}">${sText}</span></td>`;
                    }
                    if (col.key === 'team') {
                        let teamVal = s.team || '';
                        if (teamVal.includes('/')) {
                            teamVal = teamVal.split('/').pop();
                        }
                        const style = `${alignStyle} ${visStyle}`;
                        return `<td data-key="${col.key}" data-label="${dataLabel}" style="${style}">${teamVal}</td>`;
                    }
                    if (isCopyableField(col.key)) {
                        const style = `${alignStyle} ${visStyle}`;
                        return `<td data-key="${col.key}" data-label="${dataLabel}" style="${style}">${renderCopyableValue(col.key, s[col.key] || '-', s[col.key] || '-')}</td>`;
                    }
                    const style = `${alignStyle} ${visStyle}`;
                    return `<td data-key="${col.key}" data-label="${dataLabel}" style="${style}">${s[col.key] || '-'}</td>`;
                }).join('');
                return `<tr class="${rowClass}" style="${rowStyle}">${cells}</tr>`;
            }).join('');
            document.getElementById('staffList').innerHTML = html;
            // 更新序号列的统计数字
            document.querySelectorAll('[data-count-key="serial"]').forEach(el => {
                el.textContent = list.length;
            });
        }

                        { label: '紧急联系人', key: 'emergency_contact' },
                        { label: '与紧急联系人的关系', key: 'emergency_relation' },
                        { label: '紧急联系电话', key: 'emergency_phone' },
                        { label: '车牌', key: 'car_plate' }
                    ]
                }
            ];

            let html = '<div class="detail-grid">';
            categories.forEach(cat => {
                html += `
                    <div class="detail-section">
                        <div class="detail-section-title">${cat.title}</div>
                        <div class="detail-fields">
                            ${cat.fields.map(f => `
                                <div style="display:flex;flex-direction:column;gap:2px;">
                                    <span class="info-label">${f.label}</span>
                                    <div class="info-value" style="font-size:12px;">${renderDetailValue(f)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            // 考试记录
            if (s.examScores && s.examScores.length > 0) {
                html += `
                    <div class="detail-record-block">
                        <div class="detail-record-title">考试成绩</div>
                        <div class="detail-table-wrap">
                        <table class="detail-table">
                            <thead><tr>
                                <th>考试名称</th>
                                <th>成绩</th>
                                <th>状态</th>
                                <th>日期</th>
                                <th>操作</th>
                            </tr></thead>
                            <tbody>
                                ${s.examScores.map(e => `
                                    <tr style="border-bottom:1px solid var(--border);">
                                        <td>${e.title || '-'}</td>
                                        <td style="text-align:center;">${e.score != null ? e.score : '-'}</td>
                                        <td style="text-align:center;">${e.status || '-'}</td>
                                        <td style="text-align:center;">${e.created_at ? new Date(e.created_at).toLocaleDateString('zh-CN') : '-'}</td>
                                        <td style="text-align:center;">
                                            <button onclick="printExamPaper(${e.id})" style="padding:4px 10px;background:#4A90E2;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;">打印</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        </div>
                    </div>
                `;
            }

            // 报餐记录
            if (s.mealOrders && s.mealOrders.length > 0) {
                html += `
                    <div class="detail-record-block">
                        <div class="detail-record-title">报餐记录</div>
                        <div class="detail-table-wrap">
                        <table class="detail-table">
                            <thead><tr>
                                <th>活动名称</th>
                                <th>报餐类型</th>
                                <th>人数</th>
                                <th>日期</th>
                            </tr></thead>
                            <tbody>
                                ${s.mealOrders.map(m => `
                                    <tr style="border-bottom:1px solid var(--border);">
                                        <td>${m.title || '-'}</td>
                                        <td style="text-align:center;">${m.meal_type || '-'}</td>
                                        <td style="text-align:center;">${m.employee_count || 0}</td>
                                        <td style="text-align:center;">${m.signup_date || '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        </div>
                    </div>
                `;
            }

            html += `
                <div class="detail-actions">
                    <button class="btn btn-primary" onclick="openEditStaffModal()">编辑</button>
                </div>
            `;

            document.getElementById('staffDetailContent').innerHTML = html;
        }

        function renderStudentDetailPopup(s) {
            const formatValue = (v) => v !== null && v !== undefined && v !== '' ? v : '-';
            const renderDetailValue = (field) => {
                const value = formatValue(s[field.key]);
                return isCopyableField(field.key) ? renderCopyableValue(field.key, s[field.key], value) : escapeHtml(value);
            };
            const fields = [
                { label: '工号', key: 'employee_id' },
                { label: '姓名', key: 'name' },
                { label: '学校', key: 'school' },
                { label: '部门', key: 'department' },
                { label: '子部门', key: 'sub_department' },
                { label: '职位', key: 'position' },
                { label: '实训日期', key: 'training_date' },
                { label: '顶岗日期', key: 'dinggang_date' },
                { label: '联系电话', key: 'phone' },
                { label: '身份证号码', key: 'id_card' },
                { label: '家庭住址', key: 'home_address' },
                { label: '学历', key: 'education' },
                { label: '专业', key: 'major' },
                { label: '紧急联系人', key: 'emergency_contact' },
                { label: '相互关系', key: 'emergency_relation' },
                { label: '紧急联系电话', key: 'emergency_phone' }
            ];

            const html = `
                <div class="detail-section">
                    <div class="detail-section-title">学生信息</div>
                    <div class="detail-fields" style="gap:8px;">
                        ${fields.map(f => `
                            <div style="display:flex;flex-direction:column;gap:2px;">
                                <span class="info-label">${f.label}</span>
                                <div class="info-value" style="font-size:12px;">${renderDetailValue(f)}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            document.getElementById('staffDetailContent').innerHTML = html;
        }

        function closeEditStaffModal() {
            document.getElementById('editStaffModal').classList.remove('active');
        }

        function openEditStaffModal() {
            if (!currentStaffDetail) return;
            document.getElementById('editStaffResult').style.display = 'none';
            document.getElementById('editStaffFields').innerHTML = '';

            const editFields = [
                { key: 'employee_id', label: '工号', type: 'text', required: true },
                { key: 'name', label: '姓名', type: 'text', required: true },
                { key: 'phone', label: '电话', type: 'text' },
                { key: 'department', label: '部门', type: 'text' },
                { key: 'team', label: '班组', type: 'text' },
                { key: 'position', label: '职位', type: 'text' },
                { key: 'hire_date', label: '入职日期', type: 'date' },
                { key: 'status', label: '状态', type: 'select', options: [{ v: 'active', t: '在职' }, { v: 'inactive', t: '离职' }] },
                { key: 'gender', label: '性别', type: 'text' },
                { key: 'birthday', label: '出生年月', type: 'date' },
                { key: 'id_card', label: '身份证', type: 'text' },
                { key: 'bank_account', label: '银行卡', type: 'text' }
            ];

            let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">';
            editFields.forEach(f => {
                const val = currentStaffDetail[f.key] || '';
                html += `<div class="form-group" style="margin-bottom:8px;">
                    <label style="display:block;margin-bottom:4px;font-size:12px;color:var(--text-secondary);">${f.label}${f.required ? ' *' : ''}</label>`;
                if (f.type === 'select') {
                    html += `<select id="edit_${f.key}" class="form-control" ${f.required ? 'required' : ''} style="padding:8px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;width:100%;box-sizing:border-box;">`;
                    html += `<option value="">请选择</option>`;
                    f.options.forEach(o => {
                        html += `<option value="${o.v}" ${val === o.v ? 'selected' : ''}>${o.t}</option>`;
                    });
                    html += `</select>`;
                } else {
                    html += `<input type="${f.type}" id="edit_${f.key}" class="form-control" value="${val}" ${f.required ? 'required' : ''} style="padding:8px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;width:100%;box-sizing:border-box;">`;
                }
                html += '</div>';
            });
            html += '</div>';
            document.getElementById('editStaffFields').innerHTML = html;
            document.getElementById('editStaffModal').classList.add('active');
        }

        function handleEditStaff(e) {
            e.preventDefault();
            if (!currentStaffDetail) return;

            const resultDiv = document.getElementById('editStaffResult');
            resultDiv.style.display = 'none';

            // 收集表单数据，对比原数据只更新变化的字段
            const editFields = ['employee_id', 'name', 'phone', 'department', 'team', 'position', 'hire_date', 'status', 'gender', 'birthday', 'id_card', 'bank_account'];
            const updateData = {};

            editFields.forEach(key => {
                const el = document.getElementById('edit_' + key);
                if (!el) return;
                let newVal = el.value;
                let oldVal = currentStaffDetail[key] || '';

                // 类型转换
                if (key === 'hire_date' || key === 'birthday') {
                    if (newVal !== oldVal) updateData[key] = newVal || null;
                } else if (key === 'status') {
                    if (newVal !== oldVal) updateData[key] = newVal;
                } else {
                    if (newVal !== oldVal) updateData[key] = newVal;
                }
            });

            // 检查是否有更新
            const keys = Object.keys(updateData);
            if (keys.length === 0) {
                resultDiv.innerHTML = '<span style="color:var(--text-muted);">没有修改任何数据</span>';
                resultDiv.style.display = 'block';
                resultDiv.style.background = 'var(--bg-hover)';
                return;
            }

            const token = getToken();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.textContent = '保存中...';
            btn.disabled = true;

            fetch(`${API_URL}/staff/${currentStaffDetail.id}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updateData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 0) {
                    resultDiv.innerHTML = '<span style="color:var(--success);">✓ 保存成功</span>';
                    resultDiv.style.display = 'block';
                    resultDiv.style.background = 'rgba(35,165,89,0.1)';
                    // 刷新详情
                    fetchStaffDetail(currentStaffDetail.id);
                    // 刷新列表
                    loadStaff();
                    btn.textContent = '保存';
                    btn.disabled = false;
                } else {
                    resultDiv.innerHTML = `<span style="color:var(--danger);">✗ ${data.msg || '保存失败'}</span>`;
                    resultDiv.style.display = 'block';
                    resultDiv.style.background = 'rgba(235,87,87,0.1)';
                    btn.textContent = '重试';
                    btn.disabled = false;
                }
            })
            .catch(err => {
                resultDiv.innerHTML = '<span style="color:var(--danger);">✗ 网络错误</span>';
                resultDiv.style.display = 'block';
                resultDiv.style.background = 'rgba(235,87,87,0.1)';
                btn.textContent = '重试';
                btn.disabled = false;
            });
        }

        function goBack() { window.location.href = 'dashboard.html'; }

        // 添加员工
        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }
        function submitAddStaff(e) {
            e.preventDefault();
            const data = {
                employee_id: document.getElementById('staffEmployeeId').value,
                name: document.getElementById('staffName').value,
                phone: document.getElementById('staffPhone').value,
                department: document.getElementById('staffDepartment').value,
                team: document.getElementById('staffTeam').value,
                hire_date: document.getElementById('staffHireDate').value,
                status: 'active'
            };
            fetch(`${API_URL}/staff`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 0) { alert('添加成功'); closeAddModal(); loadStaff(); }
                else { alert(data.msg); }
            })
            .catch(() => alert('添加失败'));
        }

        // 批量删除
        function batchDelete() {
            const checked = document.querySelectorAll('tbody input[type="checkbox"]:checked');
            if (checked.length === 0) { alert('请先选择'); return; }
            if (!confirm(`确定删除 ${checked.length} 名员工？`)) return;
            Promise.all([...checked].map(cb =>
                fetch(`${API_URL}/staff/${cb.value}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${getToken()}` } })
                .then(res => res.json())
            )).then(results => {
                const fail = results.filter(r => r.code !== 0).length;
                alert(fail === 0 ? `删除成功` : `成功${results.length - fail}，失败${fail}`);
                loadStaff();
            });
        }

        // 导入
        function showImportModal() { document.getElementById('importModal').style.display = 'flex'; }
        function closeImportModal() { document.getElementById('importModal').style.display = 'none'; }
        function handleImport(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            fetch(`${API_URL}/staff/bulk-import`, { method: 'POST', body: formData, headers: { 'Authorization': `Bearer ${getToken()}` } })
            .then(res => res.json())
            .then(data => {
                if (data.code === 0) { alert('导入成功'); closeImportModal(); loadStaff(); }
                else { alert(data.msg || '导入失败'); }
            })
            .catch(() => alert('导入失败'));
        }

        // 同步
        function showSyncModal() {
            const syncDesc = document.querySelector('#syncModal .modal-desc');
            if (syncDesc) {
                syncDesc.textContent = currentTab === 'student'
                    ? '从配置的共享数据源同步学生信息'
                    : '从配置的共享数据源同步在职与离职员工信息';
            }
            document.getElementById('syncResult').style.display = 'none';
            document.getElementById('syncResult').innerHTML = '';
            document.getElementById('syncResult').style.background = '';
            document.getElementById('syncConfirmBtn').style.display = '';
            document.getElementById('syncConfirmBtn').textContent = '确认同步';
            document.getElementById('syncConfirmBtn').disabled = false;
            document.getElementById('syncCancelBtn').textContent = '取消';
            document.getElementById('syncCancelBtn').disabled = false;
            document.getElementById('syncModal').style.display = 'flex';
        }
        function closeSyncModal() { document.getElementById('syncModal').style.display = 'none'; }
        // 存储不在Excel中的人员ID，用于表格红色显示
        let notInExcelStaffIds = new Set();

        async function handleSync() {
            const btn = document.getElementById('syncConfirmBtn');
            const cancelBtn = document.getElementById('syncCancelBtn');
            const resultDiv = document.getElementById('syncResult');
            btn.textContent = '同步中...';
            btn.disabled = true;
            cancelBtn.disabled = true;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 180000); // 3分钟超时
                // 根据当前标签页选择不同的同步API
                const syncApi = currentTab === 'student' ? `${API_URL}/student-roster/sync` : `${API_URL}/staff/sync-from-smb`;
                const res = await fetch(syncApi, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const data = await res.json();
                if (data.code === 0 || data.success) {
                    const r = data.data || data || {};
                    // 记录不在Excel中的人员ID
                    notInExcelStaffIds = new Set((r.notInExcel || []).map(s => s.employee_id));

                    let html = `<div style="color: var(--success); font-weight: 600; margin-bottom: 10px;">✓ 同步完成</div>`;
                    html += `<div style="display: flex; gap: 20px; flex-wrap: wrap;">`;
                    html += `<div>新增: <strong style="color: var(--success);">${r.inserted || 0}</strong> 人</div>`;
                    html += `<div>更新: <strong style="color: var(--accent);">${r.updated || 0}</strong> 人</div>`;
                    if (currentTab !== 'student') {
                        html += `<div>在职新增/更新: <strong>${r.activeInserted || 0}/${r.activeUpdated || 0}</strong></div>`;
                        html += `<div>离职新增/更新: <strong>${r.inactiveInserted || 0}/${r.inactiveUpdated || 0}</strong></div>`;
                    }
                    if (r.skipped && r.skipped.length > 0) {
                        html += `<div>跳过: <strong>${r.skipped.length}</strong> 人</div>`;
                    }
                    html += `</div>`;
                    if (r.notInExcel && r.notInExcel.length > 0) {
                        html += `<div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--danger);">`;
                        html += `<strong>不在Excel中 (${r.notInExcel.length}人，已标红):</strong> ${r.notInExcel.slice(0, 10).map(s => s.name + '(' + s.employee_id + ')').join(', ')}${r.notInExcel.length > 10 ? '...' : ''}`;
                        html += `</div>`;
                    }
                    if (r.rehireRecords && r.rehireRecords.length > 0) {
                        html += `<div style="margin-top: 10px; font-size: 12px; color: var(--accent);">检测到复职历史：${r.rehireRecords.length} 人，当前仍按在职名册处理，并保留历史离职记录</div>`;
                    }
                    if (r.leaveDateConflicts && r.leaveDateConflicts.length > 0) {
                        html += `<div style="margin-top: 10px; font-size: 12px; color: var(--orange);">工服预填日期与花名册日期不同：${r.leaveDateConflicts.length} 人</div>`;
                    }
                    if (r.deductionReview && Number(r.deductionReview.adjustments || 0) > 0) {
                        html += `<div style="margin-top: 6px; font-size: 12px; color: var(--danger);">工服扣款待确认差额：${r.deductionReview.adjustments} 条</div>`;
                    }
                    resultDiv.innerHTML = html;
                    resultDiv.style.background = 'rgba(35,165,89,0.1)';
                    resultDiv.style.display = 'block';
                    btn.style.display = 'none';
                    cancelBtn.textContent = '关闭';
                    cancelBtn.disabled = false;
                    if (currentTab === 'student') {
                        fetch(`${API_URL}/staff/sync-time`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${getToken()}`
                            },
                            body: JSON.stringify({ result: 'success' })
                        }).then(() => showSyncTime());
                    } else {
                        showSyncTime();
                    }
                    loadStaff();
                } else {
                    resultDiv.innerHTML = `<div style="color: var(--danger);">✗ ${data.msg || '同步失败'}</div>`;
                    resultDiv.style.background = 'rgba(220,38,38,0.1)';
                    resultDiv.style.display = 'block';
                    btn.textContent = '重试';
                    btn.disabled = false;
                    cancelBtn.disabled = false;
                }
            } catch (e) {
                const isTimeout = e.name === 'AbortError';
                resultDiv.innerHTML = `<div style="color: var(--danger);">✗ ${isTimeout ? '同步超时，请重试' : '网络错误'}</div>`;
                resultDiv.style.background = 'rgba(220,38,38,0.1)';
                resultDiv.style.display = 'block';
                btn.textContent = '重试';
                btn.disabled = false;
                cancelBtn.disabled = false;
            }
        }

        // 打印试卷
        function printExamPaper(recordId) {
            window.open('exam-print.html?id=' + recordId, '_blank');
        }
    </script>
</body>
</html>
