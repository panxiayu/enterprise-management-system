<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>新增曝光 - 兴利汽车模具</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root {
  --bg: #F0F7FF;
  --card: #ffffff;
  --border: #D6E9FF;
  --primary: #4A90E2;
  --secondary: #65B3FF;
  --accent: #22C58D;
  --text: #1D2B5A;
  --text-soft: #5B72A9;
  --radius: 22px;
  --transition: all 0.3s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px 16px 100px;
}
.page-wrap {max-width: 480px; margin: 0 auto}
@media (min-width: 768px) {.page-wrap {max-width: 680px}}
@media (min-width: 1024px) {.page-wrap {max-width: 800px}}
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 18px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.form-group {margin-bottom: 18px}
.form-group:last-child {margin-bottom: 0}
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-soft);
  margin-bottom: 8px;
}
.form-label .required {color: #ff3b30; margin-left: 2px}
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 13px 14px;
  background: rgba(0,0,0,0.02);
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 12px;
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  transition: var(--transition);
  box-sizing: border-box;
}
input[type="date"] {
  min-width: 0;
  width: 100%;
  max-width: 100%;
  padding: 13px 14px;
}
/* 自定义日期选择器：隐藏原生input，显示格式化的文本 */
.date-picker-wrap {
  position: relative;
  width: 100%;
  display: block;
}
.date-picker-display {
  width: 100%;
  padding: 13px 14px;
  background: rgba(74,144,226,0.04);
  border: 1px solid rgba(74,144,226,0.16);
  border-radius: 12px;
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  box-sizing: border-box;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: var(--transition);
  -webkit-appearance: none;
  appearance: none;
  min-height: 48px;
}
.date-picker-display:active {
  transform: scale(0.99);
  border-color: var(--primary);
  background: rgba(74,144,226,0.08);
}
.date-picker-display .date-arrow {
  width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--primary);
  font-size: 0;
}
.date-picker-display .date-arrow::before {
  content: "";
  width: 7px;
  height: 7px;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: translateY(-2px) rotate(45deg);
}
.date-picker-wrap input[type="date"] {
  position: absolute;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  opacity: 0;
  padding: 0;
  border: none;
  background: transparent;
  font-size: 15px;
  pointer-events: none;
}
.date-modal {
  position: fixed;
  inset: 0;
  background: rgba(18, 35, 78, 0.28);
  display: none;
  align-items: flex-end;
  z-index: 9999;
}
.date-modal.show {display: flex}
.date-sheet {
  width: 100%;
  background: #fff;
  border-radius: 22px 22px 0 0;
  padding: 16px 18px max(18px, env(safe-area-inset-bottom));
  box-shadow: 0 -16px 40px rgba(29,43,90,0.16);
}
.date-sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.date-sheet-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}
.date-sheet-btn {
  border: none;
  background: rgba(74,144,226,0.1);
  color: var(--primary);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 700;
}
.date-sheet-btn.cancel {
  background: rgba(0,0,0,0.05);
  color: var(--text-soft);
}
.date-columns {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 10px;
}
.date-field label {
  display: block;
  font-size: 12px;
  color: var(--text-soft);
  margin-bottom: 6px;
}
.date-stepper {
  width: 100%;
  border: 1px solid rgba(74,144,226,0.18);
  border-radius: 12px;
  background: rgba(74,144,226,0.05);
  display: grid;
  grid-template-columns: 34px minmax(0,1fr) 34px;
  align-items: center;
  overflow: hidden;
}
.date-stepper button {
  height: 46px;
  border: none;
  background: transparent;
  color: var(--primary);
  font-size: 20px;
  font-weight: 700;
  font-family: inherit;
}
.date-stepper span {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 46px;
  color: var(--text);
  font-size: 15px;
  font-weight: 700;
  border-left: 1px solid rgba(74,144,226,0.12);
  border-right: 1px solid rgba(74,144,226,0.12);
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--primary);
  background: rgba(74,144,226,0.04);
}
#projectCode[readonly] {
  color: #000;
  font-weight: 600;
  cursor: not-allowed;
}
.form-textarea {
  min-height: 90px;
  resize: none;
  line-height: 1.5;
}
.area-group {display: flex; gap: 10px}
.area-group .form-select {flex: 1}
.hint {
  font-size: 12px;
  color: var(--text-soft);
  margin-top: 6px;
}
.hint.warning {color: #ff9500}
.photo-stack {display:flex;flex-direction:column;gap:12px}
.photo-file-input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  border: 0;
  clip: rect(0,0,0,0);
  clip-path: inset(50%);
  opacity: 0;
}
.photo-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.photo-tile,.photo-add {position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1/1;background:#f7fbff;border:1px solid rgba(74,144,226,0.14)}
.photo-tile img {width:100%;height:100%;object-fit:cover;display:block}
.photo-edit-btn,.photo-delete-btn {position:absolute;top:6px;width:26px;height:26px;border-radius:50%;border:none;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.photo-edit-btn {left:6px;background:rgba(74,144,226,0.78)}
.photo-add {display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed rgba(74,144,226,0.28);background:rgba(74,144,226,0.05);color:var(--primary);cursor:pointer}
.photo-add:active {transform:scale(0.98)}
.photo-add-icon {font-size:26px;line-height:1;margin-bottom:6px}
.photo-add-text {font-size:12px;font-weight:600}
.photo-delete-btn {right:6px;background:rgba(0,0,0,0.6);font-size:14px}
.photo-empty {border:2px dashed rgba(74,144,226,0.22);border-radius:16px;padding:18px 16px;background:rgba(74,144,226,0.04);text-align:center;color:var(--text-soft)}
.photo-empty-title {font-size:14px;color:var(--text);font-weight:600;margin-bottom:4px}
.photo-empty-subtitle {font-size:12px;line-height:1.5}
.photo-editor-modal {
  position: fixed;
  inset: 0;
  z-index: 10020;
  background: rgba(12, 21, 48, 0.78);
  display: none;
  align-items: flex-end;
}
.photo-editor-modal.show {display:flex}
.photo-editor-sheet {
  width: 100%;
  height: 68vh;
  max-height: 68vh;
  background: #fff;
  border-radius: 24px 24px 0 0;
  padding: 14px 14px max(14px, env(safe-area-inset-bottom));
  box-shadow: 0 -20px 48px rgba(29,43,90,0.28);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.photo-editor-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.photo-editor-title {font-size:16px;font-weight:700;color:var(--text)}
.photo-editor-close {
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 12px;
  background: rgba(0,0,0,0.05);
  color: var(--text-soft);
  font-size: 20px;
}
.photo-editor-tip {
  font-size: 12px;
  color: var(--text-soft);
  line-height: 1.5;
}
.photo-editor-stage {
  flex: 1;
  min-height: 0;
  background: #eff5ff;
  border: 1px solid rgba(74,144,226,0.12);
  border-radius: 18px;
  padding: 10px;
}
.photo-editor-canvas-wrap {
  width: 100%;
  height: 100%;
  max-height: none;
  overflow: auto;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(45deg, rgba(74,144,226,0.06) 25%, transparent 25%, transparent 75%, rgba(74,144,226,0.06) 75%),
    linear-gradient(45deg, rgba(74,144,226,0.06) 25%, transparent 25%, transparent 75%, rgba(74,144,226,0.06) 75%);
  background-size: 20px 20px;
  background-position: 0 0, 10px 10px;
}
.photo-editor-canvas {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  touch-action: none;
  background: #fff;
  border-radius: 14px;
}
.photo-editor-toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.photo-tool-btn,.photo-editor-action {
  border: none;
  border-radius: 12px;
  min-height: 40px;
  padding: 0 14px;
  font-size: 13px;
  font-weight: 700;
}
.photo-tool-btn {
  background: rgba(74,144,226,0.08);
  color: var(--primary);
  border: 1px solid rgba(74,144,226,0.16);
}
.photo-tool-btn.active {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  border-color: transparent;
}
.photo-editor-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.photo-editor-action {
  background: rgba(0,0,0,0.05);
  color: var(--text);
}
.photo-editor-action.primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
}
.btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(74,144,226,0.35);
  transition: var(--transition);
  margin-top: 0;
}
.btn:active {transform: scale(0.98)}
.btn:disabled {opacity: 0.5; cursor: not-allowed}
.loading-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.loading-overlay.show {display: flex}
.loading-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {to {transform: rotate(360deg)}}
.toast {
  position: fixed;
  top: 44%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(15,23,42,0.7);
  color: #fff;
  padding: 11px 18px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  z-index: 10001;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s ease;
  box-shadow: 0 12px 28px rgba(0,0,0,0.22);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.toast.show {opacity: 1}
.autocomplete-wrap {position: relative}
.autocomplete-list {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  max-height: 160px;
  overflow-y: auto;
  z-index: 100;
  display: none;
}
.autocomplete-list.show {display: block}
.autocomplete-item {
  padding: 12px 14px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(0,0,0,0.04);
  transition: background 0.15s;
}
.autocomplete-item:last-child {border-bottom: none}
.autocomplete-item:hover {background: rgba(74,144,226,0.08)}
.autocomplete-item .name {font-weight: 600; font-size: 14px}
.autocomplete-item .meta {font-size: 11px; color: #999}
.autocomplete-item .emp-id {font-size: 12px; color: var(--primary)}
/* 区域选择器 */
.area-selector {
  position: relative;
  background: rgba(74,144,226,0.04);
  border: 1px solid rgba(74,144,226,0.14);
  border-radius: 14px;
  padding: 10px;
}
.area-search-wrap {
  display: flex;
  align-items: center;
  background: #fff;
  border: 1px solid rgba(74,144,226,0.16);
  border-radius: 12px;
  padding: 0 10px;
  margin-bottom: 10px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.area-search-wrap:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(74,144,226,0.1);
}
.area-search {
  flex: 1;
  min-width: 0;
  border: none;
  background: transparent;
  padding: 12px 0;
  font-size: 14px;
  color: var(--text);
  outline: none;
  font-family: inherit;
}
.area-search::placeholder {color: #9aa8bd}
.area-search-clear {
  border: none;
  background: rgba(74,144,226,0.12);
  color: var(--primary);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  display: none;
  padding: 0;
  align-items: center;
  justify-content: center;
}
.area-search-clear.show {display: flex}
#areaSelector.has-selection .area-search-wrap {display: none}
.area-list {
  max-height: 330px;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding-right: 2px;
}
/* 分组头横向排列 */
.area-groups-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  position: sticky;
  top: 0;
  z-index: 2;
  background: rgba(244,249,255,0.96);
  padding-bottom: 8px;
}
.area-group-header {
  min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  min-height: 38px;
  padding: 9px 4px; background: #fff; border: 1px solid rgba(74,144,226,0.12); border-radius: 11px;
  font-size: 12px; font-weight: 600; color: var(--text-soft);
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.area-group-header:first-child {margin-top: 0}
.area-group-header.clickable:hover {background: rgba(0,0,0,0.06)}
.area-group-header.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 6px 14px rgba(74,144,226,0.2);
}
.area-group-dot {width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0}
.area-group-header.active .area-group-dot {background:#fff!important}
.area-list-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  padding: 8px 0 2px;
}
.area-item {
  background: white; border: 1px solid rgba(74,144,226,0.16); border-radius: 12px;
  padding: 10px 9px; cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; text-align: left;
  min-height: 52px; justify-content: flex-start;
}
.area-item:active {transform: scale(0.96); background: rgba(74,144,226,0.08)}
.area-item.selected {background: rgba(74,144,226,0.1); border-color: var(--primary)}
.area-item-left {display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0}
.area-zone-badge {
  width: 4px; height: 28px; border-radius: 3px; flex-shrink: 0;
}
.area-item-info {flex: 1; min-width: 0}
.area-item-name {font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.35; word-break: break-word}
.area-item-meta {font-size: 10px; color: #999; margin-top: 3px}
.area-item-check {
  position: absolute; top: 4px; right: 4px;
  width: 16px; height: 16px; border-radius: 50%; background: var(--primary); color: white;
  display: none; align-items: center; justify-content: center; font-size: 10px;
}
.area-item {position: relative}
.area-item.selected .area-item-check {display: flex}
.area-empty {text-align: center; padding: 32px 14px; color: #bbb; font-size: 14px}
/* 已选显示 */
.area-selected-wrap {
  display: none; margin-bottom: 10px;
}
.area-selected-wrap.show {display: block}
.area-selected-card {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; background: rgba(74,144,226,0.08); border: 1px solid rgba(74,144,226,0.2);
  border-radius: 10px;
}
.area-selected-left {display: flex; align-items: center; gap: 8px}
.area-selected-badge {width: 4px; height: 28px; border-radius: 2px}
.area-selected-text {font-size: 14px; color: var(--primary); font-weight: 500}
.area-selected-meta {font-size: 11px; color: var(--text-soft); margin-top: 2px}
.area-selected-clear {
  background: rgba(74,144,226,0.15); color: var(--primary); border: none;
  padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
}
</style>
</head>
<body>
<div class="page-wrap">
<div class="card">
  <div class="card-title">基本信息</div>

  <div class="form-group">
    <label class="form-label">项目编号<span class="required">*</span></label>
    <input type="text" class="form-input" id="projectCode" placeholder="自动生成" readonly>
  </div>

  <div class="form-group">
    <label class="form-label">检查日期<span class="required">*</span></label>
    <div class="date-picker-wrap">
      <input type="date" id="checkDate">
      <div class="date-picker-display" id="checkDateDisplay">
        <span>请选择日期</span>
        <span class="date-arrow">⌄</span>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">区域划分<span class="required">*</span></label>
    <div class="area-selector" id="areaSelector">
      <div class="area-search-wrap">
        <input type="text" class="area-search" id="areaSearch" placeholder="输入区域名称/编号/责任人..." autocomplete="off">
        <button type="button" class="area-search-clear" id="areaSearchClear">×</button>
      </div>
      <div class="area-selected-wrap" id="areaSelectedWrap">
        <div class="area-selected-card">
          <div class="area-selected-left">
            <div class="area-selected-badge" id="areaSelBadge"></div>
            <div>
              <div class="area-selected-text" id="areaSelText">-</div>
              <div class="area-selected-meta" id="areaSelMeta">-</div>
            </div>
          </div>
          <button class="area-selected-clear" id="areaSelClear">清除</button>
        </div>
      </div>
      <div class="area-list" id="areaList"></div>
    </div>
    <input type="hidden" id="area">
    <input type="hidden" id="areaId">
  </div>

  <div class="form-group">
    <label class="form-label">责任人</label>
    <div class="autocomplete-wrap">
      <input type="text" class="form-input" id="personCharge" placeholder="输入姓名/工号/拼音搜索" autocomplete="off">
      <div class="autocomplete-list" id="autocompleteList"></div>
    </div>
    <input type="hidden" id="assignedTo">
    <div class="hint">选择区域后自动带出</div>
  </div>

  <div class="form-group">
    <label class="form-label">问题描述<span class="required">*</span></label>
    <textarea class="form-textarea" id="description" placeholder="请详细描述问题..."></textarea>
  </div>

  <div class="form-group">
    <label class="form-label">整改截止日期</label>
    <div class="date-picker-wrap">
      <input type="date" id="deadline">
      <div class="date-picker-display" id="deadlineDisplay">
        <span>请选择日期</span>
        <span class="date-arrow">⌄</span>
      </div>
    </div>
    
  </div>
</div>

<div class="card">
  <div class="card-title">展示照片</div>
  <div class="photo-stack">
    <div id="beforePhotoCount" style="display:none">0/9</div>
    <input type="file" accept="image/*" capture="environment" id="beforeImage" class="photo-file-input" onchange="handleBeforeImageSelect(this)">
    <div class="photo-grid" id="beforePhotoGrid"></div>
  </div>
</div>

<button class="btn" id="submitBtn" onclick="submitForm()">提交曝光</button>
</div>

<div class="date-modal" id="dateModal">
  <div class="date-sheet">
    <div class="date-sheet-head">
      <button type="button" class="date-sheet-btn cancel" onclick="closeDatePicker()">取消</button>
      <div class="date-sheet-title" id="dateSheetTitle">选择日期</div>
      <button type="button" class="date-sheet-btn" onclick="confirmDatePicker()">确定</button>
    </div>
    <div class="date-columns">
      <div class="date-field">
        <label>年份</label>
        <div class="date-stepper">
          <button type="button" onclick="adjustDatePart('year',-1)">−</button>
          <span id="dateYearText">2026</span>
          <button type="button" onclick="adjustDatePart('year',1)">+</button>
        </div>
      </div>
      <div class="date-field">
        <label>月份</label>
        <div class="date-stepper">
          <button type="button" onclick="adjustDatePart('month',-1)">−</button>
          <span id="dateMonthText">5</span>
          <button type="button" onclick="adjustDatePart('month',1)">+</button>
        </div>
      </div>
      <div class="date-field">
        <label>日期</label>
        <div class="date-stepper">
          <button type="button" onclick="adjustDatePart('day',-1)">−</button>
          <span id="dateDayText">26</span>
          <button type="button" onclick="adjustDatePart('day',1)">+</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
<div id="toast" class="toast"></div>
<div class="photo-editor-modal" id="photoEditorModal">
  <div class="photo-editor-sheet">
    <div class="photo-editor-head">
      <div class="photo-editor-title">照片标注</div>
      <button type="button" class="photo-editor-close" onclick="closePhotoEditor()">×</button>
    </div>
    <div class="photo-editor-toolbar">
      <button type="button" class="photo-tool-btn" id="toolPenBtn" onclick="setPhotoTool('pen')">画笔</button>
      <button type="button" class="photo-tool-btn active" id="toolRectBtn" onclick="setPhotoTool('rect')">框选</button>
      <button type="button" class="photo-tool-btn" onclick="undoPhotoEdit()">撤销</button>
      <button type="button" class="photo-tool-btn" onclick="clearPhotoEdit()">清空</button>
    </div>
    <div class="photo-editor-stage">
      <div class="photo-editor-canvas-wrap" id="photoEditorCanvasWrap">
        <canvas class="photo-editor-canvas" id="photoEditorCanvas"></canvas>
      </div>
    </div>
    <div class="photo-editor-actions">
      <button type="button" class="photo-editor-action" id="photoEditorSkipBtn" onclick="skipPhotoEdit()">使用原图</button>
      <button type="button" class="photo-editor-action primary" onclick="savePhotoEdit()">保存标注</button>
    </div>
  </div>
</div>

<script>
var API=window.location.origin+"/api";
var token=localStorage.getItem("employee_token");
if(!token){window.location.href="index.html"}

var beforeImageFiles=[];
var pendingBeforeImages=[];
var areaTree=[], staffList=[];
var photoEditorState={
  mode:"pen",
  pendingIndex:-1,
  editIndex:-1,
  originalFile:null,
  originalUrl:"",
  image:null,
  actions:[],
  currentAction:null,
  pointerId:null,
  dirty:false
};
var photoEditorCanvas=document.getElementById("photoEditorCanvas");
var photoEditorCanvasWrap=document.getElementById("photoEditorCanvasWrap");
var photoEditorCtx=photoEditorCanvas.getContext("2d");

function openBeforeImagePicker(){
  var input=document.getElementById("beforeImage");
  if(!input)return;
  if(typeof input.showPicker==="function"){
    input.showPicker();
    return;
  }
  input.click();
}

function handleBeforeImageSelect(input){
  var files=Array.prototype.slice.call(input.files||[]);
  input.value="";
  if(!files.length)return;
  var available=Math.max(0,9-beforeImageFiles.length);
  pendingBeforeImages=files.slice(0,available);
  if(!pendingBeforeImages.length){
    showToast("最多上传9张照片");
    return;
  }
  openNextBeforeImageEditor();
}

function removeBeforeImage(index,event){
  if(event){event.stopPropagation();event.preventDefault()}
  beforeImageFiles.splice(index,1);
  renderBeforePhotoGrid();
}

function editBeforeImage(index,event){
  if(event){event.stopPropagation();event.preventDefault()}
  if(index<0||index>=beforeImageFiles.length)return;
  openPhotoEditor(beforeImageFiles[index], index);
}

function openNextBeforeImageEditor(){
  if(!pendingBeforeImages.length){
    renderBeforePhotoGrid();
    return;
  }
  openPhotoEditor(pendingBeforeImages.shift(), -1);
}

function openPhotoEditor(file, editIndex){
  if(!file)return;
  closePhotoEditor(true);
  photoEditorState.originalFile=file;
  photoEditorState.editIndex=typeof editIndex==="number"?editIndex:-1;
  photoEditorState.actions=[];
  photoEditorState.currentAction=null;
  photoEditorState.pointerId=null;
  photoEditorState.dirty=false;
  photoEditorState.originalUrl=URL.createObjectURL(file);
  document.getElementById("photoEditorSkipBtn").textContent=photoEditorState.editIndex>=0?"不修改":"重新拍摄";
  var img=new Image();
  img.onload=function(){
    photoEditorState.image=img;
    photoEditorCanvas.width=img.naturalWidth;
    photoEditorCanvas.height=img.naturalHeight;
    setPhotoTool("rect");
    document.getElementById("photoEditorModal").classList.add("show");
    requestAnimationFrame(function(){
      fitPhotoEditorCanvas();
      redrawPhotoEditor();
    });
  };
  img.onerror=function(){
    var wasEditingExisting=photoEditorState.editIndex>=0;
    closePhotoEditor(true);
    showToast("照片读取失败");
    if(!wasEditingExisting){openNextBeforeImageEditor()}
  };
  img.src=photoEditorState.originalUrl;
}

function closePhotoEditor(silent){
  document.getElementById("photoEditorModal").classList.remove("show");
  if(photoEditorState.originalUrl){
    URL.revokeObjectURL(photoEditorState.originalUrl);
  }
  photoEditorState.originalUrl="";
  photoEditorState.originalFile=null;
  photoEditorState.image=null;
  photoEditorState.actions=[];
  photoEditorState.currentAction=null;
  photoEditorState.pointerId=null;
  photoEditorState.editIndex=-1;
  photoEditorState.dirty=false;
  if(!silent){
    pendingBeforeImages=[];
  }
}

function fitPhotoEditorCanvas(){
  if(!photoEditorState.image||!photoEditorCanvasWrap)return;
  var availableWidth=Math.max(220, photoEditorCanvasWrap.clientWidth-8);
  var availableHeight=Math.max(220, photoEditorCanvasWrap.clientHeight-8);
  var scale=Math.min(availableWidth/photoEditorState.image.naturalWidth, availableHeight/photoEditorState.image.naturalHeight);
  if(scale>1)scale=1;
  var width=Math.max(180, Math.round(photoEditorState.image.naturalWidth*scale));
  var height=Math.max(180, Math.round(photoEditorState.image.naturalHeight*scale));
  photoEditorCanvas.style.width=width+"px";
  photoEditorCanvas.style.height=height+"px";
}

function setPhotoTool(mode){
  photoEditorState.mode=mode==="rect"?"rect":"pen";
  document.getElementById("toolPenBtn").classList.toggle("active", photoEditorState.mode==="pen");
  document.getElementById("toolRectBtn").classList.toggle("active", photoEditorState.mode==="rect");
}

function redrawPhotoEditor(){
  if(!photoEditorState.image)return;
  photoEditorCtx.clearRect(0,0,photoEditorCanvas.width,photoEditorCanvas.height);
  photoEditorCtx.drawImage(photoEditorState.image,0,0,photoEditorCanvas.width,photoEditorCanvas.height);
  var allActions=photoEditorState.actions.slice();
  if(photoEditorState.currentAction)allActions.push(photoEditorState.currentAction);
  allActions.forEach(drawPhotoAction);
}

function drawPhotoAction(action){
  if(!action)return;
  photoEditorCtx.save();
  photoEditorCtx.lineCap="round";
  photoEditorCtx.lineJoin="round";
  photoEditorCtx.strokeStyle=action.color||"#ff3b30";
  photoEditorCtx.lineWidth=action.width||12;
  if(action.type==="pen"){
    if(!action.points||!action.points.length){photoEditorCtx.restore();return}
    photoEditorCtx.beginPath();
    photoEditorCtx.moveTo(action.points[0].x,action.points[0].y);
    for(var i=1;i<action.points.length;i++){
      photoEditorCtx.lineTo(action.points[i].x,action.points[i].y);
    }
    photoEditorCtx.stroke();
  }else if(action.type==="rect"){
    photoEditorCtx.strokeRect(action.x,action.y,action.w,action.h);
  }
  photoEditorCtx.restore();
}

function getCanvasPoint(event){
  var rect=photoEditorCanvas.getBoundingClientRect();
  var scaleX=photoEditorCanvas.width/rect.width;
  var scaleY=photoEditorCanvas.height/rect.height;
  return {
    x:(event.clientX-rect.left)*scaleX,
    y:(event.clientY-rect.top)*scaleY
  };
}

function onPhotoPointerDown(event){
  if(!photoEditorState.image)return;
  event.preventDefault();
  var point=getCanvasPoint(event);
  photoEditorState.pointerId=event.pointerId;
  if(photoEditorCanvas.setPointerCapture){
    photoEditorCanvas.setPointerCapture(event.pointerId);
  }
  if(photoEditorState.mode==="rect"){
    photoEditorState.currentAction={type:"rect",x:point.x,y:point.y,w:0,h:0,color:"#ff3b30",width:14};
  }else{
    photoEditorState.currentAction={type:"pen",points:[point],color:"#ff3b30",width:16};
  }
  redrawPhotoEditor();
}

function onPhotoPointerMove(event){
  if(photoEditorState.pointerId===null||event.pointerId!==photoEditorState.pointerId||!photoEditorState.currentAction)return;
  event.preventDefault();
  var point=getCanvasPoint(event);
  if(photoEditorState.currentAction.type==="rect"){
    photoEditorState.currentAction.w=point.x-photoEditorState.currentAction.x;
    photoEditorState.currentAction.h=point.y-photoEditorState.currentAction.y;
  }else{
    photoEditorState.currentAction.points.push(point);
  }
  redrawPhotoEditor();
}

function finishPhotoPointer(event){
  if(photoEditorState.pointerId===null||event.pointerId!==photoEditorState.pointerId||!photoEditorState.currentAction)return;
  event.preventDefault();
  if(photoEditorCanvas.releasePointerCapture){
    try{photoEditorCanvas.releasePointerCapture(event.pointerId)}catch(e){}
  }
  var action=photoEditorState.currentAction;
  photoEditorState.currentAction=null;
  photoEditorState.pointerId=null;
  if(action.type==="rect"){
    if(Math.abs(action.w)<6||Math.abs(action.h)<6){redrawPhotoEditor();return}
  }else if(!action.points||action.points.length<2){
    redrawPhotoEditor();
    return;
  }
  photoEditorState.actions.push(action);
  photoEditorState.dirty=true;
  redrawPhotoEditor();
}

function undoPhotoEdit(){
  if(!photoEditorState.actions.length)return;
  photoEditorState.actions.pop();
  photoEditorState.dirty=photoEditorState.actions.length>0;
  redrawPhotoEditor();
}

function clearPhotoEdit(){
  photoEditorState.actions=[];
  photoEditorState.currentAction=null;
  photoEditorState.dirty=false;
  redrawPhotoEditor();
}

function fileNameWithSuffix(file,suffix){
  var name=file&&file.name?file.name:"photo.jpg";
  var dot=name.lastIndexOf(".");
  if(dot===-1)return name+suffix+".jpg";
  return name.slice(0,dot)+suffix+name.slice(dot);
}

function applyEditedFile(file){
  if(photoEditorState.editIndex>=0){
    beforeImageFiles[photoEditorState.editIndex]=file;
  }else{
    beforeImageFiles.push(file);
  }
  renderBeforePhotoGrid();
}

function skipPhotoEdit(){
  if(photoEditorState.originalFile){
    var wasEditingExisting=photoEditorState.editIndex>=0;
    closePhotoEditor(true);
    if(!wasEditingExisting){
      pendingBeforeImages=[];
      openBeforeImagePicker();
    }else{
      renderBeforePhotoGrid();
    }
  }
}

function savePhotoEdit(){
  if(!photoEditorState.image||!photoEditorState.originalFile)return;
  if(!photoEditorState.actions.length){
    skipPhotoEdit();
    return;
  }
  photoEditorCanvas.toBlob(function(blob){
    if(!blob){
      showToast("保存标注失败");
      return;
    }
    var editedFile=new File([blob], fileNameWithSuffix(photoEditorState.originalFile,"-mark"), {type:"image/jpeg"});
    var wasEditingExisting=photoEditorState.editIndex>=0;
    applyEditedFile(editedFile);
    closePhotoEditor(true);
    if(!wasEditingExisting){
      openNextBeforeImageEditor();
    }
  },"image/jpeg",0.92);
}

function renderBeforePhotoGrid(){
  var grid=document.getElementById("beforePhotoGrid");
  var count=document.getElementById("beforePhotoCount");
  if(!grid||!count)return;
  count.textContent=beforeImageFiles.length+"/9";
  if(!beforeImageFiles.length){
    grid.innerHTML="<div class='photo-empty' style='grid-column:1/-1'><div class='photo-empty-title'>开始拍照</div><div class='photo-empty-subtitle'>单张拍摄，可连续补拍。</div></div>"
      +"<label for='beforeImage' class='photo-add'><div class='photo-add-icon'>+</div><div class='photo-add-text'>第一张</div></label>"
      +"<label for='beforeImage' class='photo-add'><div class='photo-add-icon'>+</div><div class='photo-add-text'>第二张</div></label>"
      +"<label for='beforeImage' class='photo-add'><div class='photo-add-icon'>+</div><div class='photo-add-text'>第三张</div></label>";
    return;
  }
  var html="";
  for(var i=0;i<beforeImageFiles.length;i++){
    var url=URL.createObjectURL(beforeImageFiles[i]);
    html+="<div class='photo-tile'><img src='"+url+"' alt='整改前照片'><button class='photo-edit-btn' onclick='editBeforeImage("+i+",event)'>✎</button><button class='photo-delete-btn' onclick='removeBeforeImage("+i+",event)'>×</button></div>";
  }
  if(beforeImageFiles.length<9){
    html+="<label for='beforeImage' class='photo-add'><div class='photo-add-icon'>+</div><div class='photo-add-text'>继续拍照</div></label>";
  }
  grid.innerHTML=html;
}

function showToast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(function(){t.classList.remove("show")},2000);
}
function showLoading(){document.getElementById("loadingOverlay").classList.add("show")}
function hideLoading(){document.getElementById("loadingOverlay").classList.remove("show")}

function validateForm(){
  if(!document.getElementById("checkDate").value){showToast("请选择检查日期");return false}
  if(!document.getElementById("area").value){showToast("请选择区域");return false}
  if(!document.getElementById("description").value.trim()){showToast("请输入问题描述");return false}
  if(!beforeImageFiles.length){showToast("请上传整改前照片");return false}
  if(!document.getElementById("projectCode").value.trim()){showToast("项目编号生成失败，请稍后重试");return false}
  return true;
}

async function submitForm(){
  if(!validateForm())return;
  var btn=document.getElementById("submitBtn");
  btn.disabled=true;
  showLoading();
  try{
    var formData=new FormData();
    formData.append("area",document.getElementById("area").value);
    formData.append("area_id",document.getElementById("areaId").value);
    formData.append("description",document.getElementById("description").value.trim());
    formData.append("check_date",document.getElementById("checkDate").value);
    var deadline=document.getElementById("deadline").value;
    if(deadline)formData.append("deadline",deadline);
    var chargeName=document.getElementById("personCharge").value.trim();
    formData.append("person_charge",chargeName);
    var assignedId=document.getElementById("assignedTo").value;
    if(!assignedId&&chargeName){
      var found=staffList.find(function(s){return s.name===chargeName});
      if(found)assignedId=found.id;
    }
    if(assignedId)formData.append("assigned_to",assignedId);
    for(var i=0;i<beforeImageFiles.length;i++){formData.append("before_image",beforeImageFiles[i])}
    var res=await fetch(API+"/6s",{method:"POST",headers:{"Authorization":"Bearer "+token},body:formData});
    var data=await res.json();
    hideLoading();
    btn.disabled=false;
    if(data.code===0){showToast("提交成功");setTimeout(function(){window.location.href="mobile-6s-list.html"},1500)}
    else{showToast(data.msg||"提交失败")}
  }catch(err){hideLoading();btn.disabled=false;showToast("提交失败")}
}

async function refreshProjectCode() {
  var checkDate = document.getElementById("checkDate").value;
  var projectInput = document.getElementById("projectCode");
  if (!checkDate) {
    projectInput.value = "";
    return;
  }
  projectInput.value = "生成中...";
  try {
    var res = await fetch(API + "/6s/next-project-code?check_date=" + encodeURIComponent(checkDate), {
      headers: {"Authorization": "Bearer " + token}
    });
    var data = await res.json();
    if (data.code === 0 && data.data && data.data.project_code) {
      projectInput.value = data.data.project_code;
    } else {
      projectInput.value = "";
      showToast(data.msg || "项目编号生成失败");
    }
  } catch (err) {
    projectInput.value = "";
    showToast("项目编号生成失败");
  }
}

// 同步日期显示文本
function formatDateText(value) {
  if (!value) return "请选择日期";
  var parts = value.split("-");
  if (parts.length !== 3) return value;
  return parts[0] + "年" + Number(parts[1]) + "月" + Number(parts[2]) + "日";
}

function syncDateDisplay(inputId, displayId) {
  var input = document.getElementById(inputId);
  var display = document.getElementById(displayId);
  if (input && display) {
    display.querySelector('span').textContent = formatDateText(input.value);
  }
}

var activeDateInputId = "";
var activeDateDisplayId = "";
var pickerDate = {year: 2026, month: 1, day: 1};

function pad2(n) {
  return String(n).padStart(2, "0");
}

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function renderPickerDate() {
  pickerDate.day = Math.min(pickerDate.day, daysInMonth(pickerDate.year, pickerDate.month));
  document.getElementById("dateYearText").textContent = pickerDate.year;
  document.getElementById("dateMonthText").textContent = pickerDate.month;
  document.getElementById("dateDayText").textContent = pickerDate.day;
}

function adjustDatePart(part, delta) {
  if (part === "year") {
    pickerDate.year += delta;
  } else if (part === "month") {
    pickerDate.month += delta;
    if (pickerDate.month < 1) {
      pickerDate.month = 12;
      pickerDate.year -= 1;
    } else if (pickerDate.month > 12) {
      pickerDate.month = 1;
      pickerDate.year += 1;
    }
  } else if (part === "day") {
    pickerDate.day += delta;
    var maxDay = daysInMonth(pickerDate.year, pickerDate.month);
    if (pickerDate.day < 1) pickerDate.day = maxDay;
    if (pickerDate.day > maxDay) pickerDate.day = 1;
  }
  renderPickerDate();
}

function openDatePicker(inputId, displayId, title) {
  activeDateInputId = inputId;
  activeDateDisplayId = displayId;
  document.getElementById("dateSheetTitle").textContent = title || "选择日期";
  var value = document.getElementById(inputId).value;
  var now = value ? new Date(value + "T00:00:00") : new Date();
  var year = now.getFullYear();
  var month = now.getMonth() + 1;
  var day = now.getDate();
  pickerDate = {year: year, month: month, day: day};
  renderPickerDate();
  document.getElementById("dateModal").classList.add("show");
}

function closeDatePicker() {
  document.getElementById("dateModal").classList.remove("show");
}

function confirmDatePicker() {
  var y = pickerDate.year;
  var m = pad2(pickerDate.month);
  var d = pad2(pickerDate.day);
  var input = document.getElementById(activeDateInputId);
  input.value = y + "-" + m + "-" + d;
  syncDateDisplay(activeDateInputId, activeDateDisplayId);
  closeDatePicker();
  input.dispatchEvent(new Event("change"));
}

document.getElementById("dateModal").addEventListener("click", function(e) {
  if (e.target.id === "dateModal") closeDatePicker();
});

document.getElementById("checkDateDisplay").addEventListener("click", function() {
  openDatePicker("checkDate", "checkDateDisplay", "选择检查日期");
});
document.getElementById("deadlineDisplay").addEventListener("click", function() {
  openDatePicker("deadline", "deadlineDisplay", "选择整改截止日期");
});

var today=new Date();
document.getElementById("checkDate").value=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
var deadlineDate=new Date(today);
deadlineDate.setDate(deadlineDate.getDate()+3);
document.getElementById("deadline").value=deadlineDate.getFullYear()+"-"+String(deadlineDate.getMonth()+1).padStart(2,"0")+"-"+String(deadlineDate.getDate()).padStart(2,"0");
syncDateDisplay("checkDate", "checkDateDisplay");
syncDateDisplay("deadline", "deadlineDisplay");
renderBeforePhotoGrid();
photoEditorCanvas.addEventListener("pointerdown", onPhotoPointerDown);
photoEditorCanvas.addEventListener("pointermove", onPhotoPointerMove);
photoEditorCanvas.addEventListener("pointerup", finishPhotoPointer);
photoEditorCanvas.addEventListener("pointercancel", finishPhotoPointer);
document.getElementById("photoEditorModal").addEventListener("click", function(e){
  if(e.target.id==="photoEditorModal") closePhotoEditor();
});
window.addEventListener("resize", function(){
  if(document.getElementById("photoEditorModal").classList.contains("show")){
    fitPhotoEditorCanvas();
    redrawPhotoEditor();
  }
});

document.getElementById("checkDate").addEventListener("change",function(){
  var d=this.value;
  syncDateDisplay("checkDate", "checkDateDisplay");
  if(d){
    var dl=new Date(d);
    dl.setDate(dl.getDate()+3);
    document.getElementById("deadline").value=dl.getFullYear()+"-"+String(dl.getMonth()+1).padStart(2,"0")+"-"+String(dl.getDate()).padStart(2,"0");
    syncDateDisplay("deadline", "deadlineDisplay");
  }
  refreshProjectCode();
});

var selectedArea = null;
var currentGroup = null; // 当前展开的分组

function buildS6ZonesFromApiLeaves(leaves) {
  var zoneOrder = ['生产区', '仓库区', '公共区', '办公区'];
  var result = {};
  zoneOrder.forEach(function(zoneKey) {
    result[zoneKey] = {color: {'生产区':'#C55A11','仓库区':'#BF8F00','公共区':'#7F7F7F','办公区':'#595959'}[zoneKey], subs: {}};
  });
  (leaves || []).forEach(function(area) {
    var zoneKey = area.zone_name || '生产区';
    var subKey = area.category || '未分类';
    if (!result[zoneKey]) result[zoneKey] = {color: '#4A90E2', subs: {}};
    if (!result[zoneKey].subs[subKey]) result[zoneKey].subs[subKey] = [];
    result[zoneKey].subs[subKey].push({
      id: area.area_code || area.id,
      db_id: area.id,
      name: area.name,
      floor: area.floor || '',
      person: area.responsible || '',
      py: area.py || '',
      py_person: area.py_person || ''
    });
  });
  return result;
}

function loadSharedAreaData() {
  fetch('/api/6s/areas', {headers: {"Authorization":"Bearer "+token}})
    .then(function(r){return r.json()})
    .then(function(d){
      if (d.code === 0 && d.data && Array.isArray(d.data.leaves) && d.data.leaves.length) {
        s6Zones = buildS6ZonesFromApiLeaves(d.data.leaves);
      }
      renderAreaList();
    })
    .catch(function(){
      renderAreaList();
    });
}

// 扁平化所有区域
function getAllAreas() {
  var result = [];
  Object.keys(s6Zones).forEach(function(zoneKey) {
    var zone = s6Zones[zoneKey];
    Object.keys(zone.subs).forEach(function(subKey) {
      zone.subs[subKey].forEach(function(a) {
        result.push({zoneKey: zoneKey, zoneColor: zone.color, subKey: subKey, id: a.id, db_id: a.db_id || null, name: a.name, py: a.py, py_person: a.py_person, floor: a.floor, person: a.person});
      });
    });
  });
  return result;
}

// 分组点击：展开/折叠该分组
function toggleGroup(zoneKey) {
  if (currentGroup === zoneKey) {
    currentGroup = null; // 再次点击同一个分组，展开全部
  } else {
    currentGroup = zoneKey;
  }
  renderAreaList();
}

// 渲染列表（三列卡片布局，支持分组点击展开）
function renderAreaList() {
  var listEl = document.getElementById('areaList');
  var searchVal = document.getElementById('areaSearch').value.trim().toLowerCase();
  document.getElementById('areaSearchClear').classList.toggle('show', searchVal.length > 0);

  var allAreas = getAllAreas();
  var filtered = searchVal ? allAreas.filter(function(a) {
    if (/^\d+$/.test(searchVal)) {
      if (String(a.id).startsWith(searchVal)) return true;
      if (searchVal.length >= 4 && staffList.length) {
        for (var i = 0; i < staffList.length; i++) {
          var s = staffList[i];
          if (String(s.employee_id || '').includes(searchVal) && s.name === a.person) return true;
        }
      }
      return false;
    }
    if (a.name.toLowerCase().includes(searchVal)) return true;
    if (a.py && a.py.includes(searchVal)) return true;
    if (a.py_person && a.py_person.includes(searchVal)) return true;
    if (a.person.toLowerCase().includes(searchVal)) return true;
    return false;
  }) : allAreas;

  // 有选中区域：隐藏列表
  if (selectedArea) {
    listEl.innerHTML = '';
    listEl.style.display = 'none';
    return;
  }

  // 无搜索且无选中：显示列表
  listEl.style.display = 'block';

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="area-empty">无匹配区域，试试其他关键词</div>';
    return;
  }

  // 有搜索时显示所有区域
  if (searchVal) {
    var html = '<div class="area-groups-row">';
    var zoneOrder = ['生产区', '仓库区', '公共区', '办公区'];
    zoneOrder.forEach(function(zoneKey) {
      if (!s6Zones[zoneKey]) return;
      var zone = s6Zones[zoneKey];
      var zoneAreas = filtered.filter(function(a){ return a.zoneKey === zoneKey; });
      if (zoneAreas.length === 0) return;
      html += '<div class="area-group-header" onclick="toggleGroup(\'' + zoneKey + '\')"><div class="area-group-dot" style="background:' + zone.color + '"></div>' + zoneKey + '</div>';
    });
    html += '</div>';
    zoneOrder.forEach(function(zoneKey) {
      if (!s6Zones[zoneKey]) return;
      var zoneAreas = filtered.filter(function(a){ return a.zoneKey === zoneKey; });
      if (zoneAreas.length === 0) return;
      html += '<div class="area-list-grid">';
      zoneAreas.forEach(function(a) {
        html += '<div class="area-item' + (selectedArea && selectedArea.id === a.id ? ' selected' : '') + '" onclick="selectAreaById(' + a.id + ')">' +
          '<div class="area-item-left"><div class="area-zone-badge" style="background:' + a.zoneColor + '"></div>' +
          '<div class="area-item-info"><div class="area-item-name">' + a.id + ' ' + a.name + '</div></div></div>' +
          '<div class="area-item-check">✓</div></div>';
      });
      html += '</div>';
    });
    listEl.innerHTML = html;
    return;
  }

  // 默认显示：4个分组头，点击展开
  var html = '<div class="area-groups-row">';
  var zoneOrder = ['生产区', '仓库区', '公共区', '办公区'];
  var expandedAreas = [];
  zoneOrder.forEach(function(zoneKey) {
    if (!s6Zones[zoneKey]) return;
    var zone = s6Zones[zoneKey];
    var zoneAreas = filtered.filter(function(a){ return a.zoneKey === zoneKey; });
    if (zoneAreas.length === 0) return;
    html += '<div class="area-group-header' + (currentGroup === zoneKey ? ' active' : '') + '" onclick="toggleGroup(\'' + zoneKey + '\')"><div class="area-group-dot" style="background:' + zone.color + '"></div>' + zoneKey + '</div>';
    if (currentGroup === zoneKey) {
      expandedAreas = zoneAreas;
    }
  });
  html += '</div>';
  if (expandedAreas.length) {
    html += '<div class="area-list-grid">';
    expandedAreas.forEach(function(a) {
      html += '<div class="area-item' + (selectedArea && selectedArea.id === a.id ? ' selected' : '') + '" onclick="selectAreaById(' + a.id + ')">' +
        '<div class="area-item-left"><div class="area-zone-badge" style="background:' + a.zoneColor + '"></div>' +
        '<div class="area-item-info"><div class="area-item-name">' + a.id + ' ' + a.name + '</div></div></div>' +
        '<div class="area-item-check">✓</div></div>';
    });
    html += '</div>';
  }
  listEl.innerHTML = html;
}

async function selectAreaById(id) {
  var allAreas = getAllAreas();
  var found = allAreas.find(function(a){ return a.id === id; });
  if (!found) return;
  selectedArea = {id: found.id, dbId: found.db_id || found.id, name: found.name, floor: found.floor, person: found.person, zoneKey: found.zoneKey, zoneColor: found.zoneColor};
  document.getElementById('area').value = found.name;
  document.getElementById('areaId').value = found.db_id || found.id;
  document.getElementById('areaSelText').textContent = found.id + ' ' + found.name;
  document.getElementById('areaSelMeta').textContent = found.floor + ' · ' + found.person;
  document.getElementById('areaSelBadge').style.background = found.zoneColor;
  document.getElementById('areaSelector').classList.add('has-selection');
  document.getElementById('areaSelectedWrap').classList.add('show');
  document.getElementById('assignedTo').value = '';
  try {
    var res = await fetch('/api/6s/area-responsibles?area_id=' + encodeURIComponent(found.db_id || found.id), {headers: {"Authorization":"Bearer "+token}});
    var d = await res.json();
    var first = (d.data || [])[0];
    document.getElementById('personCharge').value = first ? first.name : found.person.split('/')[0].trim();
    document.getElementById('assignedTo').value = first ? (first.id || '') : '';
  } catch (e) {
    document.getElementById('personCharge').value = found.person.split('/')[0].trim();
  }
  renderAreaList();
}

function clearAreaSelection() {
  selectedArea = null;
  document.getElementById('area').value = '';
  document.getElementById('areaId').value = '';
  document.getElementById('areaSelector').classList.remove('has-selection');
  document.getElementById('areaSelectedWrap').classList.remove('show');
  document.getElementById('areaList').style.display = 'block';
  document.getElementById('personCharge').value = '';
  document.getElementById('assignedTo').value = '';
  renderAreaList();
}

loadSharedAreaData();

// 清除按钮事件
document.getElementById('areaSelClear').addEventListener('click', function() {
  currentGroup = null;
  clearAreaSelection();
});

document.getElementById('areaSearch').addEventListener('input', function() {
  renderAreaList();
});

document.getElementById('areaSearchClear').addEventListener('click', function() {
  document.getElementById('areaSearch').value = '';
  currentGroup = null;
  renderAreaList();
  document.getElementById('areaSearch').focus();
});

fetch("/api/staff?status=active",{headers:{"Authorization":"Bearer "+token}})
.then(function(r){return r.json()})
.then(function(d){if(d.code===0&&d.data){staffList=d.data.staff||d.data||[]}}).catch(function(){});

var personChargeInput=document.getElementById("personCharge");
var autocompleteList=document.getElementById("autocompleteList");

personChargeInput.addEventListener("input",function(){
  var val=this.value.trim().toLowerCase();
  if(!val||!staffList.length){autocompleteList.classList.remove("show");return}
  var matches=staffList.filter(function(s){
    var name=(s.name||"").toLowerCase();
    var empId=(s.employee_id||"").toLowerCase();
    var pinyin=(s.name_pinyin||"").toLowerCase();
    return name.includes(val)||empId.includes(val)||pinyin.includes(val);
  }).slice(0,10);
  if(matches.length===0){autocompleteList.classList.remove("show");return}
  autocompleteList.innerHTML=matches.map(function(s){
    return "<div class='autocomplete-item' onclick='selectStaff(\""+(s.name||"")+"\",\""+(s.id||"")+"\")'><div><div class='name'>"+(s.name||"-")+"</div><div class='meta'>"+(s.department||"")+"</div></div><div class='emp-id'>"+(s.employee_id||"")+"</div></div>";
  }).join("");
  autocompleteList.classList.add("show");
});

document.addEventListener("click",function(e){if(!e.target.closest(".autocomplete-wrap")){autocompleteList.classList.remove("show")}});

function selectStaff(name,id){
  personChargeInput.value=name;
  document.getElementById("assignedTo").value=id||"";
  autocompleteList.classList.remove("show");
}
</script>
</body>
