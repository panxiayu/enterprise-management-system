<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>在线培训 - 兴利汽车模具</title>
    <link rel="stylesheet" href="css/mobile-theme.css">
    <style>
        :root {
            --bg: #F0F7FF;
            --card: #ffffff;
            --border: #D6E9FF;
            --primary: #4A90E2;
            --secondary: #65B3FF;
            --accent: #22C58D;
            --text: #1D2B5A;
            --text-soft: #5B72A9;
            --radius: 22px;
            --transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            --shadow: 0 8px 24px rgba(74, 144, 226, 0.12);
            --shadow-hover: 0 16px 40px rgba(74, 144, 226, 0.18);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 40px;
            padding-top: 20px;
        }

        /* 序列入场动画 */
        .fade-item {
            opacity: 0;
            transform: translateY(30px);
            transition: var(--transition);
        }
        .fade-in {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 16px;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 680px;
                padding: 0 24px;
            }
            .training-item {
                padding: 24px 28px;
            }
            .training-title {
                font-size: 17px;
            }
            .training-desc {
                font-size: 14px;
            }
            .stat-card {
                padding: 20px 18px;
            }
            .stat-value {
                font-size: 28px;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 800px;
            }
        }

        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            flex: 1;
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 16px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-soft);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-soft);
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--secondary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-soft);
        }
        .empty-icon { width: 100px; height: 100px; margin: 0 auto 12px; }
        .empty-icon img { width: 100%; height: 100%; }
        .empty-text { font-size: 15px; }

        .training-item {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
        }
        .training-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }
        .training-item:active { transform: scale(0.98); }
        .training-item.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .training-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .training-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .training-info {
            flex: 1;
            min-width: 0;
        }

        .training-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .training-desc {
            font-size: 15px;
            color: var(--text-soft);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .training-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: -20px;
        }

        .training-info-row {
            display: flex;
            gap: 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            padding-left: 5px;
            margin-top: 9px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
        }

        .status-not-started { background: rgba(91,114,169,0.1); color: var(--text-soft); }
        .status-in-progress { background: rgba(255,149,0,0.1); color: #ff9500; }
        .status-completed { background: rgba(34,197,141,0.1); color: var(--accent); }
        .status-passed { background: rgba(74,144,226,0.1); color: var(--primary); }
        .status-failed { background: rgba(239,68,68,0.1); color: #ef4444; }
        .status-unavailable { background: rgba(239,68,68,0.1); color: #ef4444; }
        .status-retake { background: rgba(255,149,0,0.15); color: #ff9500; border: 1.5px solid rgba(255,149,0,0.3); padding: 12px 20px; font-size: 20px; }
        .status-retake-used { background: rgba(239,68,68,0.15); color: #ef4444; border: 1.5px solid rgba(239,68,68,0.3); padding: 12px 20px; font-size: 20px; }
        .status-ended { background: rgba(156,163,175,0.15); color: #9ca3af; border: 1.5px solid rgba(156,163,175,0.3); padding: 12px 20px; font-size: 20px; }

        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: #ef4444;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 10000;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .training-action {
            margin-top: 12px;
            padding: 10px 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .training-action:active { transform: scale(0.98); }

        .btn-join {
            background: linear-gradient(135deg, #4A90E2, #65B3FF);
            color: white;
            box-shadow: 0 4px 16px rgba(74, 144, 226, 0.3);
        }
        .btn-join:hover {
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
        }

        .btn-retake {
            background: linear-gradient(135deg, #ff9500, #ffb340);
            color: white;
            box-shadow: 0 4px 16px rgba(255, 149, 0, 0.3);
        }
        .btn-retake:hover {
            box-shadow: 0 6px 20px rgba(255, 149, 0, 0.4);
        }

        .btn-retake-used {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: white;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
        }
        .btn-retake-used:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-ended {
            background: linear-gradient(135deg, #9ca3af, #d1d5db);
            color: white;
            box-shadow: 0 4px 16px rgba(156, 163, 175, 0.3);
        }
        .btn-ended:hover {
            box-shadow: 0 6px 20px rgba(156, 163, 175, 0.4);
        }

        .btn-completed {
            background: linear-gradient(135deg, #22c58d, #34d399);
            color: white;
            box-shadow: 0 4px 16px rgba(34, 197, 141, 0.3);
        }
        .btn-completed:hover {
            box-shadow: 0 6px 20px rgba(34, 197, 141, 0.4);
        }

        .training-time-container {
            margin-top: 5px;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.08), rgba(101, 179, 255, 0.08));
            border-radius: 10px;
            border: 1px solid rgba(74, 144, 226, 0.15);
        }
        .training-time-label {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .training-time-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.8;
        }
        .training-time-icon {
            font-size: 16px;
        }
        .training-time-separator {
            color: var(--primary);
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats-row fade-item">
            <div class="stat-card">
                <div class="stat-value" id="statTaskCount">-</div>
                <div class="stat-label">培训任务</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statLearnedCount">-</div>
                <div class="stat-label">已学习</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statPassedCount">-</div>
                <div class="stat-label">已通过</div>
            </div>
        </div>

        <div id="loading" class="loading fade-item" style="display: none;">加载中...</div>
        <div id="emptyState" class="empty-state fade-item" style="display: none;">
            <div class="empty-icon"><img src="icons/icon-empty-training.svg" alt=""></div>
            <div class="empty-text">暂无培训任务</div>
        </div>
        <div id="noPermission" class="empty-state fade-item" style="display: none;">
            <div class="empty-icon"><img src="icons/icon-empty-training.svg" alt=""></div>
            <div class="empty-text">暂无权限访问培训</div>
        </div>
        <div id="trainingList"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/js/auth-guard.js"></script>
    <script>
        const API = window.location.origin + '/api';
        let token = localStorage.getItem('employee_token');

        if (!token) {
            window.location.href = 'index.html';
        }

        async function loadData() {
            try {
                document.getElementById('loading').style.display = '';

                // 先检查培训权限
                const permRes = await fetch(API + '/permissions/exams/my-perm', { headers: { 'Authorization': 'Bearer ' + token } });
                const permData = await permRes.json();

                if (permData.code !== 0 || !permData.data?.has_perm) {
                    // 无权限，隐藏页面
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('noPermission').style.display = '';
                    const items = document.querySelectorAll('.fade-item');
                    items.forEach((el, i) => {
                        setTimeout(() => el.classList.add('fade-in'), 150 * i);
                    });
                    return;
                }

                const [examRes, myStatsRes] = await Promise.all([
                    fetch(API + '/exam/list', { headers: { 'Authorization': 'Bearer ' + token } }),
                    fetch(API + '/learning-materials/my-stats', { headers: { 'Authorization': 'Bearer ' + token } })
                ]);

                const examData = await examRes.json();
                const myStatsData = await myStatsRes.json();

                document.getElementById('loading').style.display = 'none';

                // 统计培训任务数
                const taskCount = examData.data?.length || 0;
                document.getElementById('statTaskCount').textContent = taskCount;

                // 使用统计数据
                if (myStatsData.code === 0 && myStatsData.data) {
                    document.getElementById('statLearnedCount').textContent = myStatsData.data.learnedCount || 0;
                    document.getElementById('statPassedCount').textContent = myStatsData.data.passedCount || 0;
                } else {
                    document.getElementById('statLearnedCount').textContent = '0';
                    document.getElementById('statPassedCount').textContent = '0';
                }

                if (examData.code === 0 && examData.data && examData.data.length > 0) {
                    renderTrainings(examData.data);
                } else {
                    document.getElementById('emptyState').style.display = '';
                }

                // 序列入场动画
                const items = document.querySelectorAll('.fade-item');
                items.forEach((el, i) => {
                    setTimeout(() => el.classList.add('fade-in'), 150 * i);
                });
            } catch (err) {
                document.getElementById('loading').textContent = '加载失败';
                console.error('加载失败:', err);
            }
        }

        function renderTrainings(trainings) {
            const list = document.getElementById('trainingList');

            const html = trainings.map(training => {
                let statusClass = 'status-not-started';
                let statusText = '参加培训';
                let isDisabled = false;
                let isButton = true; // 是否显示为按钮样式
                let clickHandler = 'goToTraining(' + training.learning_task_id + ', ' + training.id + ')';

                // 判断考试状态
                // 检查培训时间是否到期
                const now = new Date();
                const endTime = training.end_time ? new Date(training.end_time) : null;
                const isExpired = endTime && now > endTime;

                // 1. 正式考试通过 或 补考通过 → 培训合格（绿色）
                if ((training.completed && training.is_passed) || training.retake_passed) {
                    statusClass = 'status-passed';
                    statusText = '培训合格';
                    if (isExpired) {
                        clickHandler = 'showUnavailableToast(\'培训已结束\')';
                        isDisabled = true;
                        isButton = false;
                    } else {
                        clickHandler = 'openExamResult(' + training.id + ')';
                        isDisabled = false;
                        isButton = false;
                    }
                }
                // 2. 有补考资格且培训时间内 → 待补考（黄色）
                else if (training.completed && !training.is_passed && !training.retake_used && !isExpired) {
                    statusClass = 'status-retake';
                    statusText = '待补考';
                    clickHandler = 'openExamResult(' + training.id + ')';
                    isDisabled = false;
                    isButton = false;
                }
                // 3. 正式未通过 + 补考机会已用尽 → 培训不合格（红色）
                else if (training.completed && !training.is_passed && training.retake_used) {
                    statusClass = 'status-failed';
                    statusText = '培训不合格';
                    clickHandler = 'openExamResult(' + training.id + ')';
                    isDisabled = false;
                    isButton = false;
                }
                // 4. 有补考资格但培训时间已到期 → 培训不合格（红色）
                else if (training.completed && !training.is_passed && !training.retake_used && isExpired) {
                    statusClass = 'status-failed';
                    statusText = '培训不合格';
                    clickHandler = 'showUnavailableToast(\'培训已结束\')';
                    isDisabled = true;
                    isButton = false;
                }
                // 5. 未参加任何考试 + 培训时间已到期 → 培训不合格（红色）
                else if (isExpired) {
                    statusClass = 'status-failed';
                    statusText = '培训不合格';
                    clickHandler = 'showUnavailableToast(\'培训已结束\')';
                    isDisabled = true;
                    isButton = false;
                }
                // 6. 暂不可参加
                else if (!training.is_available) {
                    statusClass = 'status-unavailable';
                    statusText = training.unavailable_reason || '不可参加';
                    clickHandler = 'showUnavailableToast(\'' + (training.unavailable_reason || '暂不可参加') + '\')';
                    isDisabled = true;
                    isButton = false;
                }

                // 保存 isExpired 供后面使用
                const isExpiredForMeta = isExpired;

                // 格式化培训时间
                let timeHtml = '';
                console.log('培训时间数据:', training.title, 'start_time:', training.start_time, 'end_time:', training.end_time);
                if (training.start_time || training.end_time) {
                    const formatDate = (dateStr) => {
                        if (!dateStr) return '';
                        const d = new Date(dateStr);
                        const month = d.getMonth() + 1;
                        const day = d.getDate();
                        const hours = String(d.getHours()).padStart(2, '0');
                        const minutes = String(d.getMinutes()).padStart(2, '0');
                        return { date: `${month}月${day}日`, time: `${hours}:${minutes}` };
                    };
                    const start = formatDate(training.start_time);
                    const end = formatDate(training.end_time);

                    if (start && end) {
                        timeHtml = `
                            <div class="training-time-container">
                                <div class="training-time-label">培训时间 ${new Date().getFullYear()}年度</div>
                                <div class="training-time-value">
                                    <span class="training-time-icon">📅</span>
                                    <span>${start.date} ${start.time}</span>
                                    <span class="training-time-separator">至</span>
                                    <span>${end.date} ${end.time}</span>
                                </div>
                            </div>`;
                    } else if (start) {
                        timeHtml = `
                            <div class="training-time-container">
                                <div class="training-time-label">开始时间 ${new Date().getFullYear()}年度</div>
                                <div class="training-time-value">
                                    <span class="training-time-icon">📅</span>
                                    <span>${start.date} ${start.time}</span>
                                </div>
                            </div>`;
                    } else if (end) {
                        timeHtml = `
                            <div class="training-time-container">
                                <div class="training-time-label">截止时间 ${new Date().getFullYear()}年度</div>
                                <div class="training-time-value">
                                    <span class="training-time-icon">⏰</span>
                                    <span>${end.date} ${end.time}</span>
                                </div>
                            </div>`;
                    }
                }

                // 按钮样式 - 按状态使用不同渐变按钮
                let buttonClass = 'training-action btn-join'; // 默认蓝色渐变（参加培训）
                if (statusClass === 'status-passed') {
                    buttonClass = 'training-action btn-completed'; // 培训合格：绿色渐变
                } else if (statusClass === 'status-retake') {
                    buttonClass = 'training-action btn-retake'; // 待补考：黄色渐变
                } else if (statusClass === 'status-failed' || statusClass === 'status-retake-used') {
                    buttonClass = 'training-action btn-retake-used'; // 培训不合格：红色渐变
                } else if (!isButton || isDisabled) {
                    buttonClass = `training-action status-badge ${statusClass}`;
                }

                // 培训时间到期后，不显示时长和及格分
                let metaHtml = '';
                if (!isExpiredForMeta) {
                    metaHtml = `
                        <div class="training-meta">
                            <div class="training-info-row">
                                <span>时长: ${training.duration || 60}分钟</span>
                                <span>及格分: ${training.pass_score || 60}分</span>
                            </div>
                            <span class="${buttonClass}" style="margin-top:20px;">${statusText}</span>
                        </div>
                    `;
                } else {
                    metaHtml = `
                        <div class="training-meta" style="display:flex;align-items:center;justify-content:space-between;">
                            <div></div>
                            <span class="${buttonClass}" style="margin-top:20px;">${statusText}</span>
                        </div>
                    `;
                }

                return `
                    <div class="training-item fade-item ${isDisabled ? 'disabled' : ''}" onclick="${clickHandler}">
                        <div class="training-header">
                            <div class="training-info">
                                <div class="training-title">${training.title || '未命名培训'}</div>
                            </div>
                        </div>
                        ${timeHtml}
                        ${metaHtml}
                    </div>
                `;
            }).join('');

            list.innerHTML = html;

            // 动画
            const items = list.querySelectorAll('.fade-item');
            items.forEach((el, i) => {
                setTimeout(() => el.classList.add('fade-in'), 150 * i);
            });
        }

        function goToTraining(learningTaskId, trainingId) {
            window.location.href = 'mobile-learning-materials-detail.html?id=' + learningTaskId + '&trainingId=' + trainingId;
        }

        function goToRetake(learningTaskId, trainingId) {
            window.location.href = 'mobile-exam-doing.html?id=' + trainingId + '&retake=1';
        }

        function openExamResult(trainingId) {
            const token = localStorage.getItem('employee_token');
            fetch(API + '/exam/my-records', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(r => r.json()).then(data => {
                if (data.code === 0 && data.data) {
                    // 找正式考试记录（非补考）
                    const examRecord = data.data.find(r => r.exam_id == trainingId && r.is_retake === 0);
                    if (examRecord) {
                        window.location.href = 'mobile-result.html?examId=' + trainingId + '&answerId=' + examRecord.id + '&readonly=1';
                    } else {
                        showUnavailableToast('暂无考试记录');
                    }
                }
            });
        }

        function openRetakeResult(trainingId) {
            const token = localStorage.getItem('employee_token');
            fetch(API + '/exam/my-records', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(r => r.json()).then(data => {
                if (data.code === 0 && data.data) {
                    const retakeRecord = data.data.find(r => r.exam_id == trainingId && r.is_retake === 1);
                    if (retakeRecord) {
                        window.location.href = 'mobile-result.html?examId=' + trainingId + '&answerId=' + retakeRecord.id + '&readonly=1&retake=1';
                    } else {
                        showUnavailableToast('暂无补考记录');
                    }
                }
            });
        }

        function showUnavailableToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        loadData();
    </script>
</body>
</html>
