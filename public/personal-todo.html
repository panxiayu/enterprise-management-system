<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人待办 - 兴利汽车模具</title>
    <style>
        :root{
            --bg:#edf5fd;
            --bg-strong:#f7fbff;
            --panel:rgba(248,251,255,.74);
            --panel-strong:rgba(255,255,255,.92);
            --panel-soft:rgba(255,255,255,.58);
            --line:rgba(132,168,206,.22);
            --line-strong:rgba(99,144,195,.38);
            --text:#1d3d67;
            --text-soft:#6884a3;
            --text-faint:#8ea4bc;
            --primary:#267ed9;
            --primary-deep:#1f5ea7;
            --primary-soft:rgba(38,126,217,.12);
            --green:#28a36a;
            --orange:#dd8a2e;
            --red:#d85d69;
            --shadow:0 26px 60px rgba(62,101,142,.12);
            --shadow-soft:0 14px 30px rgba(62,101,142,.08);
            --radius:28px;
            --shell-offset:28px;
            --workspace-height:clamp(420px,calc(100dvh - 250px),760px);
            --board-empty-height:clamp(300px,calc(var(--workspace-height) - 80px),680px);
            --board-empty-compact-height:clamp(180px,calc(var(--workspace-height) - 360px),260px);
        }
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        html,body{min-height:100%}
        body{
            min-height:100vh;
            font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
            color:var(--text);
            background:
                radial-gradient(circle at 10% 8%, rgba(191,228,255,.9), transparent 24%),
                radial-gradient(circle at 82% 12%, rgba(255,224,231,.5), transparent 20%),
                linear-gradient(135deg,#e3f0fb 0%,#f3f8fd 48%,#f7eff7 100%);
            -webkit-font-smoothing:antialiased;
        }
        button,input,select,textarea{font:inherit}
        button{cursor:pointer}
        .page{
            width:min(1760px,calc(100% - 30px));
            margin:14px auto;
            padding:18px;
            min-height:calc(100dvh - var(--shell-offset));
            border:1px solid rgba(255,255,255,.7);
            border-radius:34px;
            background:linear-gradient(180deg,rgba(249,252,255,.7),rgba(244,249,255,.54));
            backdrop-filter:blur(26px) saturate(130%);
            box-shadow:var(--shadow);
            position:relative;
            overflow:hidden;
            display:flex;
            flex-direction:column;
        }
        .page::before{
            content:"";
            position:absolute;
            inset:0;
            background:
                linear-gradient(90deg, rgba(255,255,255,.22), transparent 25%),
                linear-gradient(180deg, rgba(255,255,255,.28), transparent 20%);
            pointer-events:none;
        }
        .topbar,.summary,.workspace,.compose-wrap,.compose-banner{position:relative;z-index:1}
        .topbar{
            display:grid;
            grid-template-columns:minmax(220px,300px) minmax(620px,1fr) auto;
            gap:14px;
            align-items:center;
            margin-bottom:14px;
            padding:6px 4px 2px;
        }
        .brand{
            min-width:0;
            padding:4px 0 4px 6px;
        }
        .brand-page{
            min-width:0;
        }
        .brand-page strong{
            display:block;
            font-size:32px;
            font-weight:900;
            line-height:1;
            letter-spacing:.01em;
            color:#1f4675;
        }
        .search{
            display:flex;
            align-items:center;
            gap:10px;
            height:54px;
            padding:0 18px;
            border:1px solid rgba(255,255,255,.9);
            border-radius:20px;
            background:rgba(255,255,255,.76);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.62),var(--shadow-soft);
        }
        .search span{color:#7e98b4}
        .search input{
            width:100%;
            border:0;
            outline:0;
            background:transparent;
            color:var(--text);
            font-size:15px;
        }
        .search input::placeholder{color:#90a8c1}
        .actions{
            display:flex;
            align-items:center;
            align-self:start;
            gap:10px;
            flex-wrap:wrap;
            justify-content:flex-end;
        }
        .btn,.btn-primary,.btn-ghost,.btn-mini{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            text-decoration:none;
            border-radius:16px;
            transition:.18s ease;
            white-space:nowrap;
        }
        .btn,.btn-primary,.btn-ghost{
            height:40px;
            padding:0 16px;
            font-size:13px;
            font-weight:900;
            border:1px solid transparent;
        }
        .btn{
            background:rgba(255,255,255,.88);
            border-color:rgba(152,184,216,.24);
            color:var(--text);
        }
        .btn-primary{
            background:linear-gradient(135deg,var(--primary),#48a7ee);
            border-color:rgba(56,145,224,.34);
            color:#fff;
            box-shadow:0 12px 26px rgba(45,132,214,.24);
        }
        .btn-ghost{
            background:rgba(255,255,255,.56);
            border-color:rgba(169,196,221,.24);
            color:#597694;
        }
        .btn:hover,.btn-primary:hover,.btn-ghost:hover,.btn-mini:hover{transform:translateY(-1px)}
        .btn-mini{
            height:30px;
            padding:0 10px;
            border:1px solid rgba(151,182,212,.34);
            background:#fff;
            color:#6081a1;
            font-size:11px;
            font-weight:900;
        }
        .summary{
            display:grid;
            grid-template-columns:repeat(4,minmax(0,1fr));
            gap:10px;
            margin-bottom:14px;
        }
        .topbar .summary{
            margin-bottom:0;
            margin-left:-6px;
            margin-top:-4px;
            align-self:start;
        }
        .summary-card,.panel{
            border:1px solid rgba(255,255,255,.86);
            border-radius:24px;
            background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(246,250,255,.66));
            box-shadow:var(--shadow-soft);
        }
        .summary-card{
            --accent:var(--primary);
            --accent-soft:var(--primary-soft);
            min-height:86px;
            padding:12px 14px;
            position:relative;
            overflow:hidden;
            display:flex;
            align-items:center;
            gap:12px;
            width:100%;
            cursor:pointer;
            appearance:none;
            border-radius:18px;
            border-color:rgba(255,255,255,.86);
            background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(244,249,255,.72));
            transition:.22s ease;
            text-align:left;
            color:inherit;
        }
        .summary-card::before{
            content:"";
            position:absolute;
            inset:0;
            background:radial-gradient(120% 80% at 100% 0%,var(--accent-soft),transparent 60%);
            opacity:.9;
            pointer-events:none;
        }
        .summary-card .summary-icon{
            width:44px;
            height:44px;
            border-radius:14px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:var(--accent-soft);
            color:var(--accent);
            flex-shrink:0;
            position:relative;
            z-index:1;
            transition:.22s ease;
        }
        .summary-card .summary-icon svg{
            width:22px;
            height:22px;
            display:block;
        }
        .summary-copy{
            display:flex;
            flex-direction:column;
            align-items:flex-start;
            line-height:1.15;
            gap:3px;
            position:relative;
            z-index:1;
            min-width:0;
        }
        .summary-copy strong{
            font-size:24px;
            font-weight:900;
            color:var(--accent);
            line-height:1;
            letter-spacing:-.01em;
        }
        .summary-copy span{
            color:var(--text-soft);
            font-size:12px;
            font-weight:700;
            letter-spacing:.02em;
        }
        .summary-card.pending{--accent:#267ed9;--accent-soft:rgba(38,126,217,.14)}
        .summary-card.warn{--accent:#dd8a2e;--accent-soft:rgba(221,138,46,.16)}
        .summary-card.danger{--accent:#d85d69;--accent-soft:rgba(216,93,105,.16)}
        .summary-card.good{--accent:#28a36a;--accent-soft:rgba(40,163,106,.16)}
        .summary-card:hover{
            transform:translateY(-2px);
            border-color:var(--accent);
            box-shadow:0 18px 36px rgba(62,101,142,.16);
        }
        .summary-card.active{
            background:linear-gradient(180deg,rgba(255,255,255,.96),var(--accent-soft));
            border-color:var(--accent);
            box-shadow:0 16px 32px var(--accent-soft);
        }
        .summary-card.active .summary-icon{
            background:var(--accent);
            color:#fff;
            box-shadow:0 10px 22px var(--accent-soft);
        }
        .summary-card.active .summary-copy strong{
            color:var(--accent-deep,var(--accent));
        }
        .summary-card.pending{--accent-deep:#1f5ea7}
        .summary-card.warn{--accent-deep:#b06820}
        .summary-card.danger{--accent-deep:#a93d49}
        .summary-card.good{--accent-deep:#1c7a4f}
        .workspace{
            display:grid;
            grid-template-columns:252px minmax(0,1fr) 356px;
            gap:14px;
            align-items:stretch;
            flex:1;
            min-height:0;
        }
        .main-panel{
            display:flex;
            flex-direction:column;
            min-height:0;
        }
        .panel{
            padding:16px;
            position:relative;
            overflow:hidden;
        }
        .panel::before{
            content:"";
            position:absolute;
            inset:0;
            background:linear-gradient(180deg, rgba(255,255,255,.18), transparent 28%);
            pointer-events:none;
        }
        .panel > *{position:relative;z-index:1}
        .detail-panel{
            padding:0;
            background:transparent;
            border:0;
            box-shadow:none;
            display:flex;
            min-height:0;
        }
        .detail-panel::before{display:none}
        .detail-panel .panel-head{display:none}
        .panel-head{
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:12px;
            margin-bottom:12px;
        }
        .panel-head strong{
            display:block;
            font-size:16px;
            font-weight:900;
            line-height:1.2;
        }
        .panel-head span{
            display:block;
            margin-top:3px;
            color:var(--text-soft);
            font-size:11px;
            line-height:1.6;
        }
        .view-tabs{
            display:grid;
            gap:10px;
            margin-bottom:0;
        }
        .view-tab{
            display:grid;
            grid-template-columns:auto 1fr auto;
            gap:10px;
            width:100%;
            padding:14px 14px;
            border:1px solid rgba(154,186,215,.18);
            border-radius:18px;
            background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(247,251,255,.84));
            color:#587491;
            font-size:12px;
            font-weight:900;
            text-align:left;
            box-shadow:0 10px 20px rgba(61,104,145,.05);
            transition:.18s ease;
        }
        .view-tab:hover{
            transform:translateY(-1px);
            border-color:rgba(74,144,226,.28);
        }
        .view-tab-mark{
            width:24px;
            height:24px;
            border-radius:9px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            background:rgba(236,244,255,.92);
            color:#6a89ab;
            font-size:10px;
            font-weight:900;
        }
        .view-tab.active{
            border-color:rgba(38,126,217,.46);
            background:linear-gradient(135deg,rgba(38,126,217,.16),rgba(255,255,255,.92));
            color:var(--primary-deep);
            box-shadow:inset 3px 0 0 var(--primary),0 14px 24px rgba(38,126,217,.12);
        }
        .view-tab.active .view-tab-mark{
            background:rgba(38,126,217,.14);
            color:var(--primary);
        }
        .view-tab b{
            min-width:24px;
            height:24px;
            padding:0 9px;
            border-radius:999px;
            background:rgba(241,247,255,.92);
            display:inline-flex;
            align-items:center;
            justify-content:center;
            font-size:9px;
            color:#597999;
        }
        .filter-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:7px;
            margin-bottom:12px;
        }
        .filter-grid .search-small{grid-column:1 / -1}
        .input,.select,.textarea{
            width:100%;
            border:1px solid rgba(141,175,207,.22);
            border-radius:16px;
            background:#fff;
            color:var(--text);
            outline:0;
        }
        .input,.select{height:44px;padding:0 13px}
        .select-field{position:relative}
        .select-field .input{
            padding-right:36px;
            cursor:pointer;
            background:#fff;
            font-size:12px;
            font-weight:700;
            letter-spacing:.01em;
        }
        .select-field::before{
            content:"";
            position:absolute;
            right:16px;
            bottom:19px;
            width:7px;
            height:7px;
            border-right:2px solid #6886a6;
            border-bottom:2px solid #6886a6;
            transform:rotate(45deg);
            pointer-events:none;
            z-index:1;
        }
        .native-select{display:none}
        .select-trigger{
            display:flex;
            align-items:center;
            justify-content:flex-start;
            width:100%;
            text-align:left;
            gap:6px;
            padding-left:12px;
            padding-right:34px;
            line-height:1.35;
        }
        .select-trigger.open{
            border-color:#4a90e2;
            box-shadow:0 0 0 4px rgba(74,144,226,.12);
        }
        .textarea{
            min-height:110px;
            padding:12px;
            resize:vertical;
        }
        .search-small{position:relative}
        .search-small input{padding-left:38px}
        .search-small::before{
            content:"⌕";
            position:absolute;
            left:14px;
            top:11px;
            color:#88a3bf;
            font-size:14px;
        }
        .sidebar-section{
            margin-top:12px;
            padding-top:12px;
            border-top:1px solid rgba(154,186,215,.12);
        }
        .sidebar-section:first-of-type{
            margin-top:0;
            padding-top:0;
            border-top:0;
        }
        .section-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            margin-bottom:10px;
        }
        .section-head strong{
            font-size:11px;
            font-weight:900;
            color:#5a7694;
            letter-spacing:.04em;
        }
        .section-head span{
            color:#8ca5bd;
            font-size:10px;
            font-weight:700;
        }
        .chip-grid{
            display:grid;
            gap:8px;
        }
        .chip-grid.cols-4{
            grid-template-columns:repeat(4,minmax(0,1fr));
        }
        .chip-grid.cols-3{
            grid-template-columns:repeat(3,minmax(0,1fr));
        }
        .chip-card{
            min-height:54px;
            padding:8px 8px;
            border:1px solid rgba(157,188,217,.16);
            border-radius:16px;
            background:rgba(255,255,255,.76);
            color:#6a84a0;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            gap:4px;
            text-align:center;
            font-size:11px;
            font-weight:900;
            transition:.18s ease;
            box-shadow:0 6px 14px rgba(61,104,145,.03);
        }
        .chip-card i{
            font-style:normal;
            font-size:16px;
            line-height:1;
            color:#7e98b4;
        }
        .chip-card strong{
            font-size:9px;
            line-height:1.2;
        }
        .chip-card.active{
            border-color:rgba(38,126,217,.42);
            background:linear-gradient(135deg,rgba(38,126,217,.12),rgba(255,255,255,.84));
            color:var(--primary-deep);
            box-shadow:0 10px 20px rgba(38,126,217,.08);
            transform:translateY(-1px);
        }
        .chip-card.active i{color:var(--primary)}
        .stats-grid{
            display:grid;
            grid-template-columns:repeat(3,minmax(0,1fr));
            gap:7px;
        }
        .stats-card{
            padding:10px 10px 9px;
            border:1px solid rgba(157,188,217,.16);
            border-radius:16px;
            background:rgba(255,255,255,.82);
        }
        .stats-card label{
            display:block;
            color:#8ca5bd;
            font-size:10px;
            font-weight:800;
            letter-spacing:.06em;
        }
        .stats-card strong{
            display:block;
            margin-top:6px;
            font-size:18px;
            line-height:1;
        }
        .rail-empty-hint{
            margin-top:12px;
            color:#8ca5bd;
            text-align:center;
            font-size:12px;
            line-height:1.7;
        }
        .quick-strip{
            display:grid;
            grid-template-columns:repeat(3,minmax(0,1fr));
            gap:7px;
            margin-bottom:12px;
        }
        .quick-pill{
            padding:10px 11px 9px;
            border-radius:18px;
            background:rgba(255,255,255,.78);
            border:1px solid rgba(157,188,217,.16);
        }
        .quick-pill label{
            display:block;
            color:#8ca5bd;
            font-size:10px;
            font-weight:800;
            letter-spacing:.08em;
            text-transform:uppercase;
        }
        .quick-pill strong{
            display:block;
            margin-top:4px;
            font-size:20px;
        }
        .task-rail{
            display:grid;
            gap:12px;
            max-height:clamp(300px,calc(100dvh - 360px),520px);
            overflow:auto;
            padding-right:4px;
        }
        .task-group{
            display:grid;
            gap:0;
            border:1px solid rgba(154,186,215,.16);
            border-radius:22px;
            background:rgba(255,255,255,.84);
            box-shadow:0 12px 26px rgba(61,104,145,.05);
            overflow:hidden;
            position:relative;
        }
        .task-group::before{
            content:"";
            position:absolute;
            inset:0;
            background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 24%);
            pointer-events:none;
        }
        .task-group-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            padding:11px 13px;
            background:linear-gradient(180deg,rgba(239,247,255,.84),rgba(246,250,255,.72));
            border-bottom:1px solid rgba(154,186,215,.16);
        }
        .task-group-head strong{
            color:#5a7694;
            font-size:11px;
            font-weight:900;
            letter-spacing:.08em;
            text-transform:uppercase;
        }
        .task-group-head span{
            color:#8ea5bb;
            font-size:10px;
        }
        .task-group[data-group="overdue"] .task-group-head{
            background:linear-gradient(180deg,rgba(255,240,240,.95),rgba(255,248,248,.8));
        }
        .task-group[data-group="today"] .task-group-head{
            background:linear-gradient(180deg,rgba(255,245,230,.95),rgba(255,250,241,.82));
        }
        .task-group[data-group="progress"] .task-group-head{
            background:linear-gradient(180deg,rgba(236,245,255,.96),rgba(246,250,255,.82));
        }
        .task-group[data-group="done"] .task-group-head{
            background:linear-gradient(180deg,rgba(233,249,241,.96),rgba(245,251,247,.84));
        }
        .task-group[data-group="overdue"] .task-group-head strong{color:#c64756}
        .task-group[data-group="today"] .task-group-head strong{color:#d38627}
        .task-group[data-group="progress"] .task-group-head strong{color:#2f78c8}
        .task-group[data-group="done"] .task-group-head strong{color:#2f9a66}
        .task-card{
            display:grid;
            gap:7px;
            margin:9px 9px 0;
            padding:11px 11px 10px;
            border:1px solid rgba(156,187,216,.14);
            border-radius:16px;
            background:rgba(255,255,255,.94);
            box-shadow:0 8px 16px rgba(61,104,145,.05);
            cursor:pointer;
            transition:.18s ease;
        }
        .task-card:last-of-type{margin-bottom:10px}
        .task-card:hover{background:#fff}
        .task-card.active{
            background:linear-gradient(90deg,rgba(38,126,217,.11),rgba(255,255,255,.72));
            box-shadow:inset 3px 0 0 var(--primary),0 10px 20px rgba(38,126,217,.08);
        }
        .task-card-top{
            display:flex;
            align-items:flex-start;
            gap:10px;
        }
        .pick{
            width:18px;
            height:18px;
            flex:0 0 auto;
            margin-top:2px;
            border:1px solid rgba(120,158,193,.32);
            border-radius:7px;
            background:#fff;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            color:transparent;
        }
        .pick.active{
            border-color:var(--primary);
            background:var(--primary);
            color:#fff;
        }
        .task-card strong{
            display:block;
            font-size:13px;
            line-height:1.45;
        }
        .task-card small{
            display:block;
            color:#6f8ba7;
            font-size:10px;
            line-height:1.5;
        }
        .task-meta{
            display:flex;
            flex-wrap:wrap;
            gap:6px;
        }
        .pill,.status{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-height:24px;
            padding:0 9px;
            border-radius:999px;
            font-size:10px;
            font-weight:800;
        }
        .pill{background:#edf5ff;color:#64809b}
        .status.pending{background:#eef6ff;color:#4d82b6}
        .status.in_progress{background:#fff1da;color:#cf8428}
        .status.completed{background:#e6f8ee;color:#319b6b}
        .progress{
            display:flex;
            align-items:center;
            gap:8px;
        }
        .progress-bar{
            flex:1;
            height:7px;
            border-radius:999px;
            background:rgba(111,154,189,.14);
            overflow:hidden;
        }
        .progress-fill{
            height:100%;
            background:linear-gradient(90deg,#57aaf0,#71d2bb);
        }
        .progress span{
            color:#87a0b8;
            font-size:10px;
            font-weight:800;
        }
        .canvas-head{
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:12px;
            margin-bottom:14px;
        }
        .canvas-head strong{

        .subtask-item{

        .composer-form .subtask-item .input,

        /* Modal overlay */
        .compose-overlay{
            display:none;

        }
        @keyframes composeOverlayIn{ from{opacity:0} to{opacity:1} }
        /* Modal wrapper: centered flex scroll */
        .compose-wrap{
            display:none;
            position:fixed;
            z-index:1000;
            inset:0;
            overflow-y:auto;
            overscroll-behavior:contain;
            padding:24px 18px;
        }
        .show-compose .compose-wrap{
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }

            display:none;

            max-width:1140px;

            align-items:center;
            justify-content:space-between;
            gap:8px;

            border:1px solid rgba(255,255,255,.92);

            overflow:hidden;

            top:-28px;

            height:180px;
            border-radius:50%;
            background:radial-gradient(circle, rgba(38,126,217,.05), transparent 58%);
            pointer-events:none;
        }

        .compose-close{
            flex-shrink:0;
            width:28px;
            height:28px;

            color:var(--text);
            border-color:rgba(74,144,226,.4);
        }
        .compose-banner-copy{

            position:relative;
            z-index:1;

            display:flex;
            align-items:center;
            gap:6px;
        }
        .compose-banner strong{
            display:block;
            font-size:15px;
            font-weight:900;
            color:var(--text);
            line-height:1.1;
        }
        .compose-banner span{
            color:var(--text-soft);
            font-size:9px;
            line-height:1.3;
            max-width:340px;
            opacity:.78;
        }
        .compose-card{
            max-width:1140px;
            width:100%;

            border:1px solid rgba(154,186,215,.12);

        .compose-section{

    <script src="/js/admin-session.js"></script>
    <script>
        const API = `${window.location.origin}/api`;
        const employeeToken = localStorage.getItem('employee_token') || '';
        const adminToken = window.AdminSession && window.AdminSession.getToken
            ? window.AdminSession.getToken()
            : (localStorage.getItem('token') || localStorage.getItem('adminToken') || '');
        const rawToken = adminToken || employeeToken;
        const params = new URLSearchParams(location.search);
        const categoryNames = { daily:'日常', production:'生产', quality:'质量', training:'培训', meal:'报餐', s6:'6S', other:'其他' };
        const statusNames = { pending:'待处理', in_progress:'进行中', completed:'已完成' };

        const pageRoot = document.getElementById('pageRoot');
        const composeLink = document.getElementById('composeLink');
        const viewTabs = document.getElementById('viewTabs');
        const mainCanvas = document.getElementById('mainCanvas');
        const detailShell = document.getElementById('detailShell');
        const summaryCards = document.getElementById('summaryCards');
        const sortFilter = document.getElementById('sortFilter');
        const bulkBar = document.getElementById('bulkBar');
        const bulkLabel = document.getElementById('bulkLabel');
        const selectVisibleBtn = document.getElementById('selectVisibleBtn');
        const clearSelectionBtn = document.getElementById('clearSelectionBtn');
        const clearFocusBtn = document.getElementById('clearFocusBtn');
        const summaryPending = document.getElementById('summaryPending');
        const summaryToday = document.getElementById('summaryToday');
        const summaryOverdue = document.getElementById('summaryOverdue');
        const summaryCreated = document.getElementById('summaryCreated');

        const composeForm = document.getElementById('composeForm');
        const composeTitle = document.getElementById('composeTitle');
        const composeDescription = document.getElementById('composeDescription');
        const composeCategory = document.getElementById('composeCategory');
        const composePriority = document.getElementById('composePriority');
        const composeDueAt = document.getElementById('composeDueAt');
        const composeDueAtTrigger = document.getElementById('composeDueAtTrigger');
        const composeRemindAt = document.getElementById('composeRemindAt');
        const composeRemindAtTrigger = document.getElementById('composeRemindAtTrigger');
        const composeAssignee = document.getElementById('composeAssignee');
        const composeModeToggle = document.getElementById('composeModeToggle');
        const composeModeTabs = composeModeToggle ? [...composeModeToggle.querySelectorAll('[data-mode]')] : [];
        const composeMode = document.getElementById('composeMode');
        const composeStageSurface = document.getElementById('composeStageSurface');
        const composeSubtaskCount = document.getElementById('composeSubtaskCount');
        const composeDescriptionCounter = document.getElementById('composeDescriptionCounter');
        const executorChips = document.getElementById('executorChips');
        const assignCollapseBtn = document.getElementById('assignCollapseBtn');
        const splitAssignSection = document.getElementById('splitAssignSection');
        const splitDueAt = document.getElementById('splitDueAt');
        const splitDueAtTrigger = document.getElementById('splitDueAtTrigger');
        const subtasksWrap = document.getElementById('subtasksWrap');
        const addSubtaskBtn = document.getElementById('addSubtaskBtn');
        const splitExecutorField = document.getElementById('splitExecutorField');
        const selectPop = document.getElementById('selectPop');
        const selectOptions = document.getElementById('selectOptions');
        const duePop = document.getElementById('duePop');
        const dueCalTitle = document.getElementById('dueCalTitle');
        const dueCalGrid = document.getElementById('dueCalGrid');
        const dueHourInput = document.getElementById('dueHourInput');
        const dueMinuteInput = document.getElementById('dueMinuteInput');

        const requestedView = params.get('view');
        let currentView = (requestedView === 'created' || requestedView === 'completed') ? requestedView : 'inbox';
        let currentDisplay = 'board';
        let allRows = [];
        let currentRows = [];
        let createdRowsCache = [];
        let completedRowsCache = [];
        let inboxSummary = { pending:0, due_today:0, overdue:0 };
        let assignees = [];
        let currentDueFilter = 'all';
        let currentQuickFilter = 'all';
        let selectedTaskId = null;
        let selectedTaskIds = new Set();
        let detailTask = null;
        let subtaskDrafts = [];
        let activeSelectField = null;
        let duePopOpen = false;
        let activeDueField = 'composeDueAt';
        let dueCalendarYear = new Date().getFullYear();
        let dueCalendarMonth = new Date().getMonth();
        let dueSelectedDate = '';

        function decodeToken(token){
            try{
                const body = token.split('.')[1];
                if(!body) return {};
                return JSON.parse(decodeURIComponent(atob(body.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>`%${c.charCodeAt(0).toString(16).padStart(2,'0')}`).join('')));
            }catch{
                return {};
            }
        }
        const currentUser = decodeToken(rawToken);
        const isAdminUser = currentUser.type !== 'employee';


        if(!isAdminUser){
            composeLink.classList.add('hidden');
        }

        function esc(value){
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#39;'
            }[char]));
        }
        function cleanDemoText(value){
            return String(value ?? '')
                .replace(/【界面预览-DEMO】\s*/g, '')
                .trim();
        }
        function pad2(value){
            return String(value).padStart(2, '0');
        }
        function formatDueLabel(value){
            if(!value) return '请选择截止时间';
            const [datePart = '', timePart = ''] = String(value).split('T');
            if(!datePart) return '请选择截止时间';
            return `${datePart.replace(/-/g, '.')} ${timePart.slice(0,5) || '00:00'}`;
        }
        function duePlaceholder(fieldId){
            if(fieldId === 'composeRemindAt') return '选择提醒时间';
            if(fieldId === 'splitDueAt') return '选择分派任务的截止日期';
            return '选择截止日期';
        }
        function syncDueLabel(fieldId = 'composeDueAt'){
            const input = document.getElementById(fieldId);
            const trigger = document.getElementById(`${fieldId}Trigger`);
            if(!trigger) return;
            trigger.value = input?.value ? formatDueLabel(input.value) : duePlaceholder(fieldId);
        }
        function syncComposeDueLabel(){
            syncDueLabel('composeDueAt');
        }
        function formatDateValue(year, month, day){
            return `${year}-${pad2(month + 1)}-${pad2(day)}`;
        }
        function parseDateValue(value){
            if(!value) return null;
            const [year, month, day] = String(value).split('-').map(Number);
            if(!year || !month || !day) return null;
            return new Date(year, month - 1, day);
        }
        function fillDuePop(value){
            const now = value ? new Date(String(value).replace(' ', 'T')) : new Date();
            dueSelectedDate = formatDateValue(now.getFullYear(), now.getMonth(), now.getDate());
            dueCalendarYear = now.getFullYear();
            dueCalendarMonth = now.getMonth();
            dueHourInput.value = pad2(Number.isNaN(now.getHours()) ? 9 : now.getHours());
            dueMinuteInput.value = pad2(Number.isNaN(now.getMinutes()) ? 0 : now.getMinutes());
            renderDueCalendar();
        }
        function currentDueTrigger(){
            return document.getElementById(`${activeDueField}Trigger`);
        }
        function currentDueInput(){
            return document.getElementById(activeDueField);
        }
        function positionDuePop(){
            const trigger = currentDueTrigger();
            if(!trigger || !duePop) return;
            const rect = trigger.getBoundingClientRect();
            duePop.style.left = `${Math.min(rect.left, window.innerWidth - 296)}px`;
            duePop.style.top = `${rect.bottom + 8}px`;
        }
        function moveDueCalendar(delta){
            dueCalendarMonth += delta;
            if(dueCalendarMonth < 0){
                dueCalendarMonth = 11;
                dueCalendarYear -= 1;
            }else if(dueCalendarMonth > 11){
                dueCalendarMonth = 0;
                dueCalendarYear += 1;
            }
            renderDueCalendar();
        }
        function renderDueCalendar(){
            if(!dueCalGrid || !dueCalTitle) return;
            dueCalTitle.textContent = `${dueCalendarYear}年 ${dueCalendarMonth + 1}月`;
            const firstDay = new Date(dueCalendarYear, dueCalendarMonth, 1);
            const startWeek = firstDay.getDay();
            const totalDays = new Date(dueCalendarYear, dueCalendarMonth + 1, 0).getDate();
            const cells = [];
            for(let i = 0; i < 42; i++){
                const dayNum = i - startWeek + 1;
                if(dayNum < 1 || dayNum > totalDays){
                    cells.push('<span></span>');
                    continue;
                }
                const value = formatDateValue(dueCalendarYear, dueCalendarMonth, dayNum);
                const selectedCls = value === dueSelectedDate ? ' selected' : '';
                cells.push(`<button type="button" class="calendar-day${selectedCls}" onclick="pickDueDate('${value}')">${dayNum}</button>`);
            }
            dueCalGrid.innerHTML = cells.join('');
        }
        function pickDueDate(value){
            dueSelectedDate = value;
            const parsed = parseDateValue(value);
            if(parsed){
                dueCalendarYear = parsed.getFullYear();
                dueCalendarMonth = parsed.getMonth();
            }
            renderDueCalendar();
        }
        function pickDueToday(){
            const now = new Date();
            dueSelectedDate = formatDateValue(now.getFullYear(), now.getMonth(), now.getDate());
            dueCalendarYear = now.getFullYear();
            dueCalendarMonth = now.getMonth();
            dueHourInput.value = pad2(now.getHours());
            dueMinuteInput.value = pad2(now.getMinutes());
            renderDueCalendar();
        }
        function closeDuePop(){
            duePop?.classList.remove('show');
            duePopOpen = false;
        }
        function toggleDuePop(fieldId = 'composeDueAt'){
            const trigger = document.getElementById(`${fieldId}Trigger`);
            const input = document.getElementById(fieldId);
            if(!trigger || !input || !duePop) return;
            if(duePopOpen){
                closeDuePop();
                if(activeDueField === fieldId) return;
            }
            closeSelect();
            activeDueField = fieldId;
            fillDuePop(input.value || '');
            duePop.classList.add('show');
            duePopOpen = true;
            positionDuePop();
        }
        function applySplitDueAtToDrafts(forceAll = false){
            if(!splitDueAt?.value) return;
            subtaskDrafts = subtaskDrafts.map(item => ({
                ...item,
                due_at: forceAll || !item.due_at ? splitDueAt.value : item.due_at
            }));
        }
        function commitComposeDueAt(){
            const input = currentDueInput();
            if(!input) return;
            if(!dueSelectedDate){
                input.value = '';
                syncDueLabel(activeDueField);
                closeDuePop();
                return;
            }
            const hour = Math.max(0, Math.min(23, Number(dueHourInput.value || 0)));
            const minute = Math.max(0, Math.min(59, Number(dueMinuteInput.value || 0)));
            input.value = `${dueSelectedDate}T${pad2(hour)}:${pad2(minute)}`;
            syncDueLabel(activeDueField);
            if(activeDueField === 'splitDueAt'){
                if(!composeDueAt?.value) composeDueAt.value = input.value;
                syncComposeDueLabel();
                applySplitDueAtToDrafts(false);
                renderSubtasks();
            }
            closeDuePop();
        }
        function clearComposeDueAt(){
            const input = currentDueInput();
            if(input) input.value = '';
            dueSelectedDate = '';
            syncDueLabel(activeDueField);
            closeDuePop();
        }
        function showCompose(){
            if(!isAdminUser) return;
            pageRoot.classList.add('show-compose');
            document.body.classList.add('show-compose');
            document.body.style.overflow = 'hidden';
            composeForm.reset();

            const due = new Date(String(value).replace(' ', 'T'));
            if(Number.isNaN(due.getTime())) return 'none';

                return;
            }
            if(composeMode?.value === 'split'){
                if(!subtaskDrafts.length){
                    alert('请至少添加 1 条执行项');
                    return;
                }
                const subtasks = subtaskDrafts.map(item => ({
                    title: String(item.title || '').trim(),
                    description: String(item.description || '').trim(),
                    assigned_staff_id: item.assigned_staff_id ? Number(item.assigned_staff_id) : null,
                    due_at: item.due_at || splitDueAt?.value || body.due_at || null,
                    priority: composePriority.value
                }));
                if(subtasks.some(item => !item.title || !item.assigned_staff_id)){
                    alert('每条执行项都需要填写标题和负责人');
                    return;
                }
                body.subtasks = subtasks;
            }else{
                const validSubtasks = subtaskDrafts
                    .map(item => ({
                        title: String(item.title || '').trim(),
                        description: String(item.description || '').trim(),
                        assigned_staff_id: composeAssignee.value ? Number(composeAssignee.value) : null,
                        due_at: item.due_at || splitDueAt?.value || body.due_at || null,
                        priority: composePriority.value
                    }))
                    .filter(item => item.title);
                if(validSubtasks.length){
                    if(!composeAssignee.value){
                        alert('单人执行项需要先选择上方负责人');
                        return;
                    }
                    body.subtasks = validSubtasks;
                }else{
                    body.assigned_staff_id = composeAssignee.value ? Number(composeAssignee.value) : null;
                }
            }
            try{
                const created = await api('/task', {
                    method:'POST',
                    body: JSON.stringify(body)
                });
                hideCompose();
                currentView = 'created';
                selectedTaskId = null;
                detailTask = null;
                await loadTasks();
                if(created?.id) openTask(Number(created.id));
            }catch(error){
                alert(error.message);
            }
        }
        let draggingTaskId = null;
        function handleDragStart(event, id){
            draggingTaskId = Number(id);
            event.currentTarget.classList.add('dragging');
        }
        function handleDragEnd(event){
            draggingTaskId = null;
            event.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.board-column').forEach(col => col.classList.remove('drag-over'));
        }
        function handleDragOver(event){
            event.preventDefault();
            event.currentTarget.classList.add('drag-over');
        }
        function handleDragLeave(event){
            event.currentTarget.classList.remove('drag-over');
        }
        async function handleDrop(event, status){
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');
            if(!draggingTaskId) return;
            try{
                await setTaskStatus(draggingTaskId, status);
            }catch(error){
                alert(error.message);
            }
        }
        async function init(){
            if(!rawToken){
                location.href = 'index.html';
                return;
            }
            await loadAssignees();
            await loadTasks();
            if(params.get('compose') === '1'){
                showCompose();
            }
            const focusId = Number(params.get('focus') || 0);
            if(focusId) openTask(focusId);
        }

        window.openTask = openTask;
        window.toggleSelection = toggleSelection;
        window.toggleSelect = toggleSelect;
        window.pickSelectValue = pickSelectValue;
        window.toggleDuePop = toggleDuePop;
        window.moveDueCalendar = moveDueCalendar;
        window.pickDueDate = pickDueDate;
        window.pickDueToday = pickDueToday;
        window.closeDuePop = closeDuePop;
        window.commitComposeDueAt = commitComposeDueAt;
        window.clearComposeDueAt = clearComposeDueAt;
        window.removeSubtask = removeSubtask;
        window.updateSubtask = updateSubtask;
        window.handleDragStart = handleDragStart;
        window.handleDragEnd = handleDragEnd;
        window.handleDragOver = handleDragOver;
        window.handleDragLeave = handleDragLeave;
        window.handleDrop = handleDrop;

        viewTabs?.addEventListener('click', event => {
            const button = event.target.closest('[data-view]');
            if(!button) return;
            currentView = button.dataset.view;
            currentQuickFilter = 'all';
            currentDueFilter = 'all';
            selectedTaskIds.clear();
            selectedTaskId = null;
            detailTask = null;
            renderDetail(null);
            loadTasks();
        });
        document.querySelectorAll('[data-display]').forEach(button => {
            button.addEventListener('click', () => {
                currentDisplay = button.dataset.display;
                document.querySelectorAll('[data-display]').forEach(item => item.classList.toggle('active', item === button));
                renderCanvas(currentRows);
            });
        });
        sortFilter?.addEventListener('change', renderMain);
        summaryCards?.addEventListener('click', event => {
            const card = event.target.closest('[data-summary]');
            if(!card) return;
            const key = card.dataset.summary;
            currentQuickFilter = 'all';
            selectedTaskIds.clear();
            selectedTaskId = null;
            detailTask = null;
            renderDetail(null);
            if(key === 'created'){
                currentView = 'created';
                currentDueFilter = 'all';
                loadTasks();
                return;
            }
            currentView = 'inbox';
            currentDueFilter = key === 'today' ? 'today' : key === 'overdue' ? 'overdue' : 'all';
            loadTasks();
        });
        selectVisibleBtn.addEventListener('click', selectVisible);
        clearSelectionBtn.addEventListener('click', clearSelection);
        clearFocusBtn.addEventListener('click', () => {
            selectedTaskId = null;
            detailTask = null;
            renderDetail(null);
            renderMain();
        });
        bulkBar.addEventListener('click', event => {
            const button = event.target.closest('[data-bulk-status]');
            if(!button) return;
            updateSelectedStatus(button.dataset.bulkStatus);
        });
        document.addEventListener('click', event => {
            if(activeSelectField && !event.target.closest('.select-field') && !event.target.closest('.select-pop')){
                closeSelect();
            }
            if(duePopOpen && !event.target.closest('.calendar-pop') && !event.target.closest('.date-trigger')){
                closeDuePop();
            }
            if(!event.target.closest('.ctx-menu') && !event.target.closest('.board-card')){
                hideCtxMenu();
            }
        });
        let ctxTaskId = null;
        function showCtxMenu(event, taskId){
            event.preventDefault();
            ctxTaskId = taskId;
            const menu = document.getElementById('ctxMenu');
            const x = Math.min(event.clientX, window.innerWidth - 180);
            const y = Math.min(event.clientY, window.innerHeight - 220);
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            menu.classList.add('show');
        }
        function hideCtxMenu(){
            const menu = document.getElementById('ctxMenu');
            menu.classList.remove('show');
            ctxTaskId = null;
        }
        document.addEventListener('click', async event => {
            const item = event.target.closest('.ctx-item');
            if(!item || !ctxTaskId) return;
            const action = item.dataset.action;
            hideCtxMenu();
            if(action === 'view'){
                openTask(ctxTaskId);
            }else if(action === 'split'){
                const task = allRows.find(t => Number(t.id) === ctxTaskId);
                if(!task) return alert('任务未找到');
                try{
                    const detail = await api(`/task/${ctxTaskId}`);
                    pageRoot.classList.add('show-compose');
                    document.body.classList.add('show-compose');
                    document.body.style.overflow = 'hidden';
                    composeForm.reset();
                    composeTitle.value = detail.title || task.title || '';
                    composeDescription.value = detail.description || task.description || '';
                    composeCategory.value = detail.category || task.category || 'other';
                    composePriority.value = detail.priority || task.priority || 'medium';
                    composeDueAt.value = toDatetimeLocal(detail.due_at || task.due_at) || '';
                    composeRemindAt.value = toDatetimeLocal(detail.remind_at) || '';
                    splitDueAt.value = composeDueAt.value;
                    composeMode.value = 'split';
                    subtaskDrafts = Array.isArray(detail.children) && detail.children.length
                        ? detail.children.map(item => ({
                            title: item.title || '',
                            description: item.description || '',
                            assigned_staff_id: item.assigned_staff_id ? String(item.assigned_staff_id) : '',
                            due_at: toDatetimeLocal(item.due_at) || '',
                            priority: item.priority || composePriority.value || 'medium'
                        }))
                        : [];
                    syncSplitMode();
                    syncCustomSelects();
                    syncComposeDueLabel();
                    syncDueLabel('splitDueAt');
                    syncDueLabel('composeRemindAt');
                    syncComposeDescriptionCounter();
                    renderSubtasks();
                }catch(error){
                    alert(error.message);
                }
            }else if(action === 'edit'){
                openTask(ctxTaskId);
                setTimeout(() => {
                    document.getElementById('detailEditorWrap')?.classList.add('show');
                }, 300);
            }else if(action === 'delete'){
                const task = allRows.find(t => Number(t.id) === ctxTaskId);
                if(!task) return;
                if(!confirm(`确认删除\"${task.title || '这条任务'}\"？`)) return;
                try{
                    await api(`/task/${ctxTaskId}`, { method:'DELETE' });
                    if(selectedTaskId === ctxTaskId){
                        selectedTaskId = null;
                        detailTask = null;
                        renderDetail(null);
                    }
                    await loadTasks();
                }catch(error){
                    alert(error.message);
                }
            }
        });
        window.addEventListener('resize', () => {
            closeSelect();
            if(duePopOpen) positionDuePop();
        });
        window.addEventListener('scroll', (event) => {
            if(!event.target.closest('.select-pop') && !event.target.closest('.calendar-pop')){
                closeSelect();
                closeDuePop();
            }
        }, true);
        composeMode?.addEventListener('change', () => syncSplitMode());
        addSubtaskBtn?.addEventListener('click', addSubtask);
        composeForm?.addEventListener('submit', submitCompose);
        composeDescription?.addEventListener('input', syncComposeDescriptionCounter);
        composeAssignee?.addEventListener('change', () => {
            if(composeMode?.value !== 'split'){
                ensureSingleModeSubtasksAssigned();
                renderSubtasks();
            }
        });
        composeModeToggle?.addEventListener('click', event => {
            const button = event.target.closest('[data-mode]');
            if(!button) return;
            const nextMode = composeMode?.value === button.dataset.mode ? 'single' : button.dataset.mode;
            setComposeMode(nextMode, { focus: nextMode === 'split' });
        });

        init();
    </script>
    <div class="ctx-menu" id="ctxMenu">
        <button class="ctx-item" data-action="view">📋 查看详情</button>
        <button class="ctx-item" data-action="split">🔀 拆分任务</button>
        <button class="ctx-item" data-action="edit">✏️ 编辑任务</button>
        <div class="ctx-divider"></div>
        <button class="ctx-item ctx-danger" data-action="delete">🗑 删除任务</button>
    </div>
</body>
</html>
