<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今日报餐 - 宁波兴利</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f5f5f7;
  --text: #111111;
  --sub: #8b8b8f;
  --red: #ff453a;
  --white: #ffffff;
  --line: #ececec;
  --orange: #ff9f38;
  --blue: #4c7dff;
}

body {
  min-height: 100dvh;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  color: var(--text);
  padding: max(20px, env(safe-area-inset-top)) 18px max(30px, env(safe-area-inset-bottom));
  max-width: 480px;
  margin: 0 auto;
}

/* 顶部 */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 38px;
  background: linear-gradient(160deg, #ff4a4a 0%, #ff5e57 50%, #ff7b6b 100%);
  padding: 28px;
  color: #fff;
  box-shadow: 0 20px 50px rgba(255,80,80,.22);
}

.hero::before {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  right: -100px;
  top: -80px;
}

.top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
.title-area { text-align: center; flex: 1; }
.label { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
.date-area { text-align: right; min-width: 80px; }
.date-num { font-size: 18px; font-weight: 600; }
.date-week { font-size: 13px; opacity: .8; margin-top: 2px; }

/* 员工餐 */
.staff-block {
  margin-top: 28px;
  position: relative;
  z-index: 2;
  background: rgba(0,0,0,.12);
  border-radius: 20px;
  padding: 24px;
}
.staff-label { font-size: 15px; opacity: .9; text-align: center; margin-bottom: 12px; }
.staff-row { display: flex; justify-content: center; align-items: baseline; }
.staff-num { font-size: 72px; font-weight: 800; line-height: 1; }
.staff-unit { font-size: 20px; opacity: .85; margin-left: 8px; }
.staff-detail { font-size: 13px; opacity: .75; margin-top: 12px; text-align: center; }

/* 内容 */
.content { margin-top: 22px; }

/* 客餐卡 */
.meal-card {
  background: #fff;
  border-radius: 30px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.05);
}

.meal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.meal-left { display: flex; align-items: center; gap: 12px; }

.meal-title { font-size: 22px; font-weight: 700; }
.orange-text { color: #ff9c38; }
.blue-text { color: #4d7cff; }

.meal-count { text-align: right; display: flex; align-items: baseline; justify-content: flex-end; gap: 4px; }
.meal-count .n { font-size: 42px; line-height: 1; font-weight: 800; }
.meal-count .u { font-size: 13px; color: #999; }

/* 明细 */
.list { margin-top: 8px; }
.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 50px;
  padding: 14px 0;
  border-top: 1px solid var(--line);
}
.item:first-child { border-top: none; }
.item-info { display: flex; align-items: center; gap: 16px; flex: 1; }
.item-name { font-size: 16px; font-weight: 600; }
.item-reason { font-size: 13px; color: #999; }
.item-num { font-size: 16px; font-weight: 700; color: #10B981; flex-shrink: 0; }

/* 底部 */
.footer { text-align: center; margin-top: 34px; color: #999; font-size: 13px; }

/* 实时标记 */
.live-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #10B981;
  border-radius: 50%;
  margin-right: 6px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* 加载 */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; color: #999; }
.spinner { width: 32px; height: 32px; border: 3px solid #e8e8e8; border-top-color: #ff4b4b; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 空状态 */
.empty-state { text-align: center; padding: 80px 20px; }
.empty-icon { font-size: 64px; margin-bottom: 12px; opacity: 0.5; }

/* 小屏 */
@media (max-width: 390px) {
  .hero { padding: 22px; }
  .meal-card { padding: 18px; }
  .meal-count .n { font-size: 36px; }
  .staff-num { font-size: 56px; }
  .label { font-size: 28px; }
}

/* 大屏 */
@media (min-width: 768px) {
  body { max-width: 680px; }
}

@media (min-width: 1024px) {
  body { max-width: 800px; }
}
</style>
</head>
<body>

<!-- 加载 -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <div>加载中...</div>
</div>

<!-- 空状态 -->
<div id="emptyState" class="empty-state" style="display: none;">
  <div class="empty-icon"></div>
  <div>今日暂无报餐数据</div>
</div>

<!-- 内容 -->
<div id="content" style="display: none;">

<!-- 顶部 -->
<div class="hero">
  <div class="top">
    <div style="min-width: 80px;"></div>
    <div class="title-area">
      <div class="label">今日报餐</div>
    </div>
    <div class="date-area">
      <div class="date-num" id="currentDate">5月17日</div>
      <div class="date-week" id="currentWeek">星期五</div>
    </div>
  </div>

  <div class="staff-block">
    <div class="staff-label">
      员工餐
      <span id="activityTag" style="font-size:12px;background:rgba(255,255,255,0.25);padding:2px 8px;border-radius:10px;margin-left:8px;display:none;"></span>
    </div>
    <div class="staff-row">
      <span class="staff-num" id="staffTotal">0</span>
      <span class="staff-unit">人</span>
    </div>
    <div class="staff-detail" id="staffDetail">午餐时段</div>
  </div>
</div>

<!-- 内容 -->
<div class="content">
  <div id="lunchGuestCard" class="meal-card" style="display: none;">
    <div class="meal-top">
      <div class="meal-left">
        <div class="meal-title orange-text">客餐午餐</div>
      </div>
      <div class="meal-count">
        <div class="n orange-text" id="lunchGuestCount">0</div>
        <div class="u">人</div>
      </div>
    </div>
    <div class="list" id="lunchGuestList"></div>
  </div>

  <div id="dinnerGuestCard" class="meal-card" style="display: none;">
    <div class="meal-top">
      <div class="meal-left">
        <div class="meal-title blue-text">客餐晚餐</div>
      </div>
      <div class="meal-count">
        <div class="n blue-text" id="dinnerGuestCount">0</div>
        <div class="u">人</div>
      </div>
    </div>
    <div class="list" id="dinnerGuestList"></div>
  </div>
</div>

<div class="footer">
  <span class="live-dot"></span>实时更新中
</div>

</div>

<script>
// 判断当前是午餐时段(0-12点)还是晚餐时段(12-24点)
function isLunchPeriod() {
  const hour = new Date().getHours();
  return hour >= 0 && hour < 12;
}

function initDate() {
  const now = new Date();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const week = weekdays[now.getDay()];
  document.getElementById('currentDate').textContent = `${month}月${day}日`;
  document.getElementById('currentWeek').textContent = week;
}

initDate();

async function loadData() {
  try {
    const res = await fetch('/api/meal/canteen-today');
    const data = await res.json();

    document.getElementById('loading').style.display = 'none';

    if (data.code !== 0 || !data.data) {
      document.getElementById('emptyState').style.display = '';
      return;
    }

    const s = data.data;
    const isLunch = isLunchPeriod();

    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('content').style.display = '';

    // 员工餐统计：根据时段显示对应数据
    const employeeCount = isLunch ? (s.lunch_employee || 0) : (s.dinner_employee || 0);
    document.getElementById('staffTotal').textContent = employeeCount;
    document.getElementById('staffDetail').textContent = isLunch ? '午餐时段' : '晚餐时段';

    // 显示报餐类型标签（特殊/常规）
    const tagEl = document.getElementById('activityTag');
    if (tagEl) {
      tagEl.style.display = 'none';
    }

    // 午餐客餐
    if (isLunch) {
      document.getElementById('lunchGuestCard').style.display = '';
      document.getElementById('lunchGuestCount').textContent = s.lunch_guest || 0;
      document.getElementById('lunchGuestList').innerHTML = '';

      if (s.lunch_guests && s.lunch_guests.length > 0) {
        const lunchRows = s.lunch_guests.map(g => {
          const reporter = g.employee_id ? `${g.employee_id}　${g.name}` : '-';
          const reason = g.reason || '';
          return `
            <div class="item">
              <div class="item-info">
                <span class="item-name">${reporter}</span>
                ${reason ? `<span class="item-reason">${reason}</span>` : ''}
              </div>
              <div class="item-num">${g.guest_count}人</div>
            </div>
          `;
        }).join('');
        document.getElementById('lunchGuestList').innerHTML = lunchRows;
      }
      document.getElementById('dinnerGuestCard').style.display = 'none';
    } else {
      // 晚餐客餐
      document.getElementById('dinnerGuestCard').style.display = '';
      document.getElementById('dinnerGuestCount').textContent = s.dinner_guest || 0;
      document.getElementById('dinnerGuestList').innerHTML = '';

      if (s.dinner_guests && s.dinner_guests.length > 0) {
        const dinnerRows = s.dinner_guests.map(g => {
          const reporter = g.employee_id ? `${g.employee_id}　${g.name}` : '-';
          const reason = g.reason || '';
          return `
            <div class="item">
              <div class="item-info">
                <span class="item-name">${reporter}</span>
                ${reason ? `<span class="item-reason">${reason}</span>` : ''}
              </div>
              <div class="item-num">${g.guest_count}人</div>
            </div>
          `;
        }).join('');
        document.getElementById('dinnerGuestList').innerHTML = dinnerRows;
      }
      document.getElementById('lunchGuestCard').style.display = 'none';
    }

  } catch (err) {
    console.error('加载失败:', err);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('emptyState').style.display = '';
  }
}

// 初始加载
loadData();

// SSE 实时推送
var es = new EventSource('/api/meal/canteen-stream');

es.addEventListener('update', function(e) {
  // 数据更新，重新加载完整数据
  loadData();
});

es.addEventListener('connected', function(e) {
  console.log('实时连接已建立');
});

es.onerror = function(e) {
  console.log('SSE 连接断开，将在3秒后重连');
  setTimeout(function() {
    es = new EventSource('/api/meal/canteen-stream');
  }, 3000);
};
</script>

    <script src="/js/projector-mode.js"></script>
</body>
</html>
