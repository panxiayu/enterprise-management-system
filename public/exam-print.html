<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考试结果单</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #e8e5df;
    font-family: 'Noto Serif SC', 'SimSun', 'STSong', '宋体', serif;
    color: #1a1a1a;
  }

  .preview-wrap {
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 100vh;
  }
  .preview-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border-radius: 8px;
    padding: 10px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
    font-size: 13px;
    color: #555;
    width: 100%;
    max-width: 1100px;
  }
  .btn-print {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 18px;
    font-size: 13px;
    font-family: inherit;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn-print:hover { background: #333; }
  .btn-close {
    padding: 7px 14px;
    font-size: 13px;
    font-family: inherit;
    background: #fff;
    color: #333;
    border: 1px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
  }

  .a3-sheet {
    width: 420mm;
    height: 297mm;
    background: #fff;
    display: grid;
    grid-template-columns: 1fr 1fr;
    box-shadow: 0 4px 24px rgba(0,0,0,.18);
  }

  .page {
    padding: 8mm 10mm 6mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px dashed #ccc;
  }
  .page:last-child { border-right: none; }

  .left-header {
    position: relative;
    text-align: center;
    padding-bottom: 5mm;
    margin-bottom: 4mm;
    margin-top: 5mm;
    border-bottom: 1.2pt solid #1a1a1a;
  }
  .header-logo {
    position: absolute;
    left: -1mm;
    top: -5mm;
    height: 10mm;
    width: auto;
  }
  .exam-subject {
    display: flex;
    justify-content: center;
    align-items: baseline;
    font-size: 18pt;
    font-weight: 700;
    letter-spacing: .22em;
    line-height: 1.2;
    margin-bottom: 2mm;
    text-align: center;
    margin-right: -4em;
  }
  .eval-tag {
    font-size: 14pt;
    color: #666;
  }

  .right-header {
    padding-bottom: 5mm;
    margin-bottom: 4mm;
    border-bottom: 1.2pt solid #1a1a1a;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
  }
  .cont-label { font-size: 9pt; color: #999; letter-spacing: .06em; }

  .info-row {
    display: flex;
    align-items: baseline;
    padding-bottom: 3mm;
    margin-bottom: 4mm;
  }
  .info-cell {
    display: flex;
    align-items: baseline;
    gap: 2mm;
    font-size: 10pt;
    white-space: nowrap;
    padding: 0 5mm;
  }
  .info-cell:first-child { padding-left: 0; }
  .info-cell:last-child { padding-right: 0; margin-left: auto; }
  .info-lbl { color: #666; }
  .info-val {
    font-weight: 600;
    text-align: center;
    border-bottom: .5pt solid #ccc;
    padding-bottom: .5mm;
  }
  .info-val.short {
    min-width: 18mm;
  }
  #totalScore {
    min-width: 15mm;
    display: inline-block;
    border-bottom: .5pt solid #ccc;
    font-size: 12pt;
    font-weight: 700;
  }
  #submittedAt {
    min-width: 35mm;
    display: inline-block;
    border-bottom: .5pt solid #ccc;
  }

  .sec-head {
    font-size: 9pt;
    font-weight: 700;
    letter-spacing: .12em;
    color: #1a1a1a;
    margin: 3mm 0 2mm;
    display: flex;
    align-items: center;
    gap: 4mm;
  }
  .sec-head::after { content: ''; flex: 1; height: .5pt; background: #e8e5df; }

  .q-list { display: flex; flex-direction: column; }
  .q-row {
    display: flex;
    align-items: flex-start;
    padding: 1.5mm 0;
    border-bottom: .5pt solid #f0ede8;
    gap: 2.5mm;
  }
  .q-row:last-child { border-bottom: none; }

  .q-no { font-size: 9pt; color: #1a1a1a; min-width: 7mm; text-align: right; padding-top: .5mm; flex-shrink: 0; font-weight: 500; }
  .q-content { flex: 1; min-width: 0; }
  .q-text { font-size: 9pt; color: #1a1a1a; line-height: 1.4; margin-bottom: 1mm; max-width: 165mm; word-wrap: break-word; }
  .q-ans-line { display: flex; align-items: center; gap: 2mm; }
  .ans-tag { font-size: 9pt; color: #1a1a1a; }
  .ans-tag::after { content: '：'; }
  .ans-text { font-size: 9pt; font-weight: 600; color: #1a1a1a; }

  .blank { border-bottom: .8pt solid #1a1a1a; padding: 0 1mm; font-weight: 600; color: #1a1a1a; }
  .wrong .blank { color: #c0392b; border-color: #c0392b; }

  .q-opts {
    margin-top: 1mm;
    font-size: 9pt;
    color: #1a1a1a;
  }
  .q-opt {
    display: inline-block;
    margin-right: 6mm;
    margin-bottom: .5mm;
  }
  .opt-label { font-weight: 600; color: #1a1a1a; }

  .x-mark {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    margin-left: auto;
  }
  .x-mark svg { width: 10px; height: 10px; }

  .page-foot {
    margin-top: auto;
    padding-top: 2.5mm;
    border-top: .5pt solid #e8e5df;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 9pt;
    color: #666;
  }
  .sign-line { display: flex; align-items: center; gap: 2mm; }
  .sign-underline { display: inline-block; width: 20mm; border-bottom: .5pt solid #ccc; }

  .loading, .error {
    text-align: center;
    padding: 80px 20px;
    font-size: 16px;
  }
  .error { color: #c0392b; }

  @media print {
    @page {
      size: A3 landscape;
      margin: 0;
    }

    body { background: #fff; }

    .preview-wrap { padding: 0; background: none; }
    .preview-toolbar { display: none !important; }

    .a3-sheet {
      width: 420mm;
      height: 297mm;
      box-shadow: none;
    }

    * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<div class="preview-wrap">
  <div class="preview-toolbar">
    <span>A3 横向 (420×297mm) · 考试结果单</span>
    <button class="btn-print" onclick="window.print()">打印 / 导出 PDF</button>
    <button class="btn-close" onclick="window.close()">关闭</button>
  </div>

  <div class="loading" id="loading">加载中...</div>
  <div class="error" id="error" style="display:none;"></div>

  <div class="a3-sheet" id="content" style="display:none;">

    <div class="page">
      <div class="left-header">
        <img src="/images/company-logo.jpg" alt="logo" class="header-logo">
        <div class="exam-subject">
          <span id="examTitle">考试试卷</span><span class="eval-tag">（评估）</span>
        </div>
      </div>

      <div class="info-row">
        <div class="info-cell"><span class="info-lbl">姓名 </span><span class="info-val short" id="staffName">-</span></div>
        <div class="info-cell"><span class="info-lbl">工号 </span><span class="info-val short" id="employeeId">-</span></div>
        <div class="info-cell"><span class="info-lbl">提交时间 </span><span class="info-val" id="submittedAt">-</span></div>
        <div class="info-cell"><span class="info-lbl">得分 </span><span class="info-val" id="totalScore">0</span></div>
      </div>

      <div class="q-list" id="leftQuestions"></div>

      <div class="page-foot">
        <span>第 1 页</span>
              </div>
    </div>

    <div class="page">
      <div class="right-header"></div>

      <div class="q-list" id="rightQuestions"></div>

      <div class="page-foot">
        <span>第 2 页</span>
        <span>打印时间：<span id="printTime"></span></span>
      </div>
    </div>

  </div>
</div>

<script src="/js/admin-session.js"></script>
<script>
const API = window.location.origin + '/api';
const token = window.AdminSession && window.AdminSession.requireValid
  ? window.AdminSession.requireValid()
  : (localStorage.getItem('token') || localStorage.getItem('adminToken') || '');

function getRecordId() { return new URLSearchParams(window.location.search).get('id'); }

function formatDate(str) {
  if (!str) return '-';
  const d = new Date(str);
  return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function formatAnswer(type, answer) {
  if (!answer) return '';
  if (type === 'multiple_choice') return answer.split(',').map(a => a.trim()).join('、');
  if (type === 'true_false') return (answer === '√' || answer === 'T' || answer === '1') ? '√' : '×';
  return answer;
}

async function loadExamPrint() {
  const recordId = getRecordId();
  if (!recordId) return showError('缺少试卷ID参数');
  if (!token) return showError('请先登录');

  try {
    const res = await fetch(`${API}/exam/admin/${recordId}/print`, { headers: { 'Authorization': `Bearer ${token}` } });
    const data = await res.json();
    if (data.code !== 0) return showError(data.msg || '加载失败');
    renderExamPaper(data.data);
  } catch (err) { showError('加载失败'); }
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = '';
  document.getElementById('error').textContent = msg;
}

function renderQuestion(q, num) {
  const userAnswer = formatAnswer(q.type, q.userAnswer);
  const isCorrect = q.isCorrect;
  const isEmpty = !q.userAnswer;
  const wrongClass = '';

  let optsHtml = '';
  let ansHtml = '';

  if (q.type === 'single_choice' || q.type === 'multiple_choice') {
    if (q.options && q.options.length > 0) {
      optsHtml = '<div class="q-opts">';
      q.options.forEach((opt, i) => {
        const label = String.fromCharCode(65 + i);
        optsHtml += `<span class="q-opt"><span class="opt-label">${label}.</span>${opt}</span>`;
      });
      optsHtml += '</div>';
    }
    const answerText = userAnswer || '(未作答)';
    ansHtml = `<span class="ans-tag">答</span><span class="ans-text">${answerText}</span>`;

  } else if (q.type === 'true_false') {
    const answerText = (userAnswer === '√' || userAnswer === 'T' || userAnswer === '1') ? '正确' : '错误';
    ansHtml = `<span class="ans-tag">答</span><span class="ans-text">${answerText}</span>`;

  } else {
    const answerText = userAnswer || '(未作答)';
    ansHtml = `<span class="ans-tag">答</span><span class="ans-text">${answerText}</span>`;
  }

  const xMarkSvg = `<svg viewBox="0 0 14 14" fill="none"><line x1="2" y1="2" x2="12" y2="12" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="2" x2="2" y2="12" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  const xMarkHtml = !isCorrect ? `<span class="x-mark">${xMarkSvg}</span>` : '';

  return `<div class="q-row ${wrongClass}">
    <span class="q-no">${num}.</span>
    <div class="q-content">
      <div class="q-text">${q.content}</div>
      ${optsHtml}
      <div class="q-ans-line">${ansHtml}${xMarkHtml}</div>
    </div>
  </div>`;
}

function renderExamPaper(exam) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = '';

  document.getElementById('examTitle').textContent = exam.examTitle || '考试试卷';
  document.getElementById('staffName').textContent = exam.staffName || '-';
  document.getElementById('employeeId').textContent = exam.employeeId || '-';
  document.getElementById('submittedAt').textContent = formatDate(exam.submittedAt);

  const qs = exam.questions || [];
  const totalQ = qs.length;

  document.getElementById('totalScore').textContent = exam.totalScore ?? 0;
  document.getElementById('printTime').textContent = formatDate(new Date().toISOString());

  // 统计各类型
  const singleQs = qs.filter(q => q.type === 'single_choice');
  const multiQs = qs.filter(q => q.type === 'multiple_choice');
  const tfQs = qs.filter(q => q.type === 'true_false');

  // 按类型分组
  const sections = [];
  let num = 1;

  if (tfQs.length > 0) {
    sections.push({ label: '判断题', qs: tfQs, startNum: num });
    num += tfQs.length;
  }
  if (singleQs.length > 0) {
    sections.push({ label: '单选题', qs: singleQs, startNum: num });
    num += singleQs.length;
  }
  if (multiQs.length > 0) {
    sections.push({ label: '多选题', qs: multiQs, startNum: num });
    num += multiQs.length;
  }
  const otherQs = qs.filter(q => !['single_choice', 'multiple_choice', 'true_false'].includes(q.type));
  if (otherQs.length > 0) {
    sections.push({ label: '其他', qs: otherQs, startNum: num });
  }

  // 左侧优先，尽量填满
  const LEFT_COUNT = Math.floor(totalQ * 0.56); // 左侧约56%，让第15题到右侧
  const leftCount = Math.min(LEFT_COUNT, totalQ);

  let leftHtml = '';
  let rightHtml = '';
  let leftUsed = 0;
  let currentRightSection = '';

  sections.forEach(section => {
    let sectionHasLeft = false;
    let sectionHasRight = false;

    for (let i = 0; i < section.qs.length; i++) {
      if (leftUsed < leftCount) {
        sectionHasLeft = true;
      } else {
        sectionHasRight = true;
      }
    }

    for (let i = 0; i < section.qs.length; i++) {
      const q = section.qs[i];
      const num = section.startNum + i;

      if (leftUsed < leftCount) {
        // 左侧
        if (i === 0) {
          leftHtml += `<div class="sec-head">${section.label}${sectionHasRight ? '（续）' : ''}</div>`;
        }
        leftHtml += renderQuestion(q, num);
        leftUsed++;
      } else {
        // 右侧，不显示section标题
        rightHtml += renderQuestion(q, num);
      }
    }
  });

  document.getElementById('leftQuestions').innerHTML = leftHtml;
  document.getElementById('rightQuestions').innerHTML = rightHtml;
}

loadExamPrint();
</script>
    <script src="/js/projector-mode.js"></script>
</body>
</html>
