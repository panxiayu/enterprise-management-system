<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>工服管理</title>
  <link rel="stylesheet" href="css/mobile-theme.css">
  <style>
    :root{
      --bg:#eef6ff;
      --card:#ffffff;
      --line:#d9e9ff;
      --soft:#7087b0;
      --text:#1d2b5a;
      --primary:#4a90e2;
      --good:#1f9f63;
      --warn:#eb6e4c;
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(102,181,255,.18), transparent 28%),
        linear-gradient(180deg,#f4f9ff 0%,#eef5ff 100%);
    }
    .page{max-width:780px;margin:0 auto;padding:14px 12px 28px}
    .hero,.toolbar,.summary,.type-filter,.item-card,.review-card,.empty{
      background:rgba(255,255,255,.97);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:0 14px 38px rgba(74,144,226,.08);
    }
    .hero,.toolbar,.summary,.type-filter,.review-card{padding:14px}
    .hero{margin-bottom:12px}
    .hero-top,.toolbar-row,.summary-grid,.item-top,.item-meta,.item-actions,.review-actions{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .hero-top,.toolbar-row,.item-top{justify-content:space-between}
    .title{font-size:22px;font-weight:800;line-height:1.2}
    .subtitle{margin-top:5px;font-size:12px;color:var(--soft);line-height:1.5}
    .btn{
      border:none;
      border-radius:14px;
      height:38px;
      padding:0 13px;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }
    .btn-primary{background:linear-gradient(135deg,#4a90e2,#66b5ff);color:#fff}
    .btn-ghost{background:#f2f8ff;color:var(--primary)}
    .btn-warn{background:#fff1ec;color:var(--warn)}
    .btn-good{background:#ecfbf3;color:var(--good)}
    .toolbar{margin-bottom:12px}
    .month-select{
      min-width:148px;
      height:38px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      padding:0 12px;
      font-size:13px;
      font-weight:700;
      color:var(--text);
      outline:none;
    }
    .status-chip{
      display:inline-flex;
      align-items:center;
      padding:7px 11px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      background:#edf6ff;
      color:var(--primary);
    }
    .summary{margin-bottom:12px}
    .summary-grid{
      flex-wrap:wrap;
      justify-content:space-between;
    }
    .summary-box{
      flex:1 1 112px;
      min-width:112px;
      padding:11px 12px;
      border-radius:15px;
      background:#f7fbff;
      border:1px solid #e1efff;
    }
    .summary-label{font-size:12px;color:var(--soft);margin-bottom:6px}
    .summary-value{font-size:20px;font-weight:800}
    .type-filter{margin-bottom:12px}
    .section-title{
      font-size:14px;
      font-weight:800;
      color:var(--text);
      margin-bottom:10px;
    }
    .filter-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:8px;
    }
    .filter-chip{
      min-width:0;
      padding:10px 8px;
      border:1px solid #d9e9ff;
      border-radius:14px;
      background:#fff;
      color:var(--soft);
      font-size:12px;
      font-weight:800;
      text-align:center;
      line-height:1.35;
      cursor:pointer;
      transition:all .18s ease;
    }
    .filter-chip strong{
      display:block;
      margin-top:3px;
      font-size:11px;
      color:inherit;
      opacity:.9;
    }
    .filter-chip.is-active{
      background:linear-gradient(135deg,#4a90e2,#66b5ff);
      border-color:transparent;
      color:#fff;
      box-shadow:0 10px 22px rgba(74,144,226,.22);
    }
    .list{display:grid;gap:12px}
    .item-card{padding:12px}
    .item-title{font-size:17px;font-weight:800}
    .item-badge{
      min-width:68px;
      text-align:center;
      padding:7px 9px;
      border-radius:13px;
      background:#edf6ff;
      color:var(--primary);
      font-size:11px;
      font-weight:800;
    }
    .item-meta{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
      margin:10px 0 12px;
    }
    .meta-chip{
      min-width:0;
      padding:8px 10px;
      border:1px solid #e3efff;
      border-radius:14px;
      background:#f8fbff;
      text-align:center;
      color:var(--soft);
      font-size:11px;
      line-height:1.45;
    }
    .meta-chip strong{
      display:block;
      margin-top:2px;
      color:var(--text);
      font-size:17px;
    }
    .meta-chip strong.is-warn{color:var(--warn)}
    .location-grid{
      display:grid;
      gap:10px;
      margin-bottom:12px;
    }
    .location-row{
      display:grid;
      grid-template-columns:88px minmax(0,1fr);
      gap:10px;
      align-items:start;
      padding:10px;
      border:1px solid #e3efff;
      border-radius:16px;
      background:#fbfdff;
    }
    .location-name{
      padding-top:4px;
      font-size:12px;
      font-weight:700;
      color:var(--soft);
    }
    .location-main{
      display:grid;
      gap:8px;
      min-width:0;
    }
    .qty-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto auto;
      gap:8px;
      align-items:center;
    }
    .qty-input,.remark-input{
      width:100%;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      color:var(--text);
      outline:none;
      font-size:15px;
    }
    .qty-input{
      height:38px;
      padding:0 12px;
      text-align:center;
      font-weight:800;
    }
    .qty-step{
      width:34px;
      height:34px;
      border:none;
      border-radius:10px;
      background:#edf5ff;
      color:var(--primary);
      font-size:18px;
      font-weight:800;
      cursor:pointer;
    }
    .qty-step:disabled{opacity:.45;cursor:not-allowed}
    .qty-presets{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:6px;
    }
    .qty-preset{
      height:30px;
      border:1px solid #d9e9ff;
      border-radius:10px;
      background:#fff;
      color:var(--soft);
      font-size:11px;
      font-weight:800;
      cursor:pointer;
    }
    .qty-preset:disabled{opacity:.45;cursor:not-allowed}
    .remark-input{
      min-height:72px;
      padding:11px 13px;
      resize:vertical;
      line-height:1.6;
      font-size:13px;
    }
    .item-actions{
      flex-wrap:wrap;
      justify-content:flex-end;
      margin-top:10px;
    }
    .status-text{
      margin-right:auto;
      font-size:12px;
      font-weight:800;
      color:var(--soft);
    }
    .status-text.warn{color:var(--warn)}
    .status-text.good{color:var(--good)}
    .review-section{margin-top:16px;display:grid;gap:10px}
    .review-title{font-size:18px;font-weight:800;margin:4px 0 8px}
    .review-card{padding:14px}
    .review-meta{color:var(--soft);font-size:12px;line-height:1.7;margin:8px 0}
    .review-actions{justify-content:flex-end;flex-wrap:wrap}
    .review-input{
      width:100%;
      min-height:64px;
      margin-top:8px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      font-size:14px;
      color:var(--text);
      resize:vertical;
      outline:none;
    }
    .footer-actions{
      display:flex;
      justify-content:flex-end;
      margin-top:14px;
    }
    .empty{padding:18px;text-align:center;color:var(--soft);font-size:13px}
    .hidden{display:none !important}
    @media (max-width:640px){
      .hero-top,.toolbar-row{flex-direction:column;align-items:stretch}
      .summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .item-top{align-items:flex-start}
      .item-meta{grid-template-columns:repeat(3,minmax(0,1fr))}
      .location-row{grid-template-columns:1fr;gap:8px}
      .location-name{padding-top:0}
      .qty-row{grid-template-columns:minmax(0,1fr) 34px 34px}
      .item-actions{display:grid;grid-template-columns:1fr 1fr;align-items:center}
      .status-text{grid-column:1 / -1}
    }
    @media (max-width:420px){
      .page{padding:12px 10px 24px}
      .hero-top,.toolbar-row{flex-direction:column;align-items:stretch}
      .item-meta{grid-template-columns:1fr}
      .qty-presets{grid-template-columns:repeat(5,minmax(0,1fr))}
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <div class="hero-top">
        <div>
          <div class="title">工服管理</div>
          <div class="subtitle">逐项完成结转盘存确认，全部确认后才生成下个月结转盘存数据</div>
        </div>
        <div class="item-actions">
          <button class="btn btn-primary" type="button" onclick="location.href='mobile-workwear-query.html'">切换到工服查询</button>
          <button class="btn btn-ghost" type="button" onclick="location.href='employee.html'">员工首页</button>
        </div>
      </div>
    </section>

    <section class="toolbar">
      <div class="toolbar-row">
        <div class="item-actions" style="justify-content:flex-start">
          <select class="month-select" id="monthSelect"></select>
          <span class="status-chip" id="sessionStatus">盘点中</span>
        </div>
        <div class="item-actions">
          <button class="btn btn-primary" type="button" id="completeBtn">完成本月结转</button>
        </div>
      </div>
    </section>

    <section class="summary">
      <div class="summary-grid" id="summaryGrid">
        <div class="summary-box"><div class="summary-label">状态</div><div class="summary-value">-</div></div>
      </div>
    </section>

    <section class="type-filter">
      <div class="section-title">快捷选择工服类型</div>
      <div class="filter-grid" id="typeFilterGrid"></div>
    </section>

    <section class="list" id="itemList">
      <div class="empty">正在加载盘点清单...</div>
    </section>

    <section class="review-section hidden" id="reviewSection">
      <div class="review-title">待我审核的差异项</div>
      <div id="reviewList"></div>
    </section>
  </div>

  <script src="/js/employee-session.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/module-access.js"></script>
  <script>
    const API = window.location.origin + '/api';
    let currentPayload = null;
    let reviewTasks = [];
    let currentTypeFilter = '全部';

    function authHeaders() {
      return {
        Authorization: 'Bearer ' + localStorage.getItem('employee_token'),
        'Content-Type': 'application/json'
      };
    }

    async function request(path, options = {}) {
      const response = await fetch(API + path, {
        ...options,
        headers: {
          Authorization: 'Bearer ' + localStorage.getItem('employee_token'),
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
          ...(options.headers || {})
        }
      });
      const data = await response.json();
      if (!response.ok || data.code !== 0) {
        throw new Error(data.msg || '操作失败');
      }
      return data.data;
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getInput(itemId, locationCode) {
      return document.querySelector(`[data-item-id="${itemId}"][data-location-code="${locationCode}"]`);
    }

    function setItemLocationQty(itemId, locationCode, quantity) {
      const input = getInput(itemId, locationCode);
      if (!input || input.disabled) return;
      input.value = Math.max(0, Number(quantity) || 0);
      updateItemCardTotals(itemId);
    }

    function adjustItemLocationQty(itemId, locationCode, delta) {
      const input = getInput(itemId, locationCode);
      if (!input || input.disabled) return;
      const next = Math.max(0, (Number(input.value) || 0) + delta);
      input.value = next;
      updateItemCardTotals(itemId);
    }

    function updateItemCardTotals(itemId) {
      const card = document.querySelector(`[data-count-card="${itemId}"]`);
      if (!card) return;
      const inputs = Array.from(card.querySelectorAll('[data-location-code]'));
      const total = inputs.reduce((sum, input) => sum + (Number(input.value) || 0), 0);
      const system = Number(card.dataset.systemQty || 0);
      const diff = total - system;
      const totalEl = card.querySelector('[data-role="manual-total"]');
      const diffEl = card.querySelector('[data-role="difference"]');
      if (totalEl) totalEl.textContent = String(total);
      if (diffEl) {
        diffEl.textContent = `${diff > 0 ? '+' : ''}${diff}`;
        diffEl.classList.toggle('is-warn', diff !== 0);
      }
    }

    function statusText(status) {
      return ({
        draft: '待录入',
        rejected: '已驳回',
        pending_manager_review: '待主管审核',
        confirmed: '已确认'
      })[status] || '盘点中';
    }

    function sessionStatusText(status) {
      return ({
        counting: '盘点中',
        pending_review: '待审核',
        completed: '已完成'
      })[status] || '盘点中';
    }

    function getItemFilterType(item) {
      const category = String(item.category || '');
      const itemType = String(item.item_type || '');
      const itemName = String(item.item_name || '');
      const text = `${category} ${itemType} ${itemName}`;
      if (text.includes('鞋')) return '劳保鞋';
      if (text.includes('冬')) return '冬装';
      if (text.includes('夏')) return '夏装';
      return '其他';
    }

    function renderTypeFilters(payload) {
      const items = Array.isArray(payload?.items) ? payload.items : [];
      const counts = { 全部: items.length, 夏装: 0, 冬装: 0, 劳保鞋: 0, 其他: 0 };
      items.forEach((item) => {
        const type = getItemFilterType(item);
        counts[type] = (counts[type] || 0) + 1;
      });
      if (!Object.prototype.hasOwnProperty.call(counts, currentTypeFilter)) {
        currentTypeFilter = '全部';
      }
      document.getElementById('typeFilterGrid').innerHTML = ['全部', '夏装', '冬装', '劳保鞋', '其他'].map((type) => `
        <button class="filter-chip ${currentTypeFilter === type ? 'is-active' : ''}" type="button" onclick="setTypeFilter('${type}')">
          ${escapeHtml(type)}
          <strong>${Number(counts[type] || 0)} 项</strong>
        </button>
      `).join('');
    }

    function setTypeFilter(type) {
      currentTypeFilter = type || '全部';
      if (!currentPayload) return;
      renderTypeFilters(currentPayload);
      renderItems(currentPayload);
    }

    function buildMonthSelect(payload) {
      const select = document.getElementById('monthSelect');
      select.innerHTML = (payload.available_months || []).map((month) => `
        <option value="${escapeHtml(month)}"${month === payload.session.closing_month ? ' selected' : ''}>${escapeHtml(month)} 盘点</option>
      `).join('');
      select.onchange = () => loadSession(select.value);
    }

    function renderSummary(payload) {
      const totals = payload.totals || {};
      document.getElementById('sessionStatus').textContent = sessionStatusText(payload.session.status);
      document.getElementById('summaryGrid').innerHTML = [
        ['盘点月份', payload.session.closing_month || '-'],
        ['下月期初', payload.session.opening_month || '-'],
        ['总项目数', totals.total || 0],
        ['已确认', totals.confirmed || 0],
        ['待审核', totals.pending_review || 0],
        ['已驳回', totals.rejected || 0]
      ].map(([label, value]) => `
        <div class="summary-box">
          <div class="summary-label">${escapeHtml(label)}</div>
          <div class="summary-value">${escapeHtml(value)}</div>
        </div>
      `).join('');
      document.getElementById('completeBtn').disabled = Number(totals.total || 0) === 0 || Number(totals.confirmed || 0) !== Number(totals.total || 0);
    }

    function readItemValues(itemId) {
      const inputs = Array.from(document.querySelectorAll(`[data-item-id="${itemId}"][data-location-code]`));
      const locations = inputs.map((input) => ({
        code: input.dataset.locationCode,
        quantity: Number(String(input.value || '').replace(/[^\d]/g, '')) || 0
      }));
      const remark = document.getElementById(`remark-${itemId}`)?.value?.trim() || '';
      return { locations, remark };
    }

    async function persistItem(itemId) {
      const payload = readItemValues(itemId);
      await request(`/workwear/inventory-count/items/${itemId}`, {
        method: 'PUT',
        body: JSON.stringify(payload)
      });
    }

    async function handleSave(itemId) {
      try {
        await persistItem(itemId);
        await refreshCurrentSession();
      } catch (err) {
        alert(err.message || '保存失败');
      }
    }

    async function handleConfirm(itemId) {
      try {
        await persistItem(itemId);
        await request(`/workwear/inventory-count/items/${itemId}/confirm`, { method: 'POST' });
        await refreshCurrentSession();
      } catch (err) {
        alert(err.message || '确认失败');
      }
    }

    async function handleSubmitReview(itemId) {
      try {
        const payload = readItemValues(itemId);
        if (!payload.remark) {
          alert('存在差异时必须填写备注');
          return;
        }
        await request(`/workwear/inventory-count/items/${itemId}`, {
          method: 'PUT',
          body: JSON.stringify(payload)
        });
        await request(`/workwear/inventory-count/items/${itemId}/submit-review`, {
          method: 'POST',
          body: JSON.stringify({ remark: payload.remark })
        });
        await refreshCurrentSession();
      } catch (err) {
        alert(err.message || '提交审核失败');
      }
    }

    function renderItems(payload) {
      const wrap = document.getElementById('itemList');
      const completed = payload.session.status === 'completed';
      const sourceItems = Array.isArray(payload.items) ? payload.items : [];
      const visibleItems = currentTypeFilter === '全部'
        ? sourceItems
        : sourceItems.filter((item) => getItemFilterType(item) === currentTypeFilter);
      if (!visibleItems.length) {
        wrap.innerHTML = '<div class="empty">当前月份暂无可盘点项目</div>';
        return;
      }
      wrap.innerHTML = visibleItems.map((item, index) => {
        const diff = Number(item.difference_qty || 0);
        const canDirectConfirm = diff === 0 && item.status !== 'confirmed';
        const needsReview = diff !== 0 && item.status !== 'confirmed';
        const statusClass = item.status === 'confirmed' ? 'good' : (item.status === 'pending_manager_review' || item.status === 'rejected' ? 'warn' : '');
        const filterType = getItemFilterType(item);
        return `
          <article class="item-card" data-count-card="${item.count_item_id}" data-system-qty="${Number(item.system_closing_qty || 0)}">
            <div class="item-top">
              <div class="item-title">${index + 1}. ${escapeHtml(item.item_name)}</div>
              <div class="item-badge">${escapeHtml(filterType)} · ${escapeHtml(statusText(item.status))}</div>
            </div>
            <div class="item-meta">
              <div class="meta-chip">结存数量<strong>${Number(item.system_closing_qty || 0)}</strong>${escapeHtml(item.unit || '')}</div>
              <div class="meta-chip">盘点合计<strong data-role="manual-total">${Number(item.manual_total_qty || 0)}</strong>${escapeHtml(item.unit || '')}</div>
              <div class="meta-chip">差异<strong data-role="difference" class="${diff === 0 ? '' : 'is-warn'}">${diff > 0 ? '+' : ''}${diff}</strong></div>
            </div>
            <div class="location-grid">
              ${(item.locations || []).map((location) => `
                <div class="location-row">
                  <div class="location-name">${escapeHtml(location.name)}</div>
                  <div class="location-main">
                    <div class="qty-row">
                      <input
                        class="qty-input"
                        type="number"
                        min="0"
                        step="1"
                        value="${Number(location.quantity || 0)}"
                        data-item-id="${item.count_item_id}"
                        data-location-code="${escapeHtml(location.code)}"
                        oninput="updateItemCardTotals(${item.count_item_id})"
                        ${completed ? 'disabled' : ''}
                      >
                      <button class="qty-step" type="button" onclick="adjustItemLocationQty(${item.count_item_id}, '${escapeHtml(location.code)}', -1)" ${completed ? 'disabled' : ''}>-</button>
                      <button class="qty-step" type="button" onclick="adjustItemLocationQty(${item.count_item_id}, '${escapeHtml(location.code)}', 1)" ${completed ? 'disabled' : ''}>+</button>
                    </div>
                    <div class="qty-presets">
                      ${[0,1,2,3].map((qty) => `
                        <button class="qty-preset" type="button" onclick="setItemLocationQty(${item.count_item_id}, '${escapeHtml(location.code)}', ${qty})" ${completed ? 'disabled' : ''}>${qty}</button>
                      `).join('')}
                      <button class="qty-preset" type="button" onclick="setItemLocationQty(${item.count_item_id}, '${escapeHtml(location.code)}', 5)" ${completed ? 'disabled' : ''}>5</button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
            <textarea class="remark-input" id="remark-${item.count_item_id}" placeholder="有差异时必须填写备注，说明盘点原因或差异情况" ${completed ? 'disabled' : ''}>${escapeHtml(item.remark || '')}</textarea>
            ${item.review_comment ? `<div class="item-meta">审核意见：${escapeHtml(item.review_comment)}</div>` : ''}
            ${item.approver_name ? `<div class="item-meta">审核人：${escapeHtml(item.approver_name)}</div>` : ''}
            <div class="item-actions">
              <span class="status-text ${statusClass}">${escapeHtml(statusText(item.status))}${item.confirmed_at ? ` · ${escapeHtml(item.confirmed_at)}` : ''}</span>
              ${completed ? '' : `<button class="btn btn-ghost" type="button" onclick="handleSave(${item.count_item_id})">保存</button>`}
              ${completed || !canDirectConfirm ? '' : `<button class="btn btn-good" type="button" onclick="handleConfirm(${item.count_item_id})">确认</button>`}
              ${completed || !needsReview ? '' : `<button class="btn btn-warn" type="button" onclick="handleSubmitReview(${item.count_item_id})">提交主管审核</button>`}
            </div>
          </article>
        `;
      }).join('');
    }

    function renderReviewTasks(rows) {
      const section = document.getElementById('reviewSection');
      const wrap = document.getElementById('reviewList');
      if (!rows.length) {
        section.classList.add('hidden');
        wrap.innerHTML = '';
        return;
      }
      section.classList.remove('hidden');
      wrap.innerHTML = rows.map((row) => `
        <div class="review-card">
          <div class="item-top">
            <div class="item-title">${escapeHtml(row.item_name)}</div>
            <div class="item-badge">待审核</div>
          </div>
          <div class="review-meta">
            盘点月份：${escapeHtml(row.closing_month)}<br>
            提交人：${escapeHtml(row.created_by_name || '-')} · ${escapeHtml(row.created_by_department || '-')}<br>
            账面结存：${Number(row.system_closing_qty || 0)} ${escapeHtml(row.unit || '')}　
            盘点合计：${Number(row.manual_total_qty || 0)} ${escapeHtml(row.unit || '')}　
            差异：${Number(row.difference_qty || 0)}<br>
            备注：${escapeHtml(row.remark || '无')}
          </div>
          <textarea class="review-input" id="reviewComment-${row.id}" placeholder="驳回时请填写审核意见，审核通过可留空"></textarea>
          <div class="review-actions">
            <button class="btn btn-warn" type="button" onclick="handleReview(${row.id}, 'rejected')">驳回</button>
            <button class="btn btn-good" type="button" onclick="handleReview(${row.id}, 'approved')">通过</button>
          </div>
        </div>
      `).join('');
    }

    async function handleReview(itemId, action) {
      try {
        const comment = document.getElementById(`reviewComment-${itemId}`)?.value?.trim() || '';
        await request(`/workwear/inventory-count/items/${itemId}/review`, {
          method: 'POST',
          body: JSON.stringify({ action, comment })
        });
        await Promise.all([refreshCurrentSession(), loadReviewTasks()]);
      } catch (err) {
        alert(err.message || '审核失败');
      }
    }

    async function loadReviewTasks() {
      try {
        reviewTasks = await request('/workwear/inventory-count/review-tasks');
        renderReviewTasks(reviewTasks || []);
      } catch (err) {
        renderReviewTasks([]);
      }
    }

    async function loadSession(closingMonth) {
      try {
        const payload = await request(`/workwear/inventory-count?closing_month=${encodeURIComponent(closingMonth || '')}`);
        currentPayload = payload;
        buildMonthSelect(payload);
        renderSummary(payload);
        renderTypeFilters(payload);
        renderItems(payload);
      } catch (err) {
        currentPayload = null;
        document.getElementById('itemList').innerHTML = `<div class="empty">${escapeHtml(err.message || '加载失败')}</div>`;
        document.getElementById('summaryGrid').innerHTML = `<div class="summary-box"><div class="summary-label">提示</div><div class="summary-value" style="font-size:14px">${escapeHtml(err.message || '加载失败')}</div></div>`;
        document.getElementById('typeFilterGrid').innerHTML = '';
      }
    }

    async function refreshCurrentSession() {
      if (!currentPayload?.session?.closing_month) return;
      await loadSession(currentPayload.session.closing_month);
    }

    async function completeCurrentSession() {
      if (!currentPayload?.session?.id) return;
      try {
        await request(`/workwear/inventory-count/${currentPayload.session.id}/complete`, { method: 'POST' });
        alert('本月结转盘存已完成');
        await refreshCurrentSession();
      } catch (err) {
        alert(err.message || '完成结转失败');
      }
    }

    async function init() {
      if (!window.EmployeeSession.ensureValid()) {
        window.EmployeeSession.redirectToLogin();
        return;
      }
      const hasEmployeeSession = !!localStorage.getItem('employee_token');
      if (hasEmployeeSession && !window.ModuleAccess.has('workwear-admin')) {
        window.ModuleAccess.redirectToAuth('mobile-workwear-inventory-count.html', 'workwear-admin', '工服管理');
        return;
      }
      try {
        const access = await request('/workwear/access');
        if (!access.can_manage) {
          location.href = 'employee.html';
          return;
        }
        const defaultInfo = await request('/workwear/inventory-count/default-month');
        document.getElementById('completeBtn').addEventListener('click', completeCurrentSession);
        await Promise.all([
          loadSession(defaultInfo.default_month),
          loadReviewTasks()
        ]);
      } catch (err) {
        document.getElementById('itemList').innerHTML = `<div class="empty">${escapeHtml(err.message || '加载失败')}</div>`;
      }
    }

    window.handleSave = handleSave;
    window.handleConfirm = handleConfirm;
    window.handleSubmitReview = handleSubmitReview;
    window.handleReview = handleReview;
    window.setItemLocationQty = setItemLocationQty;
    window.adjustItemLocationQty = adjustItemLocationQty;
    window.updateItemCardTotals = updateItemCardTotals;
    window.setTypeFilter = setTypeFilter;

    init();
  </script>
</body>
</html>
