<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>兴利汽车模具</title>
  <style>
    :root {
      --bg-top: #f7f9fc;
      --bg-bottom: #eef3f9;
      --card: rgba(255, 255, 255, 0.94);
      --card-border: rgba(140, 156, 180, 0.16);
      --primary: #3b82f6;
      --track: rgba(59, 130, 246, 0.14);
      --text: #1f2a3d;
      --text-soft: #72819a;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at 16% 18%, rgba(160, 174, 196, 0.12), transparent 28%),
        radial-gradient(circle at 84% 12%, rgba(59, 130, 246, 0.08), transparent 24%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text);
      overflow: hidden;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(10px);
      pointer-events: none;
    }
    body::before {
      width: 220px;
      height: 220px;
      right: -88px;
      top: 10%;
      background: rgba(59, 130, 246, 0.08);
    }
    body::after {
      width: 180px;
      height: 180px;
      left: -70px;
      bottom: 12%;
      background: rgba(148, 163, 184, 0.1);
    }
    .card {
      position: relative;
      width: min(100%, 360px);
      padding: 30px 24px 26px;
      border-radius: 22px;
      background: var(--card);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 48px rgba(31, 42, 61, 0.08);
      backdrop-filter: blur(12px);
      text-align: center;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.52), transparent 38%),
        linear-gradient(180deg, rgba(59, 130, 246, 0.03), transparent 42%);
      pointer-events: none;
    }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    p {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.6;
    }
    .progress {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 8px;
      margin-top: 24px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
    }
    .progress-bar {
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #60a5fa 0%, var(--primary) 100%);
      animation: loading 1.1s ease-in-out infinite;
      transform-origin: left center;
    }
    .tip {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-soft);
      line-height: 1.7;
    }
    @keyframes loading {
      0% {
        transform: translateX(-110%);
      }
      50% {
        transform: translateX(70%);
      }
      100% {
        transform: translateX(220%);
      }
    }
    @media (max-width: 420px) {
      .card {
        width: 100%;
        padding: 28px 18px 22px;
        border-radius: 20px;
      }
      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>登入中，请稍后</h1>
    <p>页面正在处理中，即将自动跳转。</p>
    <div class="progress" aria-hidden="true">
      <div class="progress-bar"></div>
    </div>
    <div class="tip">如果长时间没有跳转，请返回后重试。</div>
  </div>

  <script>
    (function () {
      function tryDecode(value) {
        try {
          return decodeURIComponent(value || "");
        } catch (err) {
          return value || "";
        }
      }

      function setIfPresent(key, value) {
        if (value) localStorage.setItem(key, value);
      }

      function parseStaff(text) {
        if (!text) return null;
        try {
          return JSON.parse(tryDecode(text));
        } catch (err) {
          return null;
        }
      }

      function targetUrl(pathname) {
        var search = window.location.search || "";
        var cleanSearch = search
          .replace(/([?&])miniapp_token=[^&]*/g, "$1")
          .replace(/([?&])miniapp_staff=[^&]*/g, "$1")
          .replace(/[?&]$/, "");
        if (cleanSearch === "?") cleanSearch = "";
        return pathname + cleanSearch;
      }

      var params = new URLSearchParams(window.location.search || "");
      var token = tryDecode(params.get("miniapp_token"));
      var staff = parseStaff(params.get("miniapp_staff"));
      if (token) setIfPresent("employee_token", token);
      if (staff) localStorage.setItem("employee_info", JSON.stringify(staff));

      var employeeToken = localStorage.getItem("employee_token") || "";
      var employeeInfo = localStorage.getItem("employee_info") || "";
      var next = employeeToken && employeeInfo
        ? targetUrl("/employee.html")
        : targetUrl("/index.html");

      window.location.replace(next);
    })();
  </script>
</body>
</html>
