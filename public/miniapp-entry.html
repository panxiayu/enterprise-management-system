<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>兴利汽车模具</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(74, 144, 226, 0.14), transparent 30%),
        linear-gradient(180deg, #f5f9ff 0%, #edf4ff 100%);
      color: #17325c;
    }
    .card {
      width: min(100%, 420px);
      padding: 28px 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(74, 144, 226, 0.12);
      box-shadow: 0 20px 48px rgba(44, 91, 151, 0.12);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(145deg, #2d74d8, #5aa7ff);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(74, 144, 226, 0.28);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
    }
    p {
      margin: 0;
      color: #5f7598;
      font-size: 14px;
      line-height: 1.7;
    }
    .tip {
      margin-top: 18px;
      font-size: 13px;
      color: #4a90e2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">兴</div>
    <h1>正在进入系统</h1>
    <p>小程序正在同步登录状态，并跳转到对应页面。</p>
    <div class="tip">如果长时间停留，请返回重试。</div>
  </div>

  <script>
    (function () {
      function tryDecode(value) {
        try {
          return decodeURIComponent(value || "");
        } catch (err) {
          return value || "";
        }
      }

      function setIfPresent(key, value) {
        if (value) localStorage.setItem(key, value);
      }

      function parseStaff(text) {
        if (!text) return null;
        try {
          return JSON.parse(tryDecode(text));
        } catch (err) {
          return null;
        }
      }

      function targetUrl(pathname) {
        var search = window.location.search || "";
        var cleanSearch = search
          .replace(/([?&])miniapp_token=[^&]*/g, "$1")
          .replace(/([?&])miniapp_staff=[^&]*/g, "$1")
          .replace(/[?&]$/, "");
        if (cleanSearch === "?") cleanSearch = "";
        return pathname + cleanSearch;
      }

      var params = new URLSearchParams(window.location.search || "");
      var token = tryDecode(params.get("miniapp_token"));
      var staff = parseStaff(params.get("miniapp_staff"));
      if (token) setIfPresent("employee_token", token);
      if (staff) localStorage.setItem("employee_info", JSON.stringify(staff));

      var employeeToken = localStorage.getItem("employee_token") || "";
      var employeeInfo = localStorage.getItem("employee_info") || "";
      var next = employeeToken && employeeInfo
        ? targetUrl("/employee.html")
        : targetUrl("/index.html");

      window.location.replace(next);
    })();
  </script>
</body>
</html>
